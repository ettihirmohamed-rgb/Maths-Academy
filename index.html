if(/solutions de/.test(s))return [c,X([`Je calcule Δ, puis x = (−b − √Δ) ÷ (2a) et x = (−b + √Δ) ÷ (2a).`,`Réponse : <b>${q.a}</b>.`],q.v)];
if(/Combien de solutions/.test(s))return [c,X([`Je calcule Δ = b² − 4ac.`,`Δ > 0 → 2 solutions ; Δ = 0 → 1 solution ; Δ < 0 → aucune solution réelle.`,`Réponse : <b>${q.a}</b>.`],q.v)];
return [c,X([`La somme des solutions vaut −b ÷ a.`,`Réponse : <b>${q.a}</b>.`],q.v)]};
HELP.p1_exp=q=>{const s=q.t,c=K('La fonction exponentielle','eᵃ × eᵇ = eᵃ⁺ᵇ. eᵃ ÷ eᵇ = eᵃ⁻ᵇ. (eᵃ)ᵇ = eᵃˣᵇ. La dérivée de e^(kx) est k × e^(kx). eˣ est toujours strictement positif','e² × e³ = e⁵ ; e⁶ ÷ e² = e⁴',gr(Math.exp,-2,2));
if(/×/.test(s))return [c,X([`Même base e : j’additionne les exposants.`,`Réponse : <b>${q.a}</b>.`])];
if(/÷/.test(s))return [c,X([`Même base e : je soustrais les exposants.`,`Réponse : <b>${q.a}</b>.`])];
if(/^\(e/.test(s))return [c,X([`Puissance d’une puissance : je multiplie les exposants.`,`Réponse : <b>${q.a}</b>.`])];
if(/dérivée de f\(x\) = e/.test(s))return [c,X([`La dérivée de e^(kx) est k fois e^(kx) (le facteur k descend devant).`,`Réponse : <b>${q.a}</b>.`],q.v)];
return [c,X([`Propriété à connaître sur la fonction exponentielle.`,`Réponse : <b>${q.a}</b>.`])]};
HELP.p1_suites=q=>{const s=q.t,c=K('Suites arithmétiques et géométriques','Arithmétique : on ajoute toujours la raison r → uₙ = u₀ + n × r. Géométrique : on multiplie toujours par la raison q → uₙ = u₀ × qⁿ','u₀ = 2, raison 3 (arithmétique) : u₄ = 2 + 4 × 3 = 14');
if(/arithmétique avec/.test(s)){const m=s.match(/u₀ = (.+?) et de raison (.+?)\. Calcule u(.+?)\./);return [c,X([`uₙ = u₀ + n × raison.`,`Je remplace n par son rang et je calcule.`,`Réponse : <b>${q.a}</b>.`])]}
if(/géométrique avec/.test(s))return [c,X([`uₙ = u₀ × raisonⁿ.`,`Je remplace n par son rang et je calcule la puissance.`,`Réponse : <b>${q.a}</b>.`])];
if(/Quelle est la raison/.test(s))return [c,X([`Dans une suite arithmétique, la raison est la différence entre deux termes qui se suivent.`,`raison = u${'ₙ₊₁'} − uₙ.`,`Réponse : <b>${q.a}</b>.`])];
if(/uₙ₊₁ =/.test(s))return [c,X([`Si on ajoute toujours le même nombre : suite arithmétique.`,`Si on multiplie toujours par le même nombre : suite géométrique.`,`Réponse : <b>${q.a}</b>.`])];
return [c,X([`J’observe le passage d’un terme au suivant : ajout constant = suite arithmétique.`,`Je continue avec la même règle pour trouver le terme suivant.`,`Réponse : <b>${q.a}</b>.`])]};
HELP.p1_scalaire=q=>{const s=q.t,c=K('Le produit scalaire','u(a ; b) · v(c ; d) = a × c + b × d. Deux vecteurs sont orthogonaux (perpendiculaires) si leur produit scalaire vaut 0. u · v = ‖u‖ × ‖v‖ × cos(angle)','u(2 ; 1) · v(3 ; 4) = 2×3 + 1×4 = 10',pg([[2,1,'u'],[3,4,'v']]));
if(/Calcule u · v\./.test(s)&&/‖u‖/.test(s))return [c,X([`Formule avec les normes : u · v = ‖u‖ × ‖v‖ × cos(angle).`,`Valeurs usuelles de cos : 0° → 1, 60° → 0,5, 90° → 0, 120° → −0,5, 180° → −1.`,`Réponse : <b>${q.a}</b>.`])];
if(/Calcule u · v\./.test(s))return [c,X([`u(a ; b) · v(c ; d) = a × c + b × d.`,`Je multiplie les abscisses entre elles, les ordonnées entre elles, puis j’additionne.`,`Réponse : <b>${q.a}</b>.`],q.v)];
if(/orthogonaux/.test(s))return [c,X([`Deux vecteurs sont orthogonaux si leur produit scalaire vaut exactement 0.`,`Je calcule u · v et je regarde s’il vaut 0.`,`Réponse : <b>${q.a}</b>.`],q.v)];
return [c,X([`u · u = a × a + b × b = a² + b² : c’est le carré de la norme du vecteur.`,`Réponse : <b>${q.a}</b>.`])]};
HELP.p1_proba=q=>{const s=q.t,c=K('Variables aléatoires','L’espérance E(X) = somme de chaque valeur × sa probabilité. La somme de toutes les probabilités vaut toujours 1. P(X ≥ k) = somme des probabilités des valeurs ≥ k','xᵢ : 1, 2 avec p : 0,3, 0,7 → E(X) = 1×0,3 + 2×0,7 = 1,7');
if(/espérance/.test(s))return [c,X([`E(X) = x₁×p₁ + x₂×p₂ + x₃×p₃.`,`Je multiplie chaque valeur par sa probabilité, puis j’additionne.`,`Réponse : <b>${q.a}</b>.`],q.v)];
if(/manquante/.test(s))return [c,X([`La somme de toutes les probabilités vaut 1.`,`p manquante = 1 − (somme des autres probabilités).`,`Réponse : <b>${q.a}</b>.`],q.v)];
return [c,X([`P(X ≥ k) = somme des probabilités des valeurs supérieures ou égales à k.`,`Réponse : <b>${q.a}</b>.`],q.v)]};
/* Terminale */
HELP.p1_deriv=q=>{const s=q.t,c=K('Le nombre dérivé','Le nombre dérivé f’(x) mesure la pente de la courbe. Pour f(x) = ax² + bx + c, f’(x) = 2ax + b. Pour f(x) = ax + b (droite), f’(x) = a. Pour f(x) = xⁿ, f’(x) = n·xⁿ⁻¹','f(x) = x² + 3x : f’(x) = 2x + 3',gr(x=>x*x+3*x,-4,1));let m;
if(/nombre dérivé/.test(s)){const mm=s.match(/f’\(([\-\d]+)\)\./);return [c,X([`f(x) = ax² + bx + c a pour dérivée f’(x) = 2ax + b.`,`Je remplace x par ${mm[1]} dans 2ax + b.`,`Réponse : <b>${q.a}</b>.`],q.v)]}
if(m=s.match(/f\(x\) = x([⁰¹²³⁴⁵⁶⁷⁸⁹]+) \?/)){const n=US(m[1]);return [c,X([`La dérivée de xⁿ est n × xⁿ⁻¹.`,`Ici n = ${n} : dérivée = ${n}x${n-1==1?'':US==0?'':''}.`,`Réponse : <b>${q.a}</b>.`])]}
if(/x \+|x −/.test(s)&&/f’\(x\) \?/.test(s))return [c,X([`f(x) = ax + b est une droite : sa pente (dérivée) est constante, c’est le nombre a devant x.`,`Réponse : <b>${q.a}</b>.`])];
return [c,X([`f(x) = ax² a pour dérivée f’(x) = 2ax.`,`Réponse : <b>${q.a}</b>.`])]};
HELP.term_lim=q=>{const s=q.t,c=K('Limites','k/x tend vers 0 quand x tend vers l’infini. Si le degré du numérateur = degré du dénominateur, la limite est le rapport des coefficients dominants. Un polynôme a la limite de son terme de plus haut degré','2x² + 3x tend vers +∞ en +∞ (le terme x² domine)',gr(x=>2*x*x+3*x,-3,3));
let m;
if(m=s.match(/\((\d+)x (.) (\d+)\) \/ \((\d+)x (.) (\d+)\)/))return [c,X([`Quand x est très grand, seuls les termes en x comptent (les nombres seuls deviennent négligeables).`,`Le rapport des coefficients devant x : ${m[1]} ÷ ${m[4]} = <b>${q.a}</b>.`])];
if(/0 avec x > 0/.test(s)){const k=SN(s)[0];return [c,X([`Quand x se rapproche de 0 par valeurs positives, 1/x devient très grand.`,`Le signe de la limite est celui de k (ici ${k>0?'positif':'négatif'}).`,`Réponse : <b>${q.a}</b>.`],q.v)]}
if(/x²|x³|x⁴|x⁵|x⁶|x⁷/.test(s)&&/−∞ \?/.test(s))return [c,X([`En −∞, le signe dépend du coefficient et de la parité de l’exposant.`,`Exposant pair : xⁿ devient +∞ ; exposant impair : xⁿ devient −∞ (quand x → −∞).`,`Je combine ce signe avec celui du coefficient devant x.`,`Réponse : <b>${q.a}</b>.`])];
if(/x²/.test(s))return [c,X([`Quand x est très grand, c’est le terme de plus haut degré (x²) qui domine les autres.`,`Le signe de la limite est celui du coefficient devant x².`,`Réponse : <b>${q.a}</b>.`],q.v)];
return [c,X([`k/x se rapproche de 0 quand x devient très grand.`,`Réponse : <b>${q.a}</b>.`],q.v)]};
HELP.term_continuite=q=>{const s=q.t,c=K('Continuité et TVI','Le théorème des valeurs intermédiaires (TVI) : si f est continue sur [a ; b] et si f(a) et f(b) sont de signes contraires, alors f(x) = 0 a une solution entre a et b','f(0) = −2 et f(3) = 7 : signes contraires → il existe une solution entre 0 et 3');
if(/valeurs intermédiaires garantit/.test(s)){const m=s.match(/f\((\d+)\) = (.+?) et f\((\d+)\) = (.+?)\. Le/);return [c,X([`Je regarde le signe de f(a) et de f(b).`,`f(${m[1]}) = ${m[2]} et f(${m[3]}) = ${m[4]}.`,cl2(m[2])*cl2(m[4])<0?'Les signes sont contraires : le TVI garantit une solution.':'Les signes sont identiques : rien n’est garanti.',`Réponse : <b>${q.a}</b>.`],q.v)]}
return [c,X([`Propriété à connaître sur la continuité.`,`Réponse : <b>${q.a}</b>.`])]};
HELP.term_log=q=>{const s=q.t,c=K('Le logarithme népérien','ln(a) + ln(b) = ln(a×b). ln(a) − ln(b) = ln(a/b). ln(aⁿ) = n×ln(a). ln(e^k) = k. ln(x) = k équivaut à x = e^k. La dérivée de ln(x) est 1/x','ln(6) = ln(2) + ln(3) ; ln(e³) = 3',gr(Math.log,.2,8));let m;
if(/\+ ln/.test(s))return [c,X([`ln(a) + ln(b) = ln(a × b).`,`Réponse : <b>${q.a}</b>.`])];
if(/− ln/.test(s))return [c,X([`ln(a) − ln(b) = ln(a ÷ b).`,`Réponse : <b>${q.a}</b>.`])];
if(m=s.match(/ln\((\d+)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)\)/))return [c,X([`ln(aⁿ) = n × ln(a).`,`Réponse : <b>${q.a}</b>.`])];
if(/ln\(e/.test(s))return [c,X([`ln et e^ s’annulent l’un l’autre : ln(e^k) = k.`,`Réponse : <b>${q.a}</b>.`])];
if(/Résous ln\(x\)/.test(s))return [c,X([`ln(x) = k équivaut à x = e^k (on applique la fonction exponentielle des deux côtés).`,`Réponse : <b>${q.a}</b>.`])];
if(/Résous e\^x/.test(s))return [c,X([`e^x = a équivaut à x = ln(a) (on applique ln des deux côtés).`,`Réponse : <b>${q.a}</b>.`])];
return [c,X([`La dérivée de a × ln(x) est a ÷ x (car la dérivée de ln(x) est 1/x).`,`Réponse : <b>${q.a}</b>.`])]};
HELP.term_integrales=q=>{const s=q.t,c=K('Les intégrales','Une intégrale calcule une aire sous la courbe. Intégrale d’une constante k de a à b : k × (b − a). Une primitive de kx est (k/2)x². L’intégrale de x² de 0 à m est m³/3','Intégrale de 5 de 2 à 4 : 5 × (4 − 2) = 10');
if(/fonction constante/.test(s)){const m=s.match(/de (\d+) à (\d+).*f\(x\) = (\d+)/);return [c,X([`Aire d’un rectangle : hauteur × largeur.`,`${m[3]} × (${m[2]} − ${m[1]}) = <b>${q.a}</b>.`])]}
if(/f\(x\) = 2x\./.test(s)){const m=s.match(/de (\d+) à (\d+)/);return [c,X([`Une primitive de 2x est x².`,`Je calcule primitive(b) − primitive(a) = ${m[2]}² − ${m[1]}² = <b>${q.a}</b>.`])]}
if(/primitive/.test(s)){const k=N(q)[0];return [c,X([`La dérivée de x² est 2x, donc une primitive de 2kx est kx².`,`Ici le coefficient est ${k}, la primitive cherchée est <b>${q.a}</b>.`])]}
const m=N(q);return [c,X([`Une primitive de x² est x³/3.`,`J’applique primitive(m) − primitive(0) = ${m[m.length-1]}³ ÷ 3 = <b>${q.a}</b>.`],q.v)]};
HELP.term_espace=q=>{const s=q.t,c=K('Géométrie dans l’espace','Avec 3 coordonnées (x ; y ; z) : vecteur AB = (x<sub>B</sub>−x<sub>A</sub> ; y<sub>B</sub>−y<sub>A</sub> ; z<sub>B</sub>−z<sub>A</sub>). Milieu = moyenne coordonnée par coordonnée. Distance : Pythagore en 3D, √(x²+y²+z²). Produit scalaire : on multiplie puis on additionne les 3 coordonnées','A(0;0;0), B(2;3;6) : AB(2;3;6), distance = √(4+9+36) = 7');
if(/vecteur AB/.test(s))return [c,X([`Je soustrais coordonnée par coordonnée : x<sub>B</sub> − x<sub>A</sub>, puis y, puis z.`,`Réponse : <b>${q.a}</b>.`])];
if(/milieu/.test(s))return [c,X([`Le milieu est la moyenne de chaque coordonnée : (x<sub>A</sub>+x<sub>B</sub>)/2, etc.`,`Réponse : <b>${q.a}</b>.`])];
if(/distance AB/.test(s))return [c,X([`Distance = √(x² + y² + z²) avec les coordonnées du vecteur AB.`,`C’est le théorème de Pythagore en 3 dimensions.`,`Réponse : <b>${q.a}</b>.`])];
return [c,X([`Produit scalaire en 3D : u · v = x×x′ + y×y′ + z×z′.`,`Réponse : <b>${q.a}</b>.`])]};
HELP.term_binomiale=q=>{const s=q.t,c=K('La loi binomiale','X suit B(n ; p) : n répétitions indépendantes, chacune avec une probabilité de succès p. E(X) = n × p. V(X) = n × p × (1 − p). P(X = k) = C(n,k) × pᵏ × (1−p)ⁿ⁻ᵏ','B(10 ; 0,3) : E(X) = 10 × 0,3 = 3');

if(/Calcule V\(X\)/.test(s)){const m=s.match(/B\((\d+) ; (.+?)\)/);return [c,X([`V(X) = n × p × (1 − p).`,`= ${m[1]} × ${m[2]} × (1 − ${m[2]}) = <b>${q.a}</b>.`])]}
if(/coefficient binomial/.test(s)){const m=s.match(/« (\d+) parmi (\d+) »/);return [c,X([`« k parmi n » compte le nombre de façons de choisir k éléments parmi n, sans tenir compte de l’ordre.`,`Réponse : <b>${q.a}</b>.`])]}
return [c,X([`P(X = k) = C(n,k) × 0,5ᵏ × 0,5ⁿ⁻ᵏ = C(n,k) ÷ 2ⁿ (car p = 0,5).`,`Réponse : <b>${q.a}</b>.`])]};

const modal=h=>{$('md').innerHTML=h?`<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onclick="modal()"><div onclick="event.stopPropagation()" class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl p-5 max-w-lg w-full max-h-[85vh] overflow-y-auto text-left text-sm">${h}<button onclick="modal()" class="mt-4 w-full bg-indigo-600 font-black py-3 rounded-2xl">Fermer ✅</button></div></div>`:'';if(!h&&window.speechSynthesis)speechSynthesis.cancel()};

const cfg=()=>{const vs=window.speechSynthesis?speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)).sort((a,b)=>vsc(b)-vsc(a)):[];modal(`<h3 class="font-black text-lg mb-3">⚙️ Voix</h3>${vs.length?`<select onchange="setV(this.value)" class="w-full bg-slate-800 rounded-xl p-2 mb-3">${vs.map(v=>`<option value="${v.name}" ${VO&&VO.name==v.name?'selected':''}>${vsc(v)>=100?'⭐ HD · ':''}${v.name}</option>`).join('')}</select><label class="text-xs">Vitesse</label><input type="range" min="0.6" max="1.3" step="0.05" value="${RATE}" oninput="setR(this.value)" class="w-full mb-3"><button onclick="say('Bonjour, je suis ta voix pour apprendre les maths !')" class="w-full bg-slate-800 py-2 rounded-xl">🔊 Tester</button><p class="text-xs text-slate-400 mt-3">Les voix ⭐ HD (Natural / Online) apparaissent dans Edge, ou si elles sont installées dans Windows.</p>`:'<p>Aucune voix française trouvée sur cet appareil.</p>'}`)};
const setV=n=>{VO=speechSynthesis.getVoices().find(v=>v.name==n)||VO;try{localStorage.setItem('ma_voice',n)}catch(e){}say('Bonjour, voici ma voix !')},setR=v=>{RATE=+v;try{localStorage.setItem('ma_rate',v)}catch(e){}};

/* ---------- Duel (multiplication) : 2 joueurs face à face, premier à 10 ---------- */
const duel=id=>{const p2=prompt('Prénom du joueur 2 ?','Joueur 2')||'Joueur 2';clearInterval(S.tm);S.m=id;S.D={n:[S.u,p2],s:[0,0],l:[0,0],d:0,w:-1};dn()};

const dr=()=>{const D=S.D;if(D.w>=0)return H(`<div class="min-h-screen flex items-center justify-center p-4 text-center"><div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 pop"><div class="text-6xl mb-3">🏆</div><h2 class="text-2xl font-black mb-5">${D.n[D.w]} gagne ${D.s[D.w]} à ${D.s[1-D.w]} !</h2><div class="flex gap-3 justify-center"><button onclick="rp()" class="${BP} px-5">Rejouer</button><button onclick="home()" class="bg-slate-800 font-black px-5 rounded-xl text-sm">Menu</button></div></div></div>`);H(`<div class="min-h-screen flex flex-col">${dp(1)}<div class="flex justify-between items-center bg-slate-900 px-3 py-2"><button onclick="home()" class="bg-slate-800 px-3 py-1 rounded-xl text-xs font-black">← MENU</button><b class="text-xs text-amber-400">⚔️ Premier à 10 points</b><span><button class="mt px-2" onclick="tg()">${mute?'🔇':'🔊'}</button><button class="px-2" onclick="say(S.q.t)">🔁</button></span></div>${dp(0)}</div>`)};
const da=(p,i)=>{const D=S.D,q=S.q;if(D.d||D.l[p])return;if(q.o[i]==q.a){D.d=1;D.s[p]++;snd(1);cf();if(D.s[p]>=10){D.w=p;dr();say(`${D.n[p]} gagne la partie !`);return}dr();say(`Point pour ${D.n[p]} !`);setTimeout(dn,1200)}else{D.l[p]=1;snd(0);if(D.l[0]&&D.l[1]){D.d=1;setTimeout(dn,1000)}dr()}};
applyTheme();
