<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathia - Apprendre les Maths en s'amusant</title>

  <!-- PWA & Mobile Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel CDN (pour exécuter JSX directement dans le navigateur) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen flex flex-col">

  <!-- Div racine pour React -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- Script Application React -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [view, setView] = useState('home'); // 'home', 'game', 'parents'
      const [score, setScore] = useState(0);
      const [numA, setNumA] = useState(0);
      const [numB, setNumB] = useState(0);
      const [userAnswer, setUserAnswer] = useState('');
      const [feedback, setFeedback] = useState(null);
      const qrRef = useRef(null);

      // Génération d'un problème simple
      const generateProblem = () => {
        setNumA(Math.floor(Math.random() * 10) + 1);
        setNumB(Math.floor(Math.random() * 10) + 1);
        setUserAnswer('');
        setFeedback(null);
      };

      useEffect(() => {
        generateProblem();
      }, []);

      // Génération du QR Code dans la section Parents
      useEffect(() => {
        if (view === 'parents' && qrRef.current) {
          qrRef.current.innerHTML = '';
          new QRCode(qrRef.current, {
            text: window.location.href,
            width: 160,
            height: 160,
            colorDark: "#4f46e5",
            colorLight: "#ffffff",
          });
        }
      }, [view]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const expected = numA + numB;
        if (parseInt(userAnswer, 10) === expected) {
          setScore(score + 10);
          setFeedback('correct');
          setTimeout(() => generateProblem(), 1200);
        } else {
          setFeedback('incorrect');
        }
      };

      return (
        <div className="max-w-md mx-auto w-full min-h-screen bg-white shadow-md flex flex-col justify-between">
          
          {/* En-tête */}
          <header className="bg-indigo-600 text-white p-4 text-center rounded-b-2xl shadow-sm">
            <h1 className="text-2xl font-bold tracking-wide">Mathia 🧠</h1>
            <p className="text-xs text-indigo-100 mt-1">L'application éducative interactive</p>
          </header>

          {/* Contenu principal */}
          <main className="p-6 flex-1 flex flex-col justify-center items-center">
            
            {/* Vue Accueil */}
            {view === 'home' && (
              <div className="text-center space-y-6">
                <div className="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mx-auto shadow-inner">
                  <span className="text-5xl">✨</span>
                </div>
                <h2 className="text-xl font-bold text-slate-800">Prêt à réviser tes maths ?</h2>
                <button 
                  onClick={() => setView('game')}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 px-6 rounded-xl font-semibold shadow-md transition transform active:scale-95"
                >
                  Démarrer le jeu
                </button>
              </div>
            )}

            {/* Vue Jeu */}
            {view === 'game' && (
              <div className="w-full text-center space-y-6">
                <div className="flex justify-between items-center bg-slate-100 px-4 py-2 rounded-lg text-sm font-semibold">
                  <span>Score: <strong className="text-indigo-600">{score} pts</strong></span>
                  <button onClick={generateProblem} className="text-slate-500 underline text-xs">Sauter</button>
                </div>

                <div className="p-8 bg-indigo-50 border-2 border-indigo-100 rounded-2xl shadow-sm">
                  <span className="text-4xl font-extrabold text-indigo-900">{numA} + {numB} = ?</span>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <input
                    type="number"
                    value={userAnswer}
                    onChange={(e) => setUserAnswer(e.target.value)}
                    placeholder="Ta réponse..."
                    className="w-full text-center text-2xl p-3 border-2 border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500"
                    autoFocus
                  />
                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl font-bold text-lg shadow-md transition"
                  >
                    Valider
                  </button>
                </form>

                {feedback === 'correct' && (
                  <p className="text-emerald-600 font-bold animate-bounce">Bravo ! +10 points 🎉</p>
                )}
                {feedback === 'incorrect' && (
                  <p className="text-rose-500 font-bold">Oups ! Réessaie encore 💪</p>
                )}
              </div>
            )}

            {/* Vue Espace Parents / QR Code */}
            {view === 'parents' && (
              <div className="text-center space-y-4">
                <h2 className="text-lg font-bold text-slate-800">Espace Partage & Installation</h2>
                <p className="text-xs text-slate-500 max-w-xs mx-auto">
                  Scannez ce QR code avec un smartphone pour ouvrir et installer Mathia directement sur votre appareil.
                </p>
                
                <div className="p-4 bg-white border border-slate-200 rounded-xl inline-block shadow-sm">
                  <div ref={qrRef} className="flex justify-center"></div>
                </div>

                <p className="text-xs font-mono text-slate-400 break-all px-4">{window.location.href}</p>
              </div>
            )}

          </main>

          {/* Navigation bas de page */}
          <nav className="bg-slate-100 border-t border-slate-200 flex justify-around p-3 text-xs font-medium">
            <button 
              onClick={() => setView('home')} 
              className={`p-2 rounded-lg ${view === 'home' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}
            >
              🏠 Accueil
            </button>
            <button 
              onClick={() => setView('game')} 
              className={`p-2 rounded-lg ${view === 'game' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}
            >
              🎮 Exercices
            </button>
            <button 
              onClick={() => setView('parents')} 
              className={`p-2 rounded-lg ${view === 'parents' ? 'text-indigo-600 font-bold' : 'text-slate-500'}`}
            >
              👨‍👩‍👧 Parents / QR
            </button>
          </nav>

        </div>
      );
    }

    // Enregistrement du Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker enregistré avec succès.'))
          .catch((err) => console.log('Échec de l\'enregistrement du SW:', err));
      });
    }

    // Rendu React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
