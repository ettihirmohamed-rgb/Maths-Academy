      c6_donnees: { title: "Tableaux & diagrammes", why: "Organiser et lire des informations chiffrées.", rule: "On lit l'intersection d'une ligne et d'une colonne. Les diagrammes en bâtons comparent des quantités." },

      // 5ème
      c5_relatifs: { title: "Nombres relatifs", why: "Représenter des quantités négatives (températures, dettes, altitudes...).", rule: "Sur une droite graduée : à gauche du 0 = négatif. −3 + 5 = 2. On se déplace vers la droite pour ajouter." },
      c5_litteral: { title: "Calcul littéral", why: "Manipuler des expressions avec des lettres (variables).", rule: "3x + 5x = 8x. On regroupe les termes semblables. x représente un nombre inconnu." },
      c5_symetrie: { title: "Symétrie centrale", why: "Rotation de 180° autour d'un point (le centre).", rule: "Le centre est le milieu du segment qui joint un point à son image. Conserve distances et angles." },
      c5_parallelo: { title: "Parallélogrammes", why: "Étudier les quadrilatères à côtés parallèles deux à deux.", rule: "Côtés opposés parallèles et de même longueur. Diagonales se coupent en leur milieu." },
      c5_moyenne: { title: "Moyenne & fréquences", why: "Résumer une série de données par un seul nombre.", rule: "Moyenne = somme des valeurs ÷ nombre de valeurs. Fréquence = effectif / effectif total." },

      // 4ème
      c4_relatifs: { title: "Relatifs × et ÷", why: "Multiplier et diviser des nombres relatifs.", rule: "Règle des signes : (+)×(+)=+  (−)×(−)=+  (+)×(−)=−  (−)×(+)=−. Même chose pour la division." },
      c4_puissances: { title: "Puissances", why: "Écrire les grands nombres et les multiplications répétées de façon compacte.", rule: "aⁿ = a × a × ... × a (n fois). 10³ = 1000. 2⁴ = 16." },
      c4_litteral: { title: "Développement & équations", why: "Développer des expressions et résoudre des équations simples.", rule: "3(x+4) = 3x+12 (distributivité). Pour résoudre 2x=10, on divise les deux côtés par 2 → x=5." },
      c4_pythagore: { title: "Théorème de Pythagore", why: "Calculer la longueur d'un côté dans un triangle rectangle.", rule: "Dans un triangle rectangle : a² + b² = c² où c est l'hypoténuse (le côté le plus long, opposé à l'angle droit)." },
      c4_proba: { title: "Probabilités simples", why: "Mesurer le hasard sur une épreuve.", rule: "Probabilité = nombre de cas favorables / nombre de cas possibles. Entre 0 et 1." },

      // 3ème
      c3_arithmetique: { title: "Nombres premiers & PGCD", why: "Comprendre la décomposition des nombres et les diviseurs communs.", rule: "Un nombre premier n'a que deux diviseurs : 1 et lui-même (2, 3, 5, 7, 11, 13, 17...). PGCD = plus grand diviseur commun." },
      c3_equations: { title: "Équations & inéquations", why: "Trouver la (ou les) valeur(s) inconnue(s) qui rendent une égalité vraie.", rule: "On isole x en faisant la même opération des deux côtés. 2x+5=13 → 2x=8 → x=4." },
      c3_fonctions: { title: "Fonctions linéaires & affines", why: "Modéliser des situations de proportionnalité ou de variation constante.", rule: "Linéaire : f(x)=ax (passe par l'origine). Affine : f(x)=ax+b (droite de pente a et ordonnée à l'origine b)." },
      c3_thales: { title: "Théorème de Thalès", why: "Calculer des longueurs dans des configurations de triangles emboîtés ou « en papillon ».", rule: "Si (DE) // (BC) dans le triangle ABC, alors AD/AB = AE/AC = DE/BC." },
      c3_trigo: { title: "Trigonométrie", why: "Relier les longueurs des côtés aux mesures des angles dans un triangle rectangle.", rule: "cos(α) = côté adjacent / hypoténuse. sin(α) = côté opposé / hypoténuse. tan(α) = opposé / adjacent." },
      c3_proba: { title: "Probabilités à 2 épreuves", why: "Calculer des probabilités d'événements composés (arbres).", rule: "On multiplie les probabilités le long des branches. P(A et B) = P(A) × P(B|A)." },

      // Seconde
      sec_ensembles: { title: "Ensembles & intervalles", why: "Décrire des ensembles de nombres de façon précise.", rule: "[a ; b] = fermé (inclut a et b). ]a ; b[ = ouvert (exclut a et b). +∞ et −∞ ne sont jamais inclus." },
      sec_fonctions: { title: "Fonctions de référence", why: "Connaître les fonctions de base (carré, inverse, racine, cube...).", rule: "f(x)=x² est paire et positive. f(x)=1/x est définie sur ℝ*. f(x)=√x définie pour x≥0." },
      sec_variations: { title: "Sens de variation", why: "Décrire si une fonction monte ou descend.", rule: "Croissante : x1 < x2 ⇒ f(x1) ≤ f(x2). Strictement croissante : l'inégalité est stricte. La courbe monte de gauche à droite." },
      sec_vecteurs: { title: "Vecteurs & relation de Chasles", why: "Calculer et raisonner avec des déplacements.", rule: "Relation de Chasles : vecteur AB + vecteur BC = vecteur AC. Le vecteur nul a une norme nulle." },
      sec_proba: { title: "Probabilités conditionnelles", why: "Calculer la probabilité d'un événement sachant qu'un autre s'est réalisé.", rule: "P(A|B) = P(A∩B) / P(B). On utilise souvent un arbre de probabilités." },

      // 1ère
      p1_second: { title: "Équations du second degré", why: "Résoudre les équations de la forme ax² + bx + c = 0.", rule: "Discriminant Δ = b² − 4ac. Si Δ>0 → 2 solutions. Δ=0 → 1 solution. Δ<0 → pas de solution réelle." },
      p1_derivee: { title: "Dérivation", why: "Mesurer la vitesse de variation instantanée (pente de la tangente).", rule: "Dérivée de x² = 2x. Dérivée de xⁿ = n x^{n−1}. Dérivée d'une constante = 0. Dérivée de eˣ = eˣ." },
      p1_exp: { title: "Fonction exponentielle", why: "Modéliser les croissances et décroissances (intérêts, populations, radioactivité...).", rule: "eˣ est toujours positive. (eˣ)' = eˣ. e⁰ = 1. eˣ × eʸ = e^{x+y}." },
      p1_suites: { title: "Suites arithmétiques & géométriques", why: "Décrire des suites de nombres qui évoluent de façon régulière.", rule: "Arithmétique : uₙ₊₁ = uₙ + r. Géométrique : uₙ₊₁ = uₙ × q. Formules explicites : uₙ = u₀ + n r  et  uₙ = u₀ × qⁿ." },
      p1_scalaire: { title: "Produit scalaire", why: "Mesurer l'angle et l'orthogonalité de deux vecteurs.", rule: "u · v = 0 ⇔ u et v sont orthogonaux. u · v = ||u|| × ||v|| × cos(θ). u · u = ||u||²." },

      // Terminale
      term_limites: { title: "Limites", why: "Étudier le comportement d'une fonction aux bornes de son ensemble de définition ou à l'infini.", rule: "lim (x→+∞) 1/x = 0. lim (x→+∞) x² = +∞. lim (x→0⁺) 1/x = +∞. On utilise les opérations sur les limites et les formes indéterminées." },
      term_continuite: { title: "Continuité & TVI", why: "Garantir l'existence de solutions et le comportement « sans saut » d'une fonction.", rule: "Une fonction continue sur [a ; b] atteint toutes les valeurs entre f(a) et f(b) (Théorème des Valeurs Intermédiaires)." },
      term_log: { title: "Logarithme népérien", why: "Fonction réciproque de l'exponentielle. Très utilisée en sciences.", rule: "ln(eˣ) = x et e^{ln(x)} = x. (ln x)' = 1/x. ln(a×b) = ln a + ln b. ln(1) = 0. ln(e) = 1." },
      term_integrales: { title: "Intégrales", why: "Calculer des aires, des primitives, des valeurs moyennes...", rule: "Si F' = f, alors ∫ₐᵇ f(x) dx = F(b) − F(a). L'intégrale de 0 à 1 de 2x dx = [x²]₀¹ = 1." },
      term_binomiale: { title: "Loi binomiale", why: "Modéliser le nombre de succès dans n épreuves identiques et indépendantes.", rule: "X ~ B(n, p). Espérance = n×p. Variance = n×p×(1−p). P(X=k) = C(n,k) × pᵏ × (1−p)^{n−k}." }
    };

    // ======================================================
    // VOCAL
    // ======================================================
    const speak = (text) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const clean = String(text).replace(/[^\wÀ-ÿ\s.,!?€°×÷+\-/=]/gi, ' ').replace(/\s+/g, ' ').trim();
      if (!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'fr-FR';
      u.rate = 0.9;
      u.pitch = 1.05;
      const voices = window.speechSynthesis.getVoices();
      const fr = voices.find(v => v.lang.startsWith('fr') && (v.name.includes('Natural') || v.name.includes('Google'))) ||
                voices.find(v => v.lang.startsWith('fr'));
      if (fr) u.voice = fr;
      window.speechSynthesis.speak(u);
    };

    // ======================================================
    // GÉNÉRATEUR DE QUESTIONS – FORTEMENT ENRICHI
    // ======================================================
    function generateQuestion(type, grade) {
      const r = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      const pick = (arr) => arr[r(0, arr.length - 1)];
      let text = '', ans = '', opts = [], speakText = '';

      // ——— MATERNELLE ———
      if (type === 'ps_formes') {
        const qs = [
          { t: "Où est le rond ?", a: "🔴", o: ["🔴", "🟦", "🔺", "⭐"] },
          { t: "Où est le carré ?", a: "🟦", o: ["🔴", "🟦", "🔺", "⭐"] },
          { t: "Où est le triangle ?", a: "🔺", o: ["🔴", "🟦", "🔺", "⭐"] },
          { t: "Quelle forme n'a pas de côtés ?", a: "🔴", o: ["🔴", "🟦", "🔺", "⭐"] }
        ];
        const q = pick(qs); text = q.t; ans = q.a; opts = q.o; speakText = q.t;
      } else if (type === 'ps_count3') {
        const n = r(1, 3);
        const emoji = pick(["⭐", "🍎", "🔵", "🐶"]);
        text = `Combien ?\n${emoji.repeat(n)}`;
        speakText = `Combien y en a-t-il ?`;
        ans = `${n}`; opts = ["1", "2", "3"];
      } else if (type === 'ps_tailles') {
        const qs = [
          { t: "Qui est le plus grand ?", a: "🐘", o: ["🐘", "🐭", "🐱", "🐶"] },
          { t: "Qui est le plus petit ?", a: "🐭", o: ["🐘", "🐭", "🐱", "🐶"] },
          { t: "Qui est plus grand que le chat ?", a: "🐘", o: ["🐘", "🐭", "🐱", "🐶"] }
        ];
        const q = pick(qs); text = q.t; ans = q.a; opts = q.o; speakText = q.t;
      } else if (type === 'ps_espace') {
        const qs = [
          { t: "Où est le soleil ?", a: "☁️ En haut", o: ["☁️ En haut", "⬇️ En bas"] },
          { t: "Où sont les pieds ?", a: "⬇️ En bas", o: ["☁️ En haut", "⬇️ En bas"] },
          { t: "Le ciel est...", a: "☁️ En haut", o: ["☁️ En haut", "⬇️ En bas"] }
        ];
        const q = pick(qs); text = q.t; ans = q.a; opts = q.o; speakText = q.t;
      } else if (type === 'ms_count6') {
        const n = r(3, 6);
        const emoji = pick(["🍎", "⭐", "🔵", "🐸"]);
        text = `Combien ?\n${emoji.repeat(n)}`;
        speakText = "Compte bien.";
        ans = `${n}`; opts = [`${n}`, `${n+1}`, `${Math.max(1,n-1)}`, `${n+2}`].filter((v,i,a)=>a.indexOf(v)===i);
      } else if (type === 'ms_associer') {
        const n = r(1, 6);
        text = `Quel chiffre pour\n${'🔵'.repeat(n)} ?`;
        speakText = "Quel chiffre correspond ?";
        ans = `${n}`; opts = [`${n}`, `${n+1}`, `${Math.max(1,n-1)}`, `${n+2}`];
      } else if (type === 'ms_formes') {
        const qs = [
          { t: "Quelle forme a 3 côtés ?", a: "🔺", o: ["🔺", "🟦", "🔴", "▭"] },
          { t: "Quelle forme a 4 côtés égaux ?", a: "🟦", o: ["🔺", "🟦", "🔴", "▭"] },
          { t: "Quelle forme est ronde ?", a: "🔴", o: ["🔺", "🟦", "🔴", "▭"] }
        ];
        const q = pick(qs); text = q.t; ans = q.a; opts = q.o; speakText = q.t;
      } else if (type === 'ms_rythme') {
        const patterns = [
          { t: "🔴 🔵 🔴 🔵 ...", a: "🔴" },
          { t: "⭐ ⭐ 🔵 ⭐ ⭐ 🔵 ...", a: "⭐" },
          { t: "🟢 🟡 🟢 🟡 ...", a: "🟢" },
          { t: "🐶 🐱 🐶 🐱 ...", a: "🐶" }
        ];
        const p = pick(patterns);
        text = `Quel est le suivant ?\n${p.t}`;
        speakText = "Quel est le suivant dans la suite ?";
        ans = p.a; opts = [p.a, "🔵", "🟢", "🟡"];
      } else if (type === 'ms_comparer') {
        const a = r(3, 6), b = r(1, a-1);
        text = `Quelle collection a le plus ?\n${'⭐'.repeat(a)}   ou   ${'🍎'.repeat(b)}`;
        speakText = "Quelle collection a le plus d'objets ?";
        ans = '⭐'.repeat(a); opts = ['⭐'.repeat(a), '🍎'.repeat(b)];
      } else if (type === 'gs_chaine') {
        const n = r(2, 12);
        const variants = [
          { t: `Quel nombre vient après ${n} ?`, a: `${n+1}` },
          { t: `Quel nombre vient juste avant ${n} ?`, a: `${n-1}` },
          { t: `Quel nombre est entre ${n-1} et ${n+1} ?`, a: `${n}` }
        ];
        const v = pick(variants);
        text = v.t; ans = v.a; speakText = v.t;
        opts = [v.a, `${+v.a+1}`, `${+v.a-1}`, `${+v.a+2}`];
      } else if (type === 'gs_decomp') {
        const n = r(4, 10);
        const p = r(1, n-1);
        text = `${n} c'est ${p} et encore ... ?`;
        speakText = `${n} c'est ${p} et encore combien ?`;
        ans = `${n-p}`; opts = [`${n-p}`, `${n-p+1}`, `${n}`, "1"];
      } else if (type === 'gs_formes') {
        const qs = [
          { t: "Quelle forme a 4 côtés égaux et 4 angles droits ?", a: "🟦 Carré" },
          { t: "Quelle forme a 3 côtés ?", a: "🔺 Triangle" },
          { t: "Quelle forme n'a aucun côté ?", a: "🔴 Cercle" },
          { t: "Quelle forme a 4 côtés dont 2 longs et 2 courts ?", a: "▭ Rectangle" }
        ];
        const q = pick(qs); text = q.t; ans = q.a; speakText = q.t;
        opts = ["🟦 Carré", "▭ Rectangle", "🔺 Triangle", "🔴 Cercle"];
      } else if (type === 'gs_espace') {
        const qs = [
          { t: "Ma main droite pointe vers...", a: "👉 L'est" },
          { t: "Le contraire de gauche est...", a: "👉 Droite" },
          { t: "Au-dessus de ma tête se trouve...", a: "⬆️ Le haut" }
        ];
        const q = pick(qs); text = q.t; ans = q.a; speakText = q.t;
        opts = ["👉 L'est", "👈 L'ouest", "⬆️ Le nord", "⬇️ Le sud"];
      } else if (type === 'gs_masse') {
        const qs = [
          { t: "Qui est le plus lourd ?", a: "🚗", o: ["🚗", "🎈", "🪶", "📱"] },
          { t: "Qui est le plus léger ?", a: "🪶", o: ["🚗", "🎈", "🪶", "📱"] },
          { t: "Qu'est-ce qui pèse le plus ?", a: "🚗", o: ["🚗", "🎈", "🪶", "📱"] }
        ];
        const q = pick(qs); text = q.t; ans = q.a; opts = q.o; speakText = q.t;
      }

      // ——— TABLES ———
      else if (type === 'mult_tables') {
        let a, b;
        if (['PS','MS','GS','CP'].includes(grade)) { a = r(1,5); b = r(1,5); }
        else if (['CE1','CE2'].includes(grade)) { a = r(2,10); b = r(2,10); }
        else if (['CM1','CM2','6ème'].includes(grade)) { a = r(3,12); b = r(3,12); }
        else { a = r(4,15); b = r(4,12); }
        const forms = [
          `Combien font ${a} × ${b} ?`,
          `Calcule : ${a} × ${b} = ?`,
          `${a} multiplié par ${b} égale ?`,
          `Quel est le produit de ${a} et ${b} ?`
        ];
        text = pick(forms);
        ans = `${a*b}`;
        opts = [`${a*b}`, `${a*b + r(1,5)}`, `${Math.max(0,a*b - r(1,4))}`, `${a+b}`];
      }

      // ——— CP ———
      else if (type === 'cp_num100') {
        const n = r(15, 95);
        const forms = [
          { t: `Quel nombre vient juste avant ${n+1} ?`, a: `${n}` },
          { t: `Quel nombre vient juste après ${n} ?`, a: `${n+1}` },
          { t: `Quel est le double de ${Math.floor(n/2)} ?`, a: `${Math.floor(n/2)*2}` },
          { t: `Combien font 10 + ${n-10} ?`, a: `${n}` }
        ];
        const f = pick(forms); text = f.t; ans = f.a;
        opts = [f.a, `${+f.a+1}`, `${+f.a-1}`, `${+f.a+10}`];
      } else if (type === 'cp_add') {
        const a = r(1,12), b = r(1,12);
        text = pick([`${a} + ${b} = ?`, `Calcule ${a} + ${b}`, `Combien font ${a} plus ${b} ?`]);
        ans = `${a+b}`; opts = [`${a+b}`, `${a+b+1}`, `${a+b-1}`, `${a*b || a+b+3}`];
      } else if (type === 'cp_soustraction') {
        const a = r(8, 25), b = r(1, a-1);
        text = pick([`${a} − ${b} = ?`, `Calcule ${a} − ${b}`, `Combien font ${a} moins ${b} ?`]);
        ans = `${a-b}`; opts = [`${a-b}`, `${a-b+1}`, `${a+b}`, `${Math.max(0,a-b-1)}`];
      } else if (type === 'cp_regle') {
        const qs = [
          { t: "Pour tracer un trait parfaitement droit, on utilise :", a: "Une règle" },
          { t: "Quel instrument permet de tracer des segments droits ?", a: "Une règle" },
          { t: "On utilise une équerre pour vérifier :", a: "Un angle droit" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = ["Une règle", "Un compas", "Une équerre", "Un crayon seul"];
      } else if (type === 'cp_monnaie') {
        const qs = [
          { t: "1 euro et 50 centimes = ?", a: "1,50 €" },
          { t: "2 euros et 20 centimes = ?", a: "2,20 €" },
          { t: "Combien de centimes dans 1 euro ?", a: "100" },
          { t: "5 euros et 5 centimes = ?", a: "5,05 €" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "1,05 €", "15 €", "0,50 €"];
      }

      // ——— CE1 ———
      else if (type === 'ce1_num1000') {
        const n = r(150, 850);
        const forms = [
          { t: `Quel nombre vient juste après ${n} ?`, a: `${n+1}` },
          { t: `Quel nombre vient juste avant ${n} ?`, a: `${n-1}` },
          { t: `Combien de centaines dans ${n} ?`, a: `${Math.floor(n/100)}` }
        ];
        const f = pick(forms); text = f.t; ans = f.a;
        opts = [f.a, `${+f.a+1}`, `${+f.a-1}`, `${+f.a+10}`];
      } else if (type === 'ce1_soustraction') {
        const qs = [
          { t: "Dans une soustraction avec retenue, on emprunte :", a: "1 dizaine à la colonne de gauche" },
          { t: "45 − 18 = ?", a: "27" },
          { t: "73 − 29 = ?", a: "44" },
          { t: "60 − 35 = ?", a: "25" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = q.a.includes("dizaine") ? ["1 dizaine à la colonne de gauche", "1 unité seulement", "Rien", "2 dizaines"] : [q.a, `${+q.a+1}`, `${+q.a-1}`, `${+q.a+5}`];
      } else if (type === 'ce1_solides') {
        const qs = [
          { t: "Quel solide a 6 faces carrées identiques ?", a: "Le cube" },
          { t: "Quel solide ressemble à une boîte de chaussures ?", a: "Le pavé droit" },
          { t: "Combien de faces a un cube ?", a: "6" },
          { t: "Un dé à jouer est un :", a: "Le cube" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = ["Le cube", "Le pavé droit", "La pyramide", "La sphère"];
      } else if (type === 'ce1_angle') {
        const qs = [
          { t: "Un angle droit mesure :", a: "90 degrés" },
          { t: "L'angle formé par le coin d'un carré est :", a: "90 degrés" },
          { t: "On utilise une équerre pour vérifier un angle de :", a: "90 degrés" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = ["90 degrés", "45 degrés", "180 degrés", "60 degrés"];
      } else if (type === 'ce1_mesures') {
        const qs = [
          { t: "1 kg = ? grammes", a: "1000 g" },
          { t: "1 m = ? centimètres", a: "100 cm" },
          { t: "1 L = ? centilitres", a: "100 cL" },
          { t: "1 km = ? mètres", a: "1000 m" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "100 g", "10 g", "10 000 g"];
      }

      // ——— CE2 ———
      else if (type === 'ce2_num10000') {

          { t: "La dérivée de f(x) = x² est :", a: "2x" },
          { t: "La dérivée de f(x) = x³ est :", a: "3x²" },
          { t: "La dérivée de f(x) = 5x est :", a: "5" },
          { t: "La dérivée de f(x) = constante est :", a: "0" },
          { t: "La dérivée de √x est :", a: "1/(2√x)" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "x", "2", "x²"];
      } else if (type === 'p1_exp') {
        const qs = [
          { t: "La dérivée de eˣ est :", a: "eˣ" },
          { t: "e⁰ = ?", a: "1" },
          { t: "eˣ × eʸ = ?", a: "e^{x+y}" },
          { t: "La fonction exponentielle est :", a: "Toujours positive" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "x·eˣ", "1/eˣ", "e"];
      } else if (type === 'p1_suites') {
        const qs = [
          { t: "Dans une suite arithmétique de raison r, uₙ₊₁ − uₙ = ?", a: "r" },
          { t: "Dans une suite géométrique de raison q, uₙ₊₁ / uₙ = ?", a: "q" },
          { t: "Suite arithmétique : uₙ = u₀ + n×r. Vrai ?", a: "Vrai" },
          { t: "Suite géométrique : uₙ = u₀ × qⁿ. Vrai ?", a: "Vrai" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "n", "uₙ", "0"];
      } else if (type === 'p1_scalaire') {
        const qs = [
          { t: "Le produit scalaire de deux vecteurs orthogonaux est :", a: "0" },
          { t: "u · u = ?", a: "||u||²" },
          { t: "Si u · v = 0 et u, v non nuls, alors :", a: "Ils sont orthogonaux" },
          { t: "u · v = ||u|| × ||v|| × cos(θ). Vrai ?", a: "Vrai" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = ["0", "1", "−1", "Leur norme"];
      }

      // ——— Terminale ———
      else if (type === 'term_limites') {
        const qs = [
          { t: "lim (x→+∞) 1/x = ?", a: "0" },
          { t: "lim (x→+∞) x² = ?", a: "+∞" },
          { t: "lim (x→0) 1/x² = ?", a: "+∞" },
          { t: "lim (x→+∞) eˣ = ?", a: "+∞" },
          { t: "lim (x→−∞) eˣ = ?", a: "0" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "+∞", "1", "−∞"];
      } else if (type === 'term_continuite') {
        const qs = [
          { t: "Le TVI s'applique aux fonctions :", a: "Continues sur un intervalle fermé" },
          { t: "Une fonction dérivable est forcément :", a: "Continue" },
          { t: "Le théorème des valeurs intermédiaires garantit :", a: "L'existence d'au moins une solution" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = ["Continues sur un intervalle fermé", "Uniquement dérivables", "Discontinues", "Périodiques"];
      } else if (type === 'term_log') {
        const qs = [
          { t: "La dérivée de ln(x) est :", a: "1/x" },
          { t: "ln(e) = ?", a: "1" },
          { t: "ln(1) = ?", a: "0" },
          { t: "ln(a×b) = ?", a: "ln(a) + ln(b)" },
          { t: "e^{ln(x)} = ?", a: "x" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "ln(x)", "x", "eˣ"];
      } else if (type === 'term_integrales') {
        const qs = [
          { t: "L'intégrale de 0 à 1 de 2x dx vaut :", a: "1" },
          { t: "L'intégrale de 0 à 2 de x dx vaut :", a: "2" },
          { t: "Une primitive de 2x est :", a: "x²" },
          { t: "L'intégrale calcule souvent :", a: "Une aire sous la courbe" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "2", "0", "0,5"];
      } else if (type === 'term_binomiale') {
        const qs = [
          { t: "La loi binomiale modélise :", a: "Le nombre de succès dans n épreuves indépendantes" },
          { t: "Espérance d'une loi B(n,p) :", a: "n × p" },
          { t: "Variance d'une loi B(n,p) :", a: "n × p × (1−p)" },
          { t: "La loi binomiale est une loi :", a: "Discrète" }
        ];
        const q = pick(qs); text = q.t; ans = q.a;
        opts = [q.a, "Une variable continue", "Uniquement pile ou face", "Des événements impossibles"];
      }

      // Fallback
      else {
        const a = r(3, 12), b = r(3, 10);
        text = `${a} × ${b} = ?`;
        ans = `${a*b}`;
        opts = [`${a*b}`, `${a*b+2}`, `${a*b-1}`, `${a+b}`];
      }

      // Nettoyage final des options
      opts = Array.from(new Set(opts.map(String))).filter(Boolean);
      while (opts.length < 4) {
        const extra = String((parseInt(ans) || 10) + opts.length + r(1, 8));
        if (!opts.includes(extra)) opts.push(extra);
      }
      opts = opts.slice(0, 4).sort(() => Math.random() - 0.5);

      return { text, ans: String(ans), options: opts, speakText: speakText || text };
    }

    // ======================================================
    // COMPOSANT EXERCICE
    // ======================================================
    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const [q, setQ] = useState({ text: '', ans: '', options: [], speakText: '' });
      const [feedback, setFeedback] = useState(null);
      const [isAnswering, setIsAnswering] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [timeLeft, setTimeLeft] = useState(15);
      const [showExplain, setShowExplain] = useState(false);
      const [isDuel, setIsDuel] = useState(false);
      const [duelScores, setDuelScores] = useState({ p1: 0, p2: 0 });
      const [activePlayer, setActivePlayer] = useState(1);
      const [duelWinner, setDuelWinner] = useState(null);
      const timerRef = useRef(null);
      const isMat = IS_MATERNELLE(grade);

      const loadNewQuestion = useCallback(() => {
        setFeedback(null);
        setIsAnswering(false);
        setShowConfetti(false);
        const newQ = generateQuestion(module.type, grade);
        setQ(newQ);
        setTimeLeft(15);
        if (isMat || !isDuel) {
          setTimeout(() => speak(newQ.speakText), 300);
        }
      }, [module.type, grade, isMat, isDuel]);

      useEffect(() => { loadNewQuestion(); }, [loadNewQuestion]);

      // Timer (désactivé en maternelle)
      useEffect(() => {
        if (isMat || feedback || showExplain || duelWinner) return;
        timerRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              if (isDuel) handleDuelAnswer(null);
              else handleAnswer('');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timerRef.current);
      }, [q.text, feedback, showExplain, duelWinner, isDuel, isMat]);

      const handleAnswer = (choice) => {
        if (isAnswering || feedback) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);

        const correct = String(choice).trim() === String(q.ans).trim();
        if (correct) {
          const xp = isMat ? 15 : Math.max(6, Math.floor(timeLeft / 2) + 5);
          setShowConfetti(true);
          setFeedback({ success: true, text: `Bravo ${userName} ! (+${xp} XP)` });
          if (isMat) speak(`Bravo ${userName} ! C'est très bien !`);
          else speak("Bravo ! C'est exact !");
          setTimeout(() => {
            onResult(xp);
            loadNewQuestion();
          }, 1500);
        } else {
          setFeedback({ success: false, text: isMat ? `Essaie encore ${userName}` : `La bonne réponse était : ${q.ans}` });
          if (isMat) speak(`Ce n'est pas tout à fait ça. Essaie encore ${userName}.`);
          else speak(`La bonne réponse était ${q.ans}`);
          setTimeout(() => {
            setFeedback(null);
            setIsAnswering(false);
            if (!isMat) loadNewQuestion();
          }, isMat ? 2000 : 2200);
        }
      };

      const handleDuelAnswer = (choice) => {
        if (isAnswering || duelWinner) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);
        const correct = choice !== null && String(choice).trim() === String(q.ans).trim();

        if (correct) {
          setDuelScores(prev => {
            const next = { ...prev, [`p${activePlayer}`]: prev[`p${activePlayer}`] + 1 };
            if (next[`p${activePlayer}`] >= 5) {
              setTimeout(() => setDuelWinner(activePlayer), 100);
            }
            return next;
          });
          setFeedback({ success: true, text: `Joueur ${activePlayer} marque un point !` });
        } else {
          setFeedback({ success: false, text: `Raté ! C'était ${q.ans}` });
        }

        setTimeout(() => {
          setFeedback(null);
          setIsAnswering(false);
          setActivePlayer(p => p === 1 ? 2 : 1);
          loadNewQuestion();
        }, 1600);
      };

      const expl = EXPLANATIONS[module.type] || {
        title: module.name,
        why: "Comprendre les notions fondamentales de ce chapitre.",
        rule: "Applique les définitions et propriétés de ton cours."
      };

      // ========== INTERFACE MATERNELLE ==========
      if (isMat) {
        return (
          <div className="bg-gradient-to-b from-indigo-950 to-slate-950 p-5 sm:p-8 rounded-3xl text-center max-w-lg mx-auto border-4 border-indigo-500/30 shadow-2xl animate-pop relative overflow-hidden">
            {showConfetti && (
              <>
                <span className="confetti-piece" style={{left:'18%', animationDelay:'0s'}}>🎉</span>
                <span className="confetti-piece" style={{left:'38%', animationDelay:'0.1s'}}>⭐</span>
                <span className="confetti-piece" style={{left:'58%', animationDelay:'0.2s'}}>🌟</span>
                <span className="confetti-piece" style={{left:'78%', animationDelay:'0.15s'}}>✨</span>
              </>
            )}

            <div className="flex justify-between items-center mb-5">
              <button onClick={onBack} className="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-2xl text-sm font-bold">← Retour</button>
              <div className="text-pink-300 font-bold text-sm bg-pink-500/20 px-3 py-1 rounded-full">{module.icon} {module.name}</div>
            </div>

            <button onClick={() => speak(q.speakText)} className="mb-5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white px-6 py-3 rounded-full font-bold text-base shadow-lg flex items-center gap-2 mx-auto active:scale-95 transition-all">
              🔊 Écouter la consigne
            </button>

            <div className="bg-white/5 rounded-3xl p-6 mb-5 border border-white/10">
              <h2 className="text-2xl sm:text-3xl font-black text-white leading-snug whitespace-pre-line">{q.text}</h2>
            </div>

            {feedback && (
              <div className={`p-4 rounded-2xl mb-5 font-black text-lg animate-happy ${feedback.success ? 'bg-emerald-500/30 text-emerald-200 border-2 border-emerald-400' : 'bg-amber-500/30 text-amber-200 border-2 border-amber-400'}`}>
                {feedback.text}
              </div>
            )}

            <div className="grid grid-cols-2 gap-4">
              {q.options.map((opt, i) => (
                <button key={i} onClick={() => handleAnswer(opt)} disabled={isAnswering || !!feedback}
                  className="bg-gradient-to-b from-indigo-500 to-indigo-700 hover:from-indigo-400 hover:to-indigo-600 disabled:opacity-50 text-white font-black text-2xl py-6 px-3 rounded-3xl border-4 border-indigo-300/30 shadow-xl active:scale-90 transition-all min-h-[80px] flex items-center justify-center">
                  {opt}
                </button>
              ))}
            </div>
            <p className="mt-5 text-xs text-indigo-300/70">Touche la bonne réponse • Tu peux réécouter autant de fois que tu veux</p>
          </div>
        );
      }

      // ========== INTERFACE CLASSIQUE + DUEL ==========
      return (
        <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-xl mx-auto shadow-2xl relative animate-pop">
          {showConfetti && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
              <div className="confetti-piece">⭐</div>
              <div className="confetti-piece" style={{left:'30%', animationDelay:'0.1s'}}>🎉</div>
              <div className="confetti-piece" style={{left:'70%', animationDelay:'0.2s'}}>✨</div>
            </div>
          )}

          {/* Modal Explication */}
          {showExplain && (
            <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-3xl z-30 p-6 flex flex-col justify-between animate-pop">
              <div>
                <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                  <h3 className="text-base font-black text-amber-400 flex items-center gap-2">💡 {expl.title}</h3>
                  <button onClick={() => setShowExplain(false)} className="text-slate-400 hover:text-white font-bold text-sm px-3 py-1 bg-slate-800 rounded-xl">✕ Fermer</button>
                </div>
                <div className="space-y-4 text-sm">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <h4 className="font-extrabold text-indigo-400 mb-1 text-xs uppercase">Pourquoi apprend-on cela ?</h4>
                    <p className="text-slate-300">{expl.why}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <h4 className="font-extrabold text-emerald-400 mb-1 text-xs uppercase">Règle clé</h4>
                    <p className="text-slate-300">{expl.rule}</p>
                  </div>
                </div>
              </div>
              <button onClick={() => speak(expl.why + ". " + expl.rule)} className="w-full bg-indigo-600/30 text-indigo-300 py-3 rounded-2xl text-xs font-bold border border-indigo-500/30 flex items-center justify-center gap-2">
                🔊 Écouter l'explication
              </button>
            </div>
          )}

          {/* Header */}
          <div className="flex flex-wrap justify-between items-center gap-2 mb-5">
            <button onClick={onBack} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">← Retour</button>
            
            {module.type === 'mult_tables' && (
              <button onClick={() => { setIsDuel(!isDuel); setDuelScores({p1:0,p2:0}); setDuelWinner(null); setActivePlayer(1); }}
                className={`px-4 py-2 rounded-xl text-xs font-black ${isDuel ? 'bg-rose-600 text-white animate-pulse' : 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/40'}`}>
                ⚔️ {isDuel ? 'Mode Solo' : 'Mode Duel'}
              </button>
            )}

            <button onClick={() => { setShowExplain(true); speak(expl.why); }} className="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-2 rounded-xl text-xs font-black">
              💡 Pourquoi & Théorème
            </button>

            {!isDuel && <span className="text-xs font-mono font-bold bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl">⏱️ {timeLeft}s</span>}
          </div>

          {/* Score Duel */}
          {isDuel && (
            <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl mb-5 flex justify-around items-center">
              <div className={`text-center p-2 rounded-xl ${activePlayer === 1 ? 'bg-indigo-600/20 border border-indigo-500' : ''}`}>
                <p className="text-xs font-bold text-indigo-400">Joueur 1</p>
                <p className="text-2xl font-black text-white">{duelScores.p1} / 5</p>
              </div>
              <div className="text-xl font-black text-slate-600">VS</div>
              <div className={`text-center p-2 rounded-xl ${activePlayer === 2 ? 'bg-rose-600/20 border border-rose-500' : ''}`}>
                <p className="text-xs font-bold text-rose-400">Joueur 2</p>
                <p className="text-2xl font-black text-white">{duelScores.p2} / 5</p>
              </div>
            </div>
          )}

          {/* Victoire Duel */}
          {duelWinner ? (
            <div className="text-center py-10 space-y-4 animate-pop">
              <div className="text-5xl">🏆</div>
              <h2 className="text-2xl font-black text-amber-400">Victoire du Joueur {duelWinner} !</h2>
              <button onClick={() => { setDuelScores({p1:0,p2:0}); setDuelWinner(null); setActivePlayer(1); loadNewQuestion(); }}
                className="bg-indigo-600 text-white font-black px-6 py-3 rounded-2xl text-sm">
                Rejouer un Duel ⚔️
              </button>
            </div>
          ) : (
            <>
              <div className="text-center my-5">
                <div className="text-4xl mb-3">{isDuel ? (activePlayer === 1 ? '🔵' : '🔴') : module.icon}</div>
                <h2 className="text-lg sm:text-xl font-black text-white bg-slate-950/60 p-4 rounded-2xl border border-slate-800 leading-relaxed">
                  {q.text}
                </h2>
              </div>

              {feedback && (
                <div className={`p-4 rounded-2xl mb-5 text-center font-black text-sm animate-pop ${feedback.success ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'}`}>
                  {feedback.text}
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {q.options.map((opt, idx) => (
                  <button key={idx} disabled={isAnswering}
                    onClick={() => isDuel ? handleDuelAnswer(opt) : handleAnswer(opt)}
                    className="bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-400 font-black py-4 px-4 rounded-2xl text-white transition disabled:opacity-50 active:scale-95">
                    {opt}
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    // APPLICATION PRINCIPALE
    // ======================================================

                </div>

                <p className="text-xs text-slate-400">Joueur : <span className="font-bold text-white">{userName} ({selectedGrade})</span></p>
              </div>

              <span className="text-sm font-black text-amber-400">{score} XP</span>
            </div>

              <>
                <div className="flex flex-wrap gap-2 mb-8">
                  {GRADES.map(g => (
                    <button key={g} onClick={() => setSelectedGrade(g)}
                      className={`px-4 py-2 rounded-2xl font-extrabold text-xs transition ${selectedGrade === g ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                      {g}
                    </button>
                  ))}

                      <div className="flex items-start justify-between">

          </main>

          <footer className="py-4 border-t border-slate-900 flex justify-between items-center text-xs text-slate-500">
            <button onClick={() => { setIsLoggedIn(false); setActiveModule(null); setScore(0); }} className="hover:text-indigo-400 underline">
              Changer d'élève
            </button>
            <span>MathsAcademy © 2026</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
