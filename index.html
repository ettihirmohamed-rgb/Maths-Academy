<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathsAcademy – Maternelle Montessori</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounceHappy {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-80px) rotate(360deg); opacity: 0; }
    }
    .animate-pop { animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-happy { animation: bounceHappy 0.5s ease; }
    .confetti-piece {
      position: absolute;
      font-size: 1.5rem;
      animation: confetti 1s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-pink-400">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ======================================================
    // CURRICULUM MATERNELLE – Pédagogie Montessori
    // ======================================================
    const CURRICULUM = {
      PS: [
        { id: 'ps_formes', name: 'Les formes (rond)', icon: '🔴', type: 'ps_formes', domain: 'Sensoriel' },
        { id: 'ps_count3', name: 'Compter jusqu\'à 3', icon: '⭐', type: 'ps_count3', domain: 'Nombres' },
        { id: 'ps_tailles', name: 'Petit et Grand', icon: '🐘', type: 'ps_tailles', domain: 'Grandeurs' },
        { id: 'ps_espace', name: 'Haut et Bas', icon: '☁️', type: 'ps_espace', domain: 'Espace' }
      ],
      MS: [
        { id: 'ms_count6', name: 'Compter jusqu\'à 6', icon: '🍎', type: 'ms_count6', domain: 'Nombres' },
        { id: 'ms_associer', name: 'Chiffre et quantité', icon: '🔢', type: 'ms_associer', domain: 'Nombres' },
        { id: 'ms_formes', name: 'Carré et Triangle', icon: '🟦', type: 'ms_formes', domain: 'Sensoriel' },
        { id: 'ms_rythme', name: 'Les rythmes', icon: '🔵🔴', type: 'ms_rythme', domain: 'Logique' },
        { id: 'ms_comparer', name: 'Plus et Moins', icon: '⚖️', type: 'ms_comparer', domain: 'Nombres' }
      ],
      GS: [
        { id: 'gs_chaine', name: 'Compter jusqu\'à 10', icon: '🔟', type: 'gs_chaine', domain: 'Nombres' },
        { id: 'gs_decomp', name: 'Décomposer les nombres', icon: '🧩', type: 'gs_decomp', domain: 'Nombres' },
        { id: 'gs_formes', name: 'Toutes les formes', icon: '▭', type: 'gs_formes', domain: 'Sensoriel' },
        { id: 'gs_espace', name: 'Droite et Gauche', icon: '👈👉', type: 'gs_espace', domain: 'Espace' },
        { id: 'gs_masse', name: 'Lourd et Léger', icon: '🏋️', type: 'gs_masse', domain: 'Grandeurs' }
      ],
      // Les autres niveaux restent disponibles
      CP: [
        { id: 'cp_num100', name: 'Nombres jusqu\'à 100', icon: '💯', type: 'cp_num100', domain: 'Nombres' },
        { id: 'cp_add', name: 'Additions', icon: '➕', type: 'cp_add', domain: 'Calcul' }
      ],
      CE1: [
        { id: 'ce1_tables', name: 'Tables de multiplication', icon: '✖️', type: 'ce1_tables', domain: 'Calcul' }
      ],
      CE2: [
        { id: 'ce2_mult', name: 'Multiplications', icon: '✖️', type: 'ce2_mult', domain: 'Calcul' }
      ],
      CM1: [
        { id: 'cm1_fractions', name: 'Fractions', icon: '🍕', type: 'cm1_fractions', domain: 'Nombres' }
      ],
      CM2: [
        { id: 'cm2_proportionnalite', name: 'Proportionnalité', icon: '📈', type: 'cm2_proportionnalite', domain: 'Proportionnalité' }
      ],
      '6ème': [
        { id: 'c6_fractions', name: 'Fractions', icon: '🔢', type: 'c6_fractions', domain: 'Nombres' }
      ],
      '5ème': [
        { id: 'c5_relatifs', name: 'Nombres relatifs', icon: '🌡️', type: 'c5_relatifs', domain: 'Nombres' }
      ],
      '4ème': [
        { id: 'c4_pythagore', name: 'Pythagore', icon: '📐', type: 'c4_pythagore', domain: 'Géométrie' }
      ],
      '3ème': [
        { id: 'c3_thales', name: 'Thalès', icon: '📐', type: 'c3_thales', domain: 'Géométrie' }
      ],
      Seconde: [
        { id: 'sec_vecteurs', name: 'Vecteurs', icon: '➡️', type: 'sec_vecteurs', domain: 'Géométrie' }
      ],
      '1ère': [
        { id: 'p1_derivee', name: 'Dérivée', icon: '📈', type: 'p1_derivee', domain: 'Analyse' }
      ],
      Terminale: [
        { id: 'term_limites', name: 'Limites', icon: '∞', type: 'term_limites', domain: 'Analyse' }
      ]
    };

    const IS_MATERNELLE = (grade) => ['PS', 'MS', 'GS'].includes(grade);

    // Voix douce et claire pour les enfants
    const speak = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        u.rate = 0.85;          // un peu plus lent
        u.pitch = 1.1;          // un peu plus aigu (plus doux)
        window.speechSynthesis.speak(u);
      }
    };

    // ======================================================
    // GÉNÉRATEUR DE QUESTIONS MATERNELLE (très ludique)
    // ======================================================
    function generateQuestion(type) {
      let text = '', ans = '', opts = [], visual = null, speakText = '';

      // ——— PS ———
      if (type === 'ps_formes') {
        text = "Où est le rond ?";
        speakText = "Où est le rond ? Appuie sur le rond.";
        ans = "🔴";
        opts = ["🔴", "🟦", "🔺", "⭐"];
      } else if (type === 'ps_count3') {
        const n = Math.floor(Math.random() * 3) + 1;
        text = `Combien d'étoiles ?\n${'⭐'.repeat(n)}`;
        speakText = `Combien d'étoiles vois-tu ? ${n === 1 ? 'Une étoile' : n === 2 ? 'Deux étoiles' : 'Trois étoiles'}.`;
        ans = `${n}`;
        opts = ["1", "2", "3"];
      } else if (type === 'ps_tailles') {
        text = "Qui est le plus grand ?";
        speakText = "Qui est le plus grand ? L'éléphant, la souris, le chat ou le chien ?";
        ans = "🐘";
        opts = ["🐘", "🐭", "🐱", "🐶"];
      } else if (type === 'ps_espace') {
        text = "Où est le soleil ?";
        speakText = "Où est le soleil ? En haut ou en bas ?";
        ans = "☁️ En haut";
        opts = ["☁️ En haut", "⬇️ En bas"];
      }

      // ——— MS ———
      else if (type === 'ms_count6') {
        const n = Math.floor(Math.random() * 4) + 3;
        text = `Combien de pommes ?\n${'🍎'.repeat(n)}`;
        speakText = `Compte les pommes. Combien y en a-t-il ?`;
        ans = `${n}`;
        opts = [`${n}`, `${n + 1}`, `${n - 1}`, "4"].filter(x => Number(x) > 0);
      } else if (type === 'ms_associer') {
        const n = Math.floor(Math.random() * 5) + 1;
        text = `Quel chiffre pour\n${'🔵'.repeat(n)} ?`;
        speakText = `Quel chiffre correspond à ces ronds bleus ?`;
        ans = `${n}`;
        opts = [`${n}`, `${n + 1}`, `${Math.max(1, n - 1)}`, `${n + 2}`];
      } else if (type === 'ms_formes') {
        text = "Quelle forme a 3 côtés ?";
        speakText = "Quelle forme a trois côtés ? Le triangle, le carré, le rond ou le rectangle ?";
        ans = "🔺";
        opts = ["🔺", "🟦", "🔴", "▭"];
      } else if (type === 'ms_rythme') {
        text = "Quel est le suivant ?\n🔴 🔵 🔴 🔵 ...";
        speakText = "Regarde le rythme : rouge, bleu, rouge, bleu... Quel est le suivant ?";
        ans = "🔴";
        opts = ["🔴", "🔵", "🟢", "🟡"];
      } else if (type === 'ms_comparer') {
        text = "Quelle collection a le plus ?\n⭐⭐⭐   ou   🍎🍎";
        speakText = "Quelle collection a le plus d'objets ? Les étoiles ou les pommes ?";
        ans = "⭐⭐⭐";
        opts = ["⭐⭐⭐", "🍎🍎"];
      }

      // ——— GS ———
      else if (type === 'gs_chaine') {
        const n = Math.floor(Math.random() * 8) + 2;
        text = `Quel nombre vient après ${n} ?`;
        speakText = `Quel nombre vient juste après ${n} ?`;
        ans = `${n + 1}`;
        opts = [`${n + 1}`, `${n + 2}`, `${n - 1}`, `${n}`];
      } else if (type === 'gs_decomp') {
        const n = Math.floor(Math.random() * 4) + 4;
        const p = Math.floor(Math.random() * (n - 1)) + 1;
        text = `${n} c'est ${p} et encore ... ?`;
        speakText = `${n} c'est ${p} et encore combien ?`;
        ans = `${n - p}`;
        opts = [`${n - p}`, `${n - p + 1}`, `${n}`, "1"];
      } else if (type === 'gs_formes') {
        text = "Quelle forme a 4 côtés égaux\net 4 angles droits ?";
        speakText = "Quelle forme a quatre côtés égaux et quatre angles droits ?";
        ans = "🟦 Carré";
        opts = ["🟦 Carré", "▭ Rectangle", "🔺 Triangle", "🔴 Cercle"];
      } else if (type === 'gs_espace') {
        text = "Ma main droite pointe vers...";
        speakText = "Si je regarde devant moi, ma main droite pointe vers quelle direction ?";
        ans = "👉 L'est";
        opts = ["👉 L'est", "👈 L'ouest", "⬆️ Le nord", "⬇️ Le sud"];
      } else if (type === 'gs_masse') {
        text = "Qui est le plus lourd ?";
        speakText = "Qui est le plus lourd ? La voiture, le ballon, la plume ou le téléphone ?";
        ans = "🚗";
        opts = ["🚗", "🎈", "🪶", "📱"];
      }

      // Fallback simple
      else {
        const n = Math.floor(Math.random() * 3) + 1;
        text = `Combien ? ${'⭐'.repeat(n)}`;
        speakText = `Combien d'étoiles ?`;
        ans = `${n}`;
        opts = ["1", "2", "3"];
      }

      // Nettoyage
      opts = Array.from(new Set(opts.map(String))).slice(0, 4);
      while (opts.length < 4) {
        opts.push(String(opts.length + 1));
      }
      opts = opts.sort(() => Math.random() - 0.5);

      return { text, ans: String(ans), options: opts, visual, speakText: speakText || text };
    }

    // ======================================================
    // COMPOSANT EXERCICE – VERSION MATERNELLE TRÈS LUDIQUE
    // ======================================================
    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const [q, setQ] = useState({ text: '', ans: '', options: [], speakText: '' });
      const [feedback, setFeedback] = useState(null);
      const [isAnswering, setIsAnswering] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const isMat = IS_MATERNELLE(grade);

      const loadNewQuestion = useCallback(() => {
        setFeedback(null);
        setIsAnswering(false);
        setShowConfetti(false);
        const newQ = generateQuestion(module.type);
        setQ(newQ);

        // Vocal automatique pour la maternelle
        if (isMat) {
          setTimeout(() => speak(newQ.speakText), 400);
        }
      }, [module.type, isMat]);

      useEffect(() => {
        loadNewQuestion();
      }, [loadNewQuestion]);

      const handleAnswer = (val) => {
        if (isAnswering || feedback) return;
        setIsAnswering(true);

        if (String(val) === q.ans) {
          setFeedback({ success: true, msg: `Bravo ${userName} ! 🎉` });
          setShowConfetti(true);
          speak(`Bravo ${userName} ! C'est très bien !`);
          
          setTimeout(() => {
            onResult(15);
            loadNewQuestion();
          }, 1800);
        } else {
          setFeedback({ success: false, msg: `Essaie encore ${userName}` });
          speak(`Ce n'est pas tout à fait ça. Essaie encore ${userName}.`);
          
          setTimeout(() => {
            setFeedback(null);
            setIsAnswering(false);
          }, 2000);
        }
      };

      // ========== INTERFACE MATERNELLE ==========
      if (isMat) {
        return (
          <div className="bg-gradient-to-b from-indigo-950 to-slate-950 p-5 sm:p-8 rounded-3xl text-center max-w-lg mx-auto border-4 border-indigo-500/30 shadow-2xl animate-pop relative overflow-hidden">
            
            {/* Confettis de réussite */}
            {showConfetti && (
              <>
                <span className="confetti-piece" style={{left:'20%', animationDelay:'0s'}}>🎉</span>
                <span className="confetti-piece" style={{left:'40%', animationDelay:'0.1s'}}>⭐</span>
                <span className="confetti-piece" style={{left:'60%', animationDelay:'0.2s'}}>🌟</span>
                <span className="confetti-piece" style={{left:'80%', animationDelay:'0.15s'}}>✨</span>
              </>
            )}

            {/* En-tête */}
            <div className="flex justify-between items-center mb-6">
              <button 
                onClick={onBack}
                className="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-2xl text-sm font-bold"
              >
                ← Retour
              </button>
              <div className="text-pink-300 font-bold text-sm bg-pink-500/20 px-3 py-1 rounded-full">
                {module.icon} {module.name}
              </div>
            </div>

            {/* Bouton Réécouter – très visible */}
            <button
              onClick={() => speak(q.speakText)}
              className="mb-6 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white px-6 py-3 rounded-full font-bold text-base shadow-lg flex items-center gap-2 mx-auto active:scale-95 transition-all"
            >
              🔊 Écouter la consigne
            </button>

            {/* Question – grande et claire */}
            <div className="bg-white/5 rounded-3xl p-6 mb-6 border border-white/10">
              <h2 className="text-2xl sm:text-3xl font-black text-white leading-snug whitespace-pre-line">
                {q.text}
              </h2>
            </div>

            {/* Feedback */}
            {feedback && (
              <div className={`p-4 rounded-2xl mb-5 font-black text-lg animate-happy ${
                feedback.success 
                  ? 'bg-emerald-500/30 text-emerald-200 border-2 border-emerald-400' 
                  : 'bg-amber-500/30 text-amber-200 border-2 border-amber-400'
              }`}>
                {feedback.msg}
              </div>
            )}

            {/* Gros boutons de réponse – style Montessori */}
            <div className={`grid gap-4 ${q.options.length <= 2 ? 'grid-cols-2' : 'grid-cols-2'}`}>
              {q.options.map((opt, i) => (
                <button
                  key={`${opt}-${i}`}
                  onClick={() => handleAnswer(opt)}
                  disabled={isAnswering || !!feedback}
                  className="bg-gradient-to-b from-indigo-500 to-indigo-700 hover:from-indigo-400 hover:to-indigo-600 disabled:opacity-50 text-white font-black text-2xl py-6 px-4 rounded-3xl border-4 border-indigo-300/30 shadow-xl active:scale-90 transition-all min-h-[80px] flex items-center justify-center"
                >
                  {opt}
                </button>
              ))}
            </div>

            {/* Petite indication Montessori */}
            <p className="mt-6 text-xs text-indigo-300/70">
              Touche la bonne réponse • Tu peux réécouter autant de fois que tu veux
            </p>
          </div>
        );
      }

      // ========== INTERFACE CLASSIQUE (CP et plus) ==========
      // (version simplifiée pour les plus grands – on garde le focus maternelle)
      return (
        <div className="bg-slate-900/90 p-6 rounded-3xl text-center max-w-lg mx-auto border border-slate-800">
          <button onClick={onBack} className="mb-4 text-sm text-slate-400">← Retour</button>
          <h2 className="text-xl font-bold mb-4">{q.text}</h2>
          <div className="grid grid-cols-2 gap-3">
            {q.options.map((opt, i) => (
              <button key={i} onClick={() => handleAnswer(opt)} className="bg-slate-800 py-4 rounded-xl font-bold">
                {opt}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // ======================================================
    // APPLICATION PRINCIPALE
    // ======================================================
    function App() {
      const [userName, setUserName] = useState('');
      const [selectedGrade, setSelectedGrade] = useState('PS');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeModule, setActiveModule] = useState(null);
      const [score, setScore] = useState(0);

      const handleStart = (e) => {
        e.preventDefault();
        if (userName.trim()) setIsLoggedIn(true);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-indigo-950 to-slate-950">
            <div className="bg-slate-900/90 p-8 rounded-3xl max-w-md w-full border-2 border-indigo-500/30 shadow-2xl animate-pop">
              <div className="text-center mb-6">
                <div className="text-5xl mb-3">🧮✨</div>
                <h1 className="text-3xl font-black bg-gradient-to-r from-pink-400 to-indigo-400 bg-clip-text text-transparent">
                  MathsAcademy
                </h1>
                <p className="text-slate-400 text-sm mt-2">
                  Apprendre les maths en s'amusant<br/>
                  <span className="text-pink-300">Pédagogie Montessori</span>
                </p>
              </div>

              <form onSubmit={handleStart} className="space-y-5">
                <div>
                  <label className="block text-sm font-bold text-slate-300 mb-2">Prénom de l'enfant</label>
                  <input
                    type="text"
                    value={userName}
                    onChange={(e) => setUserName(e.target.value)}
                    placeholder="Ex: Léa"
                    className="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 text-white text-lg focus:outline-none focus:border-pink-500"
                    required
                    autoFocus
                  />
                </div>

                <div>
                  <label className="block text-sm font-bold text-slate-300 mb-2">Classe</label>
                  <select
                    value={selectedGrade}
                    onChange={(e) => setSelectedGrade(e.target.value)}
                    className="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 text-white focus:outline-none focus:border-pink-500"
                  >
                    <optgroup label="Maternelle (recommandé)">
                      <option value="PS">Petite Section (PS)</option>
                      <option value="MS">Moyenne Section (MS)</option>
                      <option value="GS">Grande Section (GS)</option>
                    </optgroup>
                    <optgroup label="Élémentaire & +">
                      {['CP','CE1','CE2','CM1','CM2','6ème','5ème','4ème','3ème','Seconde','1ère','Terminale'].map(g => (
                        <option key={g} value={g}>{g}</option>
                      ))}
                    </optgroup>
                  </select>
                </div>

                <button type="submit" className="w-full bg-gradient-to-r from-pink-500 to-indigo-500 hover:from-pink-400 hover:to-indigo-400 text-white font-black py-4 rounded-2xl text-lg shadow-lg active:scale-95 transition-all">
                  C'est parti ! 🚀
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (activeModule) {
        return (
          <div className="min-h-screen p-4 pt-6 bg-gradient-to-b from-indigo-950 to-slate-950">
            <div className="max-w-lg mx-auto mb-4 flex justify-between items-center">
              <div className="text-pink-300 font-bold">👋 {userName}</div>
              <div className="bg-amber-400/20 text-amber-300 px-4 py-1.5 rounded-full text-sm font-black border border-amber-400/40">
                ⭐ {score}
              </div>
            </div>
            <ExerciseRunner
              userName={userName}
              grade={selectedGrade}
              module={activeModule}
              onBack={() => setActiveModule(null)}
              onResult={(xp) => setScore(s => s + xp)}
            />
          </div>
        );
      }

      // Sélection des modules
      const modules = CURRICULUM[selectedGrade] || [];
      const isMat = IS_MATERNELLE(selectedGrade);

      return (
        <div className="min-h-screen p-4 pt-6 bg-gradient-to-b from-indigo-950 to-slate-950">
          <div className="max-w-2xl mx-auto">
            <div className="flex justify-between items-center mb-8">
              <div>
                <h1 className="text-2xl font-black text-white">
                  Salut <span className="text-pink-400">{userName}</span> ! 👋
                </h1>
                <p className="text-indigo-300 text-sm mt-1">
                  {isMat ? "On va jouer et apprendre !" : `Classe : ${selectedGrade}`}
                </p>
              </div>
              <div className="bg-amber-400/20 text-amber-300 px-4 py-2 rounded-full font-black border border-amber-400/40">
                ⭐ {score}
              </div>
            </div>

            <div className={`grid gap-4 ${isMat ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3'}`}>
              {modules.map((mod) => (
                <button
                  key={mod.id}
                  onClick={() => setActiveModule(mod)}
                  className={`p-6 rounded-3xl text-left transition-all active:scale-95 border-2 ${
                    isMat 
                      ? 'bg-gradient-to-br from-indigo-600/40 to-pink-600/30 border-pink-400/40 hover:border-pink-300' 
                      : 'bg-slate-900/80 border-slate-700 hover:border-indigo-500'
                  }`}
                >
                  <div className="text-4xl mb-3">{mod.icon}</div>
                  <div className="font-black text-white text-lg leading-snug">{mod.name}</div>
                  {mod.domain && (
                    <div className="text-xs text-indigo-300 mt-2">{mod.domain}</div>
                  )}
                </button>
              ))}
            </div>

            <button
              onClick={() => { setIsLoggedIn(false); setActiveModule(null); setScore(0); }}
              className="mt-10 text-sm text-slate-500 hover:text-slate-300"
            >
              Changer d'enfant
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
