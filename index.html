  <style>
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounceHappy {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-happy { animation: bounceHappy 0.45s ease; }
    .confetti-piece {
      position: absolute;
      font-size: 1.6rem;
      pointer-events: none;
      animation: confetti 1.2s ease-out forwards;
    }
  </style>

        { id: 'p1_second', name: 'Second degré', icon: 'ax²', type: 'p1_second', domain: 'Algèbre' },

        { id: 'term_limites', name: 'Limites', icon: '∞', type: 'term_limites', domain: 'Analyse' },
        { id: 'term_log', name: 'Logarithme népérien', icon: 'ln', type: 'term_log', domain: 'Analyse' },
        { id: 'term_integrales', name: 'Calcul intégral', icon: '∫', type: 'term_integrales', domain: 'Analyse' }
      ]
    };

    const GRADES_ROW_1 = ['PS', 'MS', 'GS', 'CP', 'CE1', 'CE2', 'CM1', 'CM2', '6ème', '5ème', '4ème', '3ème', 'Seconde'];
    const GRADES_ROW_2 = ['1ère', 'Terminale'];

    const THEOREMS_EXPLANATIONS = {
      mult_tables: {
        title: "Pourquoi et comment multiplier ?",
        why: "La multiplication est une addition réitérée. Au lieu d'écrire 5 + 5 + 5 + 5, on écrit 5 × 4. C'est l'outil indispensable pour calculer rapidement des surfaces, des prix ou des quantités.",
        rule: "La multiplication est commutative : a × b est égal à b × a. Apprendre ses tables par cœur permet d'accélérer considérablement tous les calculs mathématiques futurs."
      }
    };

    const speak = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[^a-zA-ZÀ-ÿ0-9\s]/g, ' ');
        const u = new SpeechSynthesisUtterance(cleanText);
        u.lang = 'fr-FR';
        u.rate = 0.95;
        u.pitch = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const naturalVoice = voices.find(v => v.lang.includes('fr') && v.name.includes('Natural'));
        const frenchVoice = naturalVoice || voices.find(v => v.lang.includes('fr') || v.lang.includes('fr_FR'));
        if (frenchVoice) u.voice = frenchVoice;
        window.speechSynthesis.speak(u);
      }
    };

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    // Générateur de questions de multiplication adaptatif selon le niveau
    function generateMultiplicationQuestion(grade) {
      const r = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      let a, b, text, ans, opts;

      if (['PS', 'MS', 'GS', 'CP'].includes(grade)) {
        // Petites tables (1 à 5)
        a = r(1, 5);
        b = r(1, 5);
      } else if (['CE1', 'CE2'].includes(grade)) {
        // Tables standard de 2 à 10
        a = r(2, 10);
        b = r(2, 10);
      } else if (['CM1', 'CM2', '6ème'].includes(grade)) {
        // Tables étendues et multi-chiffres simples (2 à 12, ou dizaines)
        a = r(3, 12);
        b = r(4, 15);
      } else if (['5ème', '4ème'].includes(grade)) {
        // Nombres relatifs ou décimaux simples multipliés
        if (Math.random() > 0.5) {
          a = r(-12, 12);
          b = r(2, 12);
        } else {
          a = r(2, 20);
          b = r(2, 20);
        }
      } else if (['3ème', 'Seconde'].includes(grade)) {
        // Nombres plus complexes, identités ou puissances / relatifs croisés
        a = r(-15, 15);
        b = r(-12, 12);
      } else {
        // 1ère / Terminale : Calculs littéraux / produits de facteurs avancés
        a = r(-20, 20);
        b = r(-20, 20);
      }

      ans = a * b;
      text = `Combien font ${a} multiplié par ${b} ?`;

      opts = [ans, ans + r(1, 5), ans - r(1, 4), ans + r(6, 12)];
      if (ans === 0) opts = [0, 2, 5, 10];
      opts = Array.from(new Set(opts.map(Number))).slice(0, 4);
      while (opts.length < 4) opts.push(ans + opts.length + 1);
      opts = opts.sort(() => Math.random() - 0.5);

      return { text, ans: String(ans), options: opts.map(String), speakText: text };
    }

    function generateQuestion(type, grade) {
      if (type === 'mult_tables') {
        return generateMultiplicationQuestion(grade);
      }

      let text = '', ans = '', opts = [];
      const r = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      const a = r(5, 50), b = r(2, 20);
      text = `Combien font ${a} plus ${b} ?`;
      ans = `${a + b}`;
      opts = [ans, `${parseInt(ans) + 3}`, `${parseInt(ans) - 2}`, `${parseInt(ans) + 10}`].sort(() => Math.random() - 0.5);
      return { text, ans: String(ans), options: opts, speakText: text };
    }

    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const [isDuel, setIsDuel] = useState(false);
      const [q, setQ] = useState({ text: '', ans: '', options: [], speakText: '' });
      const [feedback, setFeedback] = useState(null);
      const [isAnswering, setIsAnswering] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [timeLeft, setTimeLeft] = useState(30);
      const [showTheoremModal, setShowTheoremModal] = useState(false);

      // États spécifiques au mode Duel
      const [duelScores, setDuelScores] = useState({ p1: 0, p2: 0 });
      const [activePlayerTurn, setActivePlayerTurn] = useState(1); // 1 ou 2
      const [duelWinner, setDuelWinner] = useState(null);

      const timerRef = useRef(null);

      const loadNewQuestion = useCallback(() => {
        setFeedback(null);
        setIsAnswering(false);
        const newQ = generateQuestion(module.type, grade);
        setQ(newQ);
        setTimeLeft(30);
        if (!isDuel) speak(newQ.speakText);
      }, [module.type, grade, isDuel]);

      useEffect(() => {
        loadNewQuestion();
      }, [loadNewQuestion, isDuel]);

      useEffect(() => {
        if (feedback || showTheoremModal || duelWinner) return;
        timerRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              if (isDuel) {
                // Tour passé ou point perdu au temps
                handleDuelAnswer(null);
              } else {
                handleAnswer('');
              }
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timerRef.current);
      }, [q, feedback, showTheoremModal, duelWinner, isDuel]);

      const handleAnswer = (choice) => {
        if (isAnswering) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);

        const isCorrect = String(choice).trim() === String(q.ans).trim();

        if (isCorrect) {
          setShowConfetti(true);
          setTimeout(() => setShowConfetti(false), 1200);
          setFeedback({ success: true, text: "Bravo ! C'est une excellente réponse 🎉 (+10 XP)" });
          speak("Bravo ! C'est une excellente réponse !");
          setTimeout(() => {
            onResult(10);
            loadNewQuestion();
          }, 1300);
        } else {
          setFeedback({ success: false, text: `Oups... La bonne réponse était : ${q.ans}` });
          speak(`Ce n'est pas tout à fait ça. La bonne réponse était ${q.ans}`);
          setTimeout(() => {
            loadNewQuestion();
          }, 2400);
        }
      };

      const handleDuelAnswer = (choice) => {
        if (isAnswering) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);

        const isCorrect = String(choice).trim() === String(q.ans).trim();

        if (isCorrect) {
          setDuelScores(prev => {
            const updated = { ...prev, [`p${activePlayerTurn}`]: prev[`p${activePlayerTurn}`] + 1 };
            if (updated[`p${activePlayerTurn}`] >= 5) {
              setDuelWinner(activePlayerTurn);
              speak(`Joueur ${activePlayerTurn} remporte la partie de duel ! Félicitations !`);
            }
            return updated;
          });
          setFeedback({ success: true, text: `Joueur ${activePlayerTurn} marque un point ! 🎉` });
        } else {
          setFeedback({ success: false, text: `Raté pour Joueur ${activePlayerTurn} ! C'était ${q.ans}` });
        }

        setTimeout(() => {
          if (!duelWinner) {
            setActivePlayerTurn(prev => (prev === 1 ? 2 : 1));
            loadNewQuestion();
          }
        }, 1800);
      };

      const theoremData = THEOREMS_EXPLANATIONS[module.type] || {
        title: `Le secret du module : ${module.name}`,
        why: "Ce module te permet de développer tes réflexes logiques et mathématiques.",
        rule: "Observe bien l'énoncé et procède étape par étape."
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-xl mx-auto shadow-2xl relative animate-pop">
          {showConfetti && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
              <div className="confetti-piece">⭐ 🎉 🌟 🎈 ✨ 🍕</div>
            </div>
          )}

          {/* Modal Pourquoi & Théorème */}
          {showTheoremModal && (
            <div className="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-3xl z-30 p-6 flex flex-col justify-between animate-pop">
              <div>
                <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                  <h3 className="text-base font-black text-amber-400 flex items-center gap-2">
                    <span>💡</span> {theoremData.title}
                  </h3>
                  <button
                    onClick={() => { setShowTheoremModal(false); }}
                    className="text-slate-400 hover:text-white font-bold text-sm px-3 py-1 bg-slate-800 rounded-xl cursor-pointer"
                  >
                    ✕ Fermer
                  </button>
                </div>
                
                <div className="space-y-4 text-sm">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <h4 className="font-extrabold text-indigo-400 mb-1 text-xs uppercase tracking-wider">Pourquoi apprend-on cela ?</h4>
                    <p className="text-slate-300 leading-relaxed">{theoremData.why}</p>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <h4 className="font-extrabold text-emerald-400 mb-1 text-xs uppercase tracking-wider">Règle ou Théorème clé</h4>
                    <p className="text-slate-300 leading-relaxed whitespace-pre-line">{theoremData.rule}</p>
                  </div>
                </div>
              </div>

              <button
                onClick={() => speak(theoremData.why + ". " + theoremData.rule)}
                className="w-full bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 py-3 rounded-2xl text-xs font-bold border border-indigo-500/30 transition cursor-pointer flex items-center justify-center gap-2 mt-4"
              >
                🔊 Écouter l'explication complète
              </button>
            </div>
          )}

          {/* En-tête avec option Duel si c'est le module tables */}
          <div className="flex justify-between items-center mb-6">
            <button
              onClick={onBack}
              className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs transition cursor-pointer"
            >
              ← Retour
            </button>

            {module.type === 'mult_tables' && (
              <button
                onClick={() => {
                  setIsDuel(!isDuel);
                  setDuelScores({ p1: 0, p2: 0 });
                  setDuelWinner(null);
                  setActivePlayerTurn(1);
                }}
                className={`px-4 py-2 rounded-xl text-xs font-black transition cursor-pointer flex items-center gap-2 shadow-md ${
                  isDuel ? 'bg-rose-600 text-white animate-pulse' : 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 hover:bg-indigo-600/50'
                }`}
              >
                <span>⚔️</span> {isDuel ? 'Mode Solo' : 'Activer Mode Duel (2 Joueurs)'}
              </button>
            )}
            
            <button
              onClick={() => {
                setShowTheoremModal(true);
                speak("Voici l'explication et le théorème de ce module : " + theoremData.why);
              }}
              className="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-3 py-2 rounded-xl text-xs font-black transition cursor-pointer flex items-center gap-1.5 shadow-md"
            >
              <span>💡</span> Pourquoi & Théorème
            </button>

            {!isDuel && (
              <span className="text-xs font-mono font-bold bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl">
                ⏱️ {timeLeft}s
              </span>
            )}
          </div>

          {/* Affichage du tableau de score Duel si activé */}
          {isDuel && (
            <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl mb-6 flex justify-around items-center">
              <div className={`text-center p-2 rounded-xl ${activePlayerTurn === 1 ? 'bg-indigo-600/20 border border-indigo-500' : ''}`}>
                <p className="text-xs font-bold text-indigo-400">Joueur 1</p>
                <p className="text-2xl font-black text-white">{duelScores.p1} <span className="text-xs text-slate-400">/ 5 pts</span></p>
                {activePlayerTurn === 1 && !duelWinner && <span className="text-[10px] text-amber-400 font-bold animate-bounce">À ton tour ! 🎯</span>}
              </div>

              <div className="text-xl font-black text-slate-600">VS</div>

              <div className={`text-center p-2 rounded-xl ${activePlayerTurn === 2 ? 'bg-rose-600/20 border border-rose-500' : ''}`}>
                <p className="text-xs font-bold text-rose-400">Joueur 2</p>
                <p className="text-2xl font-black text-white">{duelScores.p2} <span className="text-xs text-slate-400">/ 5 pts</span></p>
                {activePlayerTurn === 2 && !duelWinner && <span className="text-[10px] text-amber-400 font-bold animate-bounce">À ton tour ! 🎯</span>}
              </div>
            </div>
          )}

          {duelWinner ? (
            <div className="text-center py-10 space-y-4 animate-pop">
              <div className="text-5xl">🏆</div>
              <h2 className="text-2xl font-black text-amber-400">Victoire du Joueur {duelWinner} !</h2>
              <p className="text-sm text-slate-300">Quel superbe duel mathématique de niveau {grade}.</p>
              <button
                onClick={() => {
                  setDuelScores({ p1: 0, p2: 0 });
                  setDuelWinner(null);
                  setActivePlayerTurn(1);
                  loadNewQuestion();
                }}
                className="bg-indigo-600 hover:bg-indigo-500 text-white font-black px-6 py-3 rounded-2xl text-sm shadow-lg cursor-pointer mt-4"
              >
                Relancer un Duel ⚔️
              </button>
            </div>
          ) : (
            <>
              <div className="text-center my-6">
                <div className="text-4xl mb-3">{isDuel ? (activePlayerTurn === 1 ? '🔵' : '🔴') : module.icon}</div>
                <h2 className="text-lg sm:text-xl font-black text-white whitespace-pre-line leading-relaxed bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                  {isDuel ? <span className="text-amber-400 text-xs block mb-1 uppercase tracking-wider">Tour du Joueur {activePlayerTurn}</span> : null}
                  {q.text}
                </h2>
                {!isDuel && (
                  <button
                    onClick={() => speak(q.speakText)}
                    className="mt-4 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 px-4 py-2 rounded-xl text-xs font-bold border border-indigo-500/30 transition cursor-pointer inline-flex items-center gap-2"
                  >
                    🔊 Réécouter l'énoncé vocal
                  </button>
                )}
              </div>

              {feedback && (
                <div className={`p-4 rounded-2xl mb-6 text-center font-black text-sm animate-pop ${
                  feedback.success ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 animate-happy' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                }`}>
                  {feedback.text}
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {q.options.map((opt, idx) => (
                  <button
                    key={idx}
                    disabled={isAnswering}
                    onClick={() => {
                      if (isDuel) {
                        handleDuelAnswer(opt);
                      } else {
                        handleAnswer(opt);
                      }
                    }}
                    className={`font-black py-4 px-4 rounded-2xl border transition-all active:scale-95 text-sm sm:text-base shadow-lg cursor-pointer disabled:opacity-50 ${
                      isDuel && activePlayerTurn === 2 
                        ? 'bg-slate-800 hover:bg-rose-600 border-slate-700 hover:border-rose-400 text-white' 
                        : 'bg-slate-800 hover:bg-indigo-600 border-slate-700 hover:border-indigo-400 text-white'
                    }`}
                  >
                    {opt}
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    function App() {
      const [userName, setUserName] = useState('');
      const [selectedGrade, setSelectedGrade] = useState('CE1');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeModule, setActiveModule] = useState(null);
      const [score, setScore] = useState(0);

      const handleLogin = (e) => {
        e.preventDefault();
        if (userName.trim()) {
          setIsLoggedIn(true);
          speak(`Bienvenue ${userName} sur l'académie des mathématiques ! Choisis ton module pour commencer.`);
        }
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl animate-pop text-center">
              <div className="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg shadow-indigo-600/30">
                🎓
              </div>
              <h1 className="text-2xl font-black text-white mb-2">MathsAcademy</h1>
              <p className="text-xs text-slate-400 mb-6">Des tables de multiplication adaptatives du CP à la Terminale et mode Duel à deux !</p>

              <form onSubmit={handleLogin} className="space-y-4 text-left">
                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">Ton Prénom</label>
                  <input
                    type="text"
                    required
                    value={userName}
                    onChange={(e) => setUserName(e.target.value)}
                    placeholder="Ex: Lucas, Emma..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-white font-bold outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">Ton Niveau Scolaire</label>
                  <select
                    value={selectedGrade}
                    onChange={(e) => setSelectedGrade(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-white font-bold outline-none focus:border-indigo-500 cursor-pointer"
                  >
                    {[...GRADES_ROW_1, ...GRADES_ROW_2].map(g => (
                      <option key={g} value={g}>{g}</option>
                    ))}
                  </select>
                </div>
                <button
                  type="submit"
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-600/30 active:scale-95 cursor-pointer mt-2"
                >
                  COMMENCER L'AVENTURE 🚀
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-between">
          <div>
            <header className="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
              <div className="flex items-center gap-3">
                <span className="text-3xl">🎓</span>
                <div>
                  <h1 className="text-base font-black text-white">MathsAcademy</h1>
                  <p className="text-xs text-slate-400">Joueur : <span className="font-bold text-white">{userName} ({selectedGrade})</span></p>
                </div>
              </div>
              <div className="bg-slate-900 border border-amber-500/30 px-4 py-2 rounded-2xl flex items-center gap-2 shadow-md">
                <span className="text-amber-400 text-lg">⭐</span>
                <span className="text-sm font-black text-amber-400">{score} XP</span>
              </div>
            </header>

            <main className="mb-8">
              {!activeModule ? (
                <>
                  <div className="flex flex-col gap-2 mb-8">
                    <div className="flex flex-wrap gap-2">
                      {GRADES_ROW_1.map(g => (
                        <button
                          key={g}
                          onClick={() => setSelectedGrade(g)}
                          className={`px-4 py-2 rounded-2xl font-extrabold text-xs transition-all cursor-pointer ${
                            selectedGrade === g ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white'
                          }`}
                        >
                          {g}
                        </button>
                      ))}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {GRADES_ROW_2.map(g => (
                        <button
                          key={g}
                          onClick={() => setSelectedGrade(g)}
                          className={`px-4 py-2 rounded-2xl font-extrabold text-xs transition-all cursor-pointer ${
                            selectedGrade === g ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white'
                          }`}
                        >
                          {g}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
                    {CURRICULUM[selectedGrade]?.map(m => (
                      <div
                        key={m.id}
                        onClick={() => setActiveModule(m)}
                        className="bg-slate-900 border border-slate-800 hover:border-indigo-500 hover:bg-indigo-950/20 p-6 rounded-3xl transition-all flex flex-col justify-between h-40 shadow-lg cursor-pointer group"
                      >
                        <div className="flex items-start justify-between">
                          <span className="text-3xl bg-slate-950 p-2.5 rounded-2xl border border-slate-800 group-hover:scale-110 transition-transform">{m.icon}</span>
                          <span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-xl">
                            {m.domain}
                          </span>
                        </div>
                        <div>
                          <h3 className="font-extrabold text-base text-white group-hover:text-indigo-400 transition-colors">{m.name}</h3>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              ) : (
                <ExerciseRunner
                  userName={userName}
                  grade={selectedGrade}
                  module={activeModule}
                  onBack={() => setActiveModule(null)}
                  onResult={(xp) => setScore(s => s + xp)}
                />
              )}
            </main>
          </div>

          <footer className="py-4 border-t border-slate-900 flex justify-between items-center text-xs text-slate-500">
            <button
              onClick={() => { setIsLoggedIn(false); setActiveModule(null); }}
              className="hover:text-indigo-400 transition cursor-pointer underline font-medium"
            >
              Changer d'élève
            </button>
            <span>MathsAcademy © 2026</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
