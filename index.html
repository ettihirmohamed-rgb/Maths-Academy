    const IS_MATERNELLE = grade => ['PS','MS','GS'].includes(grade);
    const SPEAK_LANG = 'fr-FR';

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function makeOptions(answer, candidates) {
      const opts = [];
      [...candidates, answer].forEach(v => {
        const s = String(v);
        if (!opts.includes(s)) opts.push(s);
      });
      while (opts.length < 4) {
        const n = Number(answer);
        if (Number.isFinite(n)) {
          let candidate = String(n + opts.length + 1);
          if (!opts.includes(candidate)) opts.push(candidate);
        } else {
          const extra = ['Je ne sais pas', 'Essaie encore', 'Autre réponse'];
          const candidate = extra.find(x => !opts.includes(x));
          if (candidate) opts.push(candidate);
          else break;
        }
      }
      return shuffle(opts).slice(0,4);
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = SPEAK_LANG;
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
      }
    }

    function generateQuestion(type, difficulty=1) {
      let text='', ans='', options=[], visual=null, hint='', explanation='';

      // MATERNELLE
      if (type === 'ps_shapes') {
        text='Montre la forme parfaitement ronde.';
        ans='🔴 Rond';
        options=shuffle(['🔴 Rond','🟦 Carré','🔺 Triangle','⭐ Étoile']);
        visual='circleSquare';
        hint='Cherche la forme sans coin.';
        explanation='Un rond n’a pas de coin.';

      } else if (type === 'ps_sort') {
        const target = Math.random()>.5 ? '🍎' : '🟦';
        const items = target==='🍎' ? ['🍎','🟦','🍎','🔺','🍎'] : ['🟦','🍎','🟦','🔺','🟦'];
        text=`Quel objet faut-il mettre avec les ${target} ?`;
        ans=target;
        options=shuffle(['🍎','🟦','🔺','⭐']);
        hint='Regarde la famille d’objets qui se ressemble.';
        explanation='Trier, c’est regrouper les objets qui ont une même caractéristique.';

      } else if (type === 'ps_count3') {
        const n=Math.floor(Math.random()*3)+1;
        text=`Compte les étoiles : ${'⭐'.repeat(n)}`;
        ans=String(n);
        options=shuffle(['1','2','3']);
        hint='Touche chaque étoile une seule fois en comptant.';
        explanation=`Il y a ${n} étoile${n>1?'s':''}.`;

      } else if (type === 'ps_space') {
        const inside=Math.random()>.5;
        text=inside ? 'Le petit rond est-il DANS la boîte ou DEHORS ?' : 'Le petit rond est-il SUR ou SOUS la boîte ?';
        ans=inside ? 'Dans' : 'Sous';
        options=inside ? shuffle(['Dans','Dehors','Sur','À côté']) : shuffle(['Sous','Sur','Dans','Dehors']);
        hint=inside ? 'Regarde si le rond est entouré par la boîte.' : 'Regarde la position verticale.';
        explanation=inside ? 'Dans signifie à l’intérieur.' : 'Sous signifie plus bas que la boîte.';

      } else if (type === 'ps_patterns') {
        text='Quelle couleur vient après : 🔴 🔵 🔴 🔵 ... ?';
        ans='🔴';
        options=shuffle(['🔴','🔵','🟡','🟢']);
        hint='Le rythme recommence : rouge, bleu, rouge, bleu…';
        explanation='Le motif alterne deux couleurs.';

      // MS
      } else if (type === 'ms_count6') {
        const n=Math.floor(Math.random()*5)+2;
        text=`Combien y a-t-il de pommes ? ${'🍎'.repeat(n)}`;
        ans=String(n);
        options=makeOptions(ans,[n-1,n+1,4,6]);
        hint='Associe un seul nombre à chaque pomme.';
        explanation=`Il y a ${n} pommes.`;

      } else if (type === 'ms_compare') {
        let a=Math.floor(Math.random()*5)+1, b=Math.floor(Math.random()*5)+1;
        while(a===b) b=Math.floor(Math.random()*5)+1;
        text=`Quelle collection a LE PLUS d’objets ?  ${'🟢'.repeat(a)}  ou  ${'🟣'.repeat(b)} ?`;
        ans=a>b ? '🟢' : '🟣';
        options=shuffle(['🟢','🟣']);
        hint='Tu peux compter les deux collections ou faire des paires.';
        explanation='La collection qui reste avec des objets non appariés est la plus grande.';

      } else if (type === 'ms_triangle') {
        text='Quelle forme a trois côtés ?';
        ans='🔺 Triangle';
        options=shuffle(['🔺 Triangle','🟦 Carré','🔴 Rond','⬭ Ovale']);
        visual='triangle';
        hint='Compte les côtés.';
        explanation='Un triangle possède trois côtés.';

      } else if (type === 'ms_size') {
        text='Choisis le plus GRAND :';
        ans='🐘';
        options=shuffle(['🐘','🐭','🐜','🦋']);
        hint='Compare les tailles.';
        explanation='L’éléphant représente ici l’objet le plus grand.';

      } else if (type === 'ms_maze') {
        text='Pour sortir du petit labyrinthe, quelle direction choisir ?';
        ans='Droite';
        options=shuffle(['Droite','Gauche','Haut','Bas']);
        hint='Observe le chemin libre.';
        explanation='Dans ce petit modèle, le passage libre est à droite.';

      // GS
      } else if (type === 'gs_digits') {
        const n=Math.floor(Math.random()*9)+1;
        text=`Quel chiffre correspond à ${n} objet${n>1?'s':''} ? ${'●'.repeat(n)}`;
        ans=String(n);
        options=makeOptions(ans,[n-1,n+1,10]);
        hint='Compte les points puis cherche le symbole correspondant.';
        explanation=`Le nombre d’objets est ${n}.`;

      } else if (type === 'gs_num') {
        const n=Math.floor(Math.random()*9)+1;
        text=`Quel nombre vient juste après ${n} ?`;
        ans=String(n+1);
        options=makeOptions(ans,[n,n+2,10]);
        hint='Avance d’une unité.';
        explanation=`Après ${n}, on trouve ${n+1}.`;

      } else if (type === 'gs_decomp') {
        const n=Math.floor(Math.random()*5)+4, a=Math.floor(Math.random()*(n-1))+1;
        text=`${n} = ${a} + …`;
        ans=String(n-a);
        options=makeOptions(ans,[n-a-1,n-a+1,a]);
        hint='Cherche ce qu’il faut ajouter à la première quantité pour obtenir le total.';
        explanation=`${a} + ${n-a} = ${n}.`;

      } else if (type === 'gs_solids') {
        text='Lequel est un solide ?';
        ans='🧊 Cube';
        options=shuffle(['🧊 Cube','🔺 Triangle','🔴 Cercle','⬜ Carré']);
        visual='cube';
        hint='Un solide possède un volume : on peut le manipuler dans l’espace.';
        explanation='Le cube est un solide ; les autres réponses sont des figures planes.';

      } else if (type === 'gs_direction') {
        text='Quelle direction est opposée à la droite ?';
        ans='Gauche';
        options=shuffle(['Gauche','Haut','Bas','Devant']);
        hint='Imagine une ligne horizontale.';
        explanation='Gauche et droite sont deux directions opposées.';

      } else if (type === 'gs_algorithm') {
        text='Complète le rythme : 🔴 🔵 🔵 🔴 🔵 🔵 …';
        ans='🔴';
        options=shuffle(['🔴','🔵','🟡','🟢']);
        hint='Le bloc de trois couleurs est 🔴 🔵 🔵.';
        explanation='Le motif se répète par groupes de trois.';

      // CP
      } else if (type === 'cp_num100') {
        const n=Math.floor(Math.random()*90)+10;
        text=`Quel nombre vient juste avant ${n} ?`;
        ans=String(n-1);
        options=makeOptions(ans,[n,n+1,n-10]);
        hint='Recule d’une unité.';
        explanation=`Le nombre juste avant ${n} est ${n-1}.`;

      } else if (type === 'cp_add') {
        const a=Math.floor(Math.random()*30)+5,b=Math.floor(Math.random()*20)+1;
        text=`Calcule : ${a} + ${b} = ?`; ans=String(a+b);
        options=makeOptions(ans,[a+b+1,a+b-1,a+b+10]);
        hint='Tu peux décomposer le deuxième nombre.';
        explanation=`${a} + ${b} = ${a+b}.`;

      } else if (type === 'cp_sub') {
        const a=Math.floor(Math.random()*40)+15,b=Math.floor(Math.random()*12)+1;

        options=shuffle(['sin²x + cos²x = 1','sin x + cos x = 1','tan x = sin x + cos x','sin²x − cos²x = 1']);

        explanation='Pour tout réel x, sin²x + cos²x = 1.';

      } else if (type === 'p1_dot') {
        text='Dans une base orthonormée, u·v = ?'; ans='x₁x₂ + y₁y₂';
        options=shuffle(['x₁x₂ + y₁y₂','x₁+y₁+x₂+y₂','x₁/x₂+y₁/y₂','x₁x₂−y₁y₂']);
        hint='Multiplie les coordonnées correspondantes puis additionne.';
        explanation='u·v=x₁x₂+y₁y₂ en base orthonormée.';

      } else if (type === 'p1_binomial') {
        text='Pour X~B(n,p), l’espérance vaut…'; ans='np';
        options=shuffle(['np','n+p','n/p','p−n']);
        hint='C’est le produit du nombre d’épreuves par la probabilité de succès.';
        explanation='E(X)=np pour une loi binomiale.';

      // TERMINALE
      } else if (type === 'term_limits') {
        text='Limite de 1/x quand x → +∞ ?'; ans='0';
        options=shuffle(['0','+∞','1','−∞']);
        hint='Le dénominateur devient arbitrairement grand.';
        explanation='1/x tend vers 0 lorsque x tend vers +∞.';

      } else if (type === 'term_ln') {
        text='Quelle propriété est correcte pour x>0 et y>0 ?'; ans='ln(xy)=ln(x)+ln(y)';
        options=shuffle(['ln(xy)=ln(x)+ln(y)','ln(x+y)=ln(x)+ln(y)','ln(x/y)=ln(x)ln(y)','ln(x²)=ln(x)']);
        hint='Le logarithme transforme un produit en somme.';
        explanation='ln(xy)=ln(x)+ln(y).';

      } else if (type === 'term_integral') {
        text='Une intégrale définie peut représenter, sous certaines conditions, une…'; ans='Aire algébrique';
        options=shuffle(['Aire algébrique','Moyenne uniquement','Longueur uniquement','Probabilité toujours']);
        hint='Pense à l’aire située entre une courbe et l’axe.';
        explanation='Une intégrale peut représenter une aire algébrique.';

      } else if (type === 'term_space') {
        text='Dans l’espace, un vecteur possède…'; ans='3 coordonnées';
        options=shuffle(['3 coordonnées','2 coordonnées toujours','1 coordonnée','4 coordonnées']);
        hint='Un point de l’espace est repéré par x, y, z.';
        explanation='Dans un repère de l’espace, un vecteur peut être décrit par trois coordonnées.';

      } else if (type === 'term_combi') {
        text='Combien de façons de choisir 1 objet parmi 5 ?'; ans='5';
        options=shuffle(['5','1','10','25']);
        hint='Chaque objet est un choix possible.';
        explanation='Il y a 5 choix possibles.';

      } else if (type === 'term_prob') {
        text='La somme des probabilités de toutes les issues d’un univers fini vaut…'; ans='1';
        options=shuffle(['1','0','100','−1']);
        hint='Une probabilité totale représente tout l’univers.';
        explanation='La somme des probabilités des issues vaut 1.';

      } else if (type === 'term_diff') {
        text='Quelle fonction vérifie y′ = y ?'; ans='y = Ce^x';
        options=shuffle(['y = Ce^x','y = Cx','y = C/x','y = C+x']);
        hint='La dérivée de e^x est e^x.';
        explanation='Les solutions de y′=y sont y=Ce^x.';
      } else {
        text='Calcule 7 × 8.'; ans='56';
        options=shuffle(['56','54','64','48']);
        hint='Utilise la table de 7 ou de 8.';
        explanation='7 × 8 = 56.';
      }

      return { text, ans, options, visual, hint, explanation };
    }

    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const isMat = IS_MATERNELLE(grade);
      const [difficulty, setDifficulty] = useState(1);
      const [q, setQ] = useState(() => generateQuestion(module.type, 1));
      const [feedback, setFeedback] = useState(null);
      const [showHint, setShowHint] = useState(false);
      const [answered, setAnswered] = useState(false);

      const nextQuestion = () => {
        setFeedback(null);
        setShowHint(false);
        setAnswered(false);
        setQ(generateQuestion(module.type, difficulty));
      };

      useEffect(() => {
        nextQuestion();
      }, [module.type]);

      const handleAnswer = val => {
        if (answered) return;
        setAnswered(true);
        if (val === q.ans) {
          const xp = isMat ? 10 + difficulty * 2 : 10 + difficulty * 5;
          setFeedback({ success:true, msg:`Bravo ${userName} ! Tu as trouvé. +${xp} XP` });
          if (difficulty < 3) setDifficulty(d => d + 1);
          if (isMat) speak(`Bravo ${userName} !`);
          setTimeout(() => {
            onResult(xp);
            nextQuestion();
          }, 1100);
        } else {
          setFeedback({
            success:false,
            msg:`Ce n’est pas ${val}. La bonne réponse est ${q.ans}.`
          });
          if (difficulty > 1) setDifficulty(d => d - 1);
          if (isMat) speak(`Ce n’est pas grave. Regarde l’indice.`);
        }
      };

      return (
        <div className="bg-slate-900/90 p-5 sm:p-8 rounded-3xl max-w-2xl mx-auto border border-slate-800 shadow-2xl animate-pop">
          <div className="flex justify-between items-center gap-3 mb-5">
            <button onClick={onBack} className="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs font-black">
              ← RETOUR
            </button>
            <span className="text-xs font-black text-indigo-300 bg-indigo-950 px-3 py-2 rounded-xl">
              {grade} • {module.name}
            </span>
            <span className="text-xs font-bold text-slate-400">Niveau {difficulty}/3</span>
          </div>

          {isMat && (
            <button
              onClick={() => speak(q.text)}
              className="mb-3 bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-full font-bold text-xs"
            >
              🔊 Réécouter
            </button>
          )}

          {q.visual && <VisualGraphic type={q.visual} />}

          <div className="bg-slate-950/60 rounded-2xl p-5 mb-5">
            <p className="text-xs uppercase tracking-wide text-indigo-400 font-black mb-2">À toi de chercher</p>
            <h2 className="text-xl sm:text-2xl font-black leading-relaxed">{q.text}</h2>
          </div>

          {feedback && (
            <div className={`p-4 rounded-2xl mb-4 font-bold text-sm ${
              feedback.success
                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                : 'bg-amber-500/15 text-amber-200 border border-amber-500/30'
            }`}>
              {feedback.msg}
              {!feedback.success && (
                <p className="mt-2 text-slate-300 font-medium">{q.explanation}</p>
              )}
            </div>
          )}

          <div className="grid grid-cols-2 gap-3">
            {q.options.map((opt, i) => (
              <button
                key={i}
                disabled={answered}
                onClick={() => handleAnswer(opt)}
                className={`bg-slate-800 hover:bg-indigo-600 disabled:opacity-60 text-white font-black py-4 px-3 rounded-2xl border border-slate-700 transition-all active:scale-95 text-base ${
                  opt === q.ans && answered ? 'ring-2 ring-emerald-400' : ''
                }`}
              >
                {opt}
              </button>
            ))}
          </div>

          <div className="mt-5">
            <button
              onClick={() => setShowHint(v => !v)}
              className="text-sm font-bold text-indigo-300 hover:text-indigo-200"
            >
              💡 {showHint ? 'Masquer l’indice' : 'Besoin d’un indice ?'}
            </button>
            {showHint && (
              <div className="mt-2 bg-indigo-950/50 border border-indigo-800/40 rounded-xl p-3 text-sm text-indigo-100">
                {q.hint}
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [userName, setUserName] = useState('');
      const [selectedGrade, setSelectedGrade] = useState('CP');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeModule, setActiveModule] = useState(null);
      const [score, setScore] = useState(0);

      const handleStart = e => {
        e.preventDefault();
        if (userName.trim()) setIsLoggedIn(true);
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900/90 p-8 rounded-3xl max-w-md w-full border border-slate-800 shadow-2xl text-center animate-pop">
              <div className="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4">
                🎓
              </div>
              <h1 className="text-2xl font-black mb-2">MathsAcademy</h1>
              <p className="text-sm text-slate-400 mb-6">
                Un parcours progressif : observer → manipuler → comprendre → s’entraîner.
              </p>

              <form onSubmit={handleStart} className="space-y-5 text-left">
                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">
                    Ton prénom
                  </label>
                  <input
                    type="text"
                    required
                    value={userName}
                    onChange={e => setUserName(e.target.value)}
                    placeholder="Ex. Lucas, Emma…"
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 font-bold outline-none focus:border-indigo-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">
                    Ton niveau scolaire
                  </label>
                  <select
                    value={selectedGrade}
                    onChange={e => setSelectedGrade(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 font-bold outline-none focus:border-indigo-500"
                  >
                    {Object.keys(CURRICULUM).map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                </div>

                <button
                  type="submit"
                  className="w-full bg-indigo-600 hover:bg-indigo-500 font-black py-4 rounded-2xl shadow-lg active:scale-95"
                >
                  COMMENCER 🚀
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-5xl mx-auto p-4">
          <header className="flex justify-between items-center py-4 border-b border-slate-800 mb-6 gap-4">
            <div className="flex items-center gap-3">
              <span className="text-3xl">🎓</span>
              <div>
                <h1 className="text-lg font-black">MathsAcademy</h1>
                <p className="text-xs text-indigo-400 font-bold">
                  Joueur : {userName} • {selectedGrade}
                </p>
              </div>
            </div>
            <div className="bg-slate-900 px-4 py-2 rounded-2xl border border-indigo-500/30">
              <span className="text-xs text-slate-400 font-extrabold mr-2">XP</span>
              <span className="text-lg font-black text-amber-400">{score}</span>
            </div>
          </header>

          {!activeModule ? (
            <>
              <div className="mb-5">
                <h2 className="text-2xl font-black mb-1">Choisis ton atelier</h2>
                <p className="text-sm text-slate-400">
                  Chaque atelier cible une compétence précise du niveau choisi.
                </p>
              </div>

              <div className="flex gap-2 overflow-x-auto pb-4 mb-6">
                {Object.keys(CURRICULUM).map(g => (
                  <button
                    key={g}
                    onClick={() => setSelectedGrade(g)}
                    className={`px-4 py-2 rounded-2xl font-black text-xs whitespace-nowrap ${
                      selectedGrade === g
                        ? 'bg-indigo-600 text-white'
                        : 'bg-slate-900 text-slate-400 hover:bg-slate-800'
                    }`}
                  >
                    {g}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                {CURRICULUM[selectedGrade].map(m => (
                  <button
                    key={m.id}
                    onClick={() => setActiveModule(m)}
                    className="bg-slate-900/80 p-5 rounded-3xl text-left border border-slate-800 hover:border-indigo-500 hover:bg-indigo-950/30 transition-all flex flex-col justify-between min-h-40 shadow-md"
                  >
                    <span className="text-3xl">{m.icon}</span>
                    <span className="font-extrabold text-sm text-slate-200">{m.name}</span>
                    <span className="text-[11px] text-slate-500 mt-2">Atelier ciblé</span>
                  </button>
                ))}
              </div>
            </>
          ) : (
            <ExerciseRunner
              userName={userName}
              grade={selectedGrade}
              module={activeModule}
              onBack={() => setActiveModule(null)}
              onResult={xp => setScore(s => s + xp)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

<section id="defis-calcul-progressifs" class="calc-challenge">
  <h2>🧠 Défis de calcul progressifs</h2>
  <p class="calc-muted">
    À partir du CP : 10 questions par niveau. Une fois les 10 réussies,
    le niveau suivant est débloqué. Le chronomètre est activé pour les défis.
  </p>

  <div class="calc-tabs">
    <button class="active" data-calc-mode="tables">Tables de multiplication</button>
    <button data-calc-mode="addsub">Additions &amp; soustractions</button>
  </div>

  <div class="calc-grid">
    <div class="calc-card">
      <div class="calc-level" id="calcLevelLabel">CP — Niveau 1</div>
      <div class="calc-score" id="calcScore">Question 1 / 10 · Réussites : 0</div>
      <div class="calc-progress"><div id="calcProgressBar" style="width:0%"></div></div>
      <div class="calc-timer">⏱️ <span id="calcTimer">--</span></div>
    </div>

    <div class="calc-card">
      <div class="calc-muted">Progression proposée</div>
      <ul id="calcDifficultyList"></ul>
    </div>
  </div>

  <div class="calc-card" style="margin-top:16px">
    <div id="calcQuestion" class="calc-question">—</div>
    <input id="calcAnswer" class="calc-input" type="number" inputmode="numeric" autocomplete="off"
           placeholder="Ta réponse" aria-label="Réponse">
    <div class="calc-actions" style="display:flex;justify-content:center;gap:10px;margin-top:14px">
      <button id="calcValidate">Valider</button>
      <button id="calcNext" style="display:none">Question suivante</button>
      <button id="calcRestart">Recommencer</button>
    </div>
    <div id="calcFeedback" class="calc-feedback"></div>
  </div>
</section>

<script>
(function(){
  const grades = [
    {name:"CP", tableMax:2, addMax:10, subMax:10},
    {name:"CE1", tableMax:5, addMax:50, subMax:50},
    {name:"CE2", tableMax:10, addMax:100, subMax:100},
    {name:"CM1", tableMax:10, addMax:1000, subMax:1000},
    {name:"CM2", tableMax:10, addMax:10000, subMax:10000},
    {name:"6ème", tableMax:10, addMax:100000, subMax:100000},
    {name:"5ème", tableMax:10, addMax:1000000, subMax:1000000},
    {name:"4ème", tableMax:10, addMax:10000000, subMax:10000000},
    {name:"3ème", tableMax:10, addMax:100000000, subMax:100000000},
    {name:"Seconde", tableMax:12, addMax:1000000000, subMax:1000000000},
    {name:"1ère", tableMax:15, addMax:10000000000, subMax:10000000000},
    {name:"Terminale", tableMax:20, addMax:100000000000, subMax:100000000000}
  ];

  const modeConfig = {
    tables: {
      label:"Tables de multiplication",
      levels:[
        "Tables 2 et 5 · produits directs",
        "Tables 2, 5 et 10 · mélange",
        "Tables 2 à 5 · mélange",
        "Tables 2 à 10 · mélange",
        "Tables 2 à 10 · calculs à trous",
        "Tables 2 à 10 · facteurs inversés",
        "Tables 2 à 10 · rapidité",
        "Produits plus grands · pièges de calcul",
        "Produits mélangés · niveau avancé",
        "Défi expert · mélange complet"
      ]
    },
    addsub: {
      label:"Additions & soustractions",
      levels:[
        "Additions jusqu'à 10",
        "Additions et soustractions jusqu'à 20",
        "Jusqu'à 100 · sans retenue complexe",
        "Jusqu'à 1 000 · retenues",
        "Grands nombres · jusqu'à 10 000",
        "Calculs en chaîne",
        "Nombres relatifs",
        "Priorités et expressions simples",
        "Calcul littéral / nombres complexes",
        "Défi avancé"
      ]
    }
  };

  let mode="tables", gradeIndex=0, level=0, qIndex=0, successes=0;
  let current=null, timer=null, remaining=0, locked=false;

  const $=id=>document.getElementById(id);
  const levelLabel=$("calcLevelLabel"), score=$("calcScore"), progress=$("calcProgressBar"),
        timerEl=$("calcTimer"), question=$("calcQuestion"), answer=$("calcAnswer"),
        feedback=$("calcFeedback"), validate=$("calcValidate"), next=$("calcNext"),
        restart=$("calcRestart"), difficultyList=$("calcDifficultyList");

  function rand(n){return Math.floor(Math.random()*n);}
  function randInt(a,b){return a+rand(b-a+1);}
  function shuffle(a){return a.sort(()=>Math.random()-.5);}

  function getTableQuestion(){
    const g=grades[gradeIndex], L=level;
    let a,b;
    if(L===0){a=shuffle([2,5])[0]; b=randInt(1,5);}
    else if(L===1){a=shuffle([2,5,10])[0]; b=randInt(1,10);}
    else if(L===2){a=randInt(2,5); b=randInt(1,10);}
    else {a=randInt(2,g.tableMax); b=randInt(1,10);}
    if(L>=4 && Math.random()<.35) return {text:`${a} × ? = ${a*b}`, answer:b};
    if(L>=5 && Math.random()<.25) return {text:`? × ${b} = ${a*b}`, answer:a};
    return {text:`${a} × ${b} = ?`, answer:a*b};
  }

  function getAddSubQuestion(){
    const g=grades[gradeIndex], L=level;
    if(L<=1){
      const max=L===0?10:20, a=randInt(0,max), b=randInt(0,max);
      const sub=Math.random()<.45;
      if(sub){const x=Math.max(a,b),y=Math.min(a,b);return {text:`${x} − ${y} = ?`,answer:x-y};}
      return {text:`${a} + ${b} = ?`,answer:a+b};
    }
    if(L<=4){
      const max=g.addMax, a=randInt(0,max), b=randInt(0,max);
      const sub=Math.random()<.45;
      if(sub){const x=Math.max(a,b),y=Math.min(a,b);return {text:`${x} − ${y} = ?`,answer:x-y};}
      return {text:`${a} + ${b} = ?`,answer:a+b};
    }
    if(L===5){
      const a=randInt(1,999), b=randInt(1,999), c=randInt(1,999);
      return Math.random()<.5
        ? {text:`${a} + ${b} − ${c} = ?`,answer:a+b-c}
        : {text:`${a} − ${b} + ${c} = ?`,answer:a-b+c};
    }
    if(L===6){
      const a=randInt(-50,50), b=randInt(-50,50);
      return Math.random()<.5
        ? {text:`(${a}) + (${b}) = ?`,answer:a+b}
        : {text:`(${a}) − (${b}) = ?`,answer:a-b};
    }
    const a=randInt(1,99), b=randInt(1,99), c=randInt(1,20);
    if(L>=8){
      const d=randInt(1,20);
      return {text:`${a} + ${b} − ${c} + ${d} = ?`,answer:a+b-c+d};
    }
    return {text:`${a} + ${b} − ${c} = ?`,answer:a+b-c};
  }

  function timeForLevel(){
    // Le temps diminue progressivement, sans rendre le CP excessivement court.
    return Math.max(12, 45 - level*3 - Math.floor(gradeIndex/3)*2);
  }

  function renderDifficulty(){
    difficultyList.innerHTML="";
    modeConfig[mode].levels.forEach((x,i)=>{
      const li=document.createElement("li");
      li.textContent=(i===level?"▶ ":"")+(i+1)+". "+x;
      if(i<level) li.style.textDecoration="line-through";
      difficultyList.appendChild(li);
    });
  }

  function stopTimer(){ if(timer){clearInterval(timer);timer=null;} }

  function startTimer(){
    stopTimer(); remaining=timeForLevel(); timerEl.textContent=remaining+" s";
    timer=setInterval(()=>{
      remaining--; timerEl.textContent=remaining+" s";
      if(remaining<=0){ stopTimer(); locked=true; feedback.textContent="⏰ Temps écoulé. La réponse était "+current.answer+"."; next.style.display="inline-block"; }
    },1000);
  }

  function updateUI(){
    levelLabel.textContent=grades[gradeIndex].name+" — Niveau "+(level+1)+" · "+modeConfig[mode].label;
    score.textContent=`Question ${qIndex+1} / 10 · Réussites : ${successes}`;
    progress.style.width=(Math.min(qIndex,10)/10*100)+"%";
    renderDifficulty();
  }

  function newQuestion(){
    stopTimer(); locked=false; next.style.display="none"; feedback.textContent="";
    answer.value=""; answer.focus();
    current=mode==="tables"?getTableQuestion():getAddSubQuestion();
    question.textContent=current.text;
    updateUI(); startTimer();
  }

  function advance(){
    if(qIndex>=9){
      stopTimer(); progress.style.width="100%";
      if(successes===10){
        feedback.textContent=`🎉 Niveau ${level+1} validé ! Passage au niveau suivant.`;
        if(level<9) level++;
        else if(gradeIndex<grades.length-1){gradeIndex++;level=0;}
        qIndex=0; successes=0;
      } else {
        feedback.textContent=`Il faut 10 réussites sur 10 pour débloquer la suite. Recommence ce niveau.`;
        qIndex=0; successes=0;
      }
      setTimeout(newQuestion,900);
      return;
    }
    qIndex++; newQuestion();
  }

  function check(){
    if(locked) return;
    const v=Number(answer.value);
    if(answer.value.trim()==="") return;
    stopTimer(); locked=true;
    if(v===current.answer){
      successes++; feedback.textContent="✅ Correct !";
    }else{
      feedback.textContent=`❌ Pas encore. La bonne réponse est ${current.answer}.`;
    }
    score.textContent=`Question ${qIndex+1} / 10 · Réussites : ${successes}`;
    next.style.display="inline-block";
  }

  document.querySelectorAll("[data-calc-mode]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll("[data-calc-mode]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      mode=btn.dataset.calcMode; gradeIndex=0; level=0; qIndex=0; successes=0; newQuestion();
    });
  });

  validate.addEventListener("click",check);
  next.addEventListener("click",advance);
  restart.addEventListener("click",()=>{qIndex=0;successes=0;newQuestion();});
  answer.addEventListener("keydown",e=>{if(e.key==="Enter"){if(!locked)check();else advance();}});

  // Démarrage uniquement si le module est présent.
  newQuestion();
})();
</script>

</body>
</html>
