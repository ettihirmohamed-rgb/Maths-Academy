  // Moteur vocal corrigé pour forcer le français
const speak = (text) => {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const cleanText = text.replace(/[\/\+\-\×\÷\=\(\)\[\]#*⭐🔴🟦🔺🐘☁️🍎🔢🔵🏋️💶🕒🧊📐🍕🎯📦🌡️🔤🔄🎲ℝ📉➡️🌳ax²eˣln∫∞]/g, ' ');
    const u = new SpeechSynthesisUtterance(cleanText);
    u.lang = 'fr-FR';
    u.rate = 0.95;
    u.pitch = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const frenchVoice = voices.find(v => v.lang === 'fr-FR' || v.lang === 'fr_FR' || v.lang.startsWith('fr'));
    
    if (frenchVoice) {
      u.voice = frenchVoice;
    }

    window.speechSynthesis.speak(u);
  }
};

    if ('speechSynthesis' in window) {

    function generateQuestion(type) {
      let text = '', ans = '', opts = [], speakText = '';
      const r = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

      if (type.includes('tables') || type.includes('mult') || type.includes('operations')) {
        const a = r(2, 12), b = r(2, 12);
        text = `Combien font ${a} × ${b} ?`;
        ans = `${a * b}`;
        opts = [ans, `${a * b + r(1, 3)}`, `${a * b - r(1, 3)}`, `${a * (b + 1)}`];
      } else if (type === 'c6_fractions' || type.includes('fractions')) {
        const num = r(1, 4), den = r(5, 10);
        text = `Quelle fraction correspond à ${num} parts sur ${den} ?`;
        ans = `${num}/${den}`; opts = [`${num}/${den}`, `${den}/${num}`, `${num+1}/${den}`, `${num}/${den+1}`];
      } else if (type === 'c6_priorites') {
        text = "Calculer : 5 + 3 × 2 = ?";
        ans = "11"; opts = ["11", "16", "13", "10"];
      } else if (type === 'c6_perimetre') {
        text = "Quel est le rayon d'un disque si son diamètre vaut 10 cm ?";
        ans = "5 cm"; opts = ["5 cm", "10 cm", "20 cm", "25 cm"];
      } else if (type === 'c6_volume') {
        text = "Volume d'un pavé de longueur 3, largeur 2 et hauteur 4 ?";
        ans = "24"; opts = ["24", "9", "14", "20"];
      } else if (type === 'c6_symetrie') {
        text = "Que conserve la symétrie axiale ?";
        ans = "Les longueurs et les angles"; opts = ["Les longueurs et les angles", "Uniquement les aires", "Rien du tout", "Les milieux"];
      } else if (type === 'c6_donnees') {
        text = "Dans un graphique, que représente l'axe des ordonnées (vertical) ?";
        ans = "Les valeurs mesurées"; opts = ["Les valeurs mesurées", "Le temps uniquement", "Le titre", "Rien"];
      } else {
        const a = r(3, 25), b = r(2, 10);
        text = `Si tu as ${a} billes et que tu en gagnes ${b}, combien en as-tu en tout ?`;
        ans = `${a + b}`;
        opts = [`${a + b}`, `${a + b + 2}`, `${a + b - 1}`, `${a * b}`];
      }

      opts = Array.from(new Set(opts.map(String))).slice(0, 4);
      while (opts.length < 4) opts.push(String(r(10, 99)));
      opts = opts.sort(() => Math.random() - 0.5);

      speakText = text;
      return { text, ans: String(ans), options: opts, speakText };
    }

    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const [q, setQ] = useState({ text: '', ans: '', options: [], speakText: '' });
      const [feedback, setFeedback] = useState(null);
      const [isAnswering, setIsAnswering] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [timeLeft, setTimeLeft] = useState(30);
      const timerRef = useRef(null);

      const loadNewQuestion = useCallback(() => {
        setFeedback(null);
        setIsAnswering(false);
        const newQ = generateQuestion(module.type);
        setQ(newQ);
        setTimeLeft(30);
        speak(newQ.speakText);
      }, [module.type]);

      useEffect(() => {
        loadNewQuestion();
      }, [loadNewQuestion]);

      useEffect(() => {
        if (feedback) return;
        timerRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              handleAnswer('');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timerRef.current);
      }, [q, feedback]);

      const handleAnswer = (choice) => {
        if (isAnswering) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);

        const isCorrect = String(choice).trim() === String(q.ans).trim();

        if (isCorrect) {
          setShowConfetti(true);
          setTimeout(() => setShowConfetti(false), 1200);
          setFeedback({ success: true, text: "Bravo ! C'est une excellente réponse 🎉 (+10 XP)" });
          speak("Bravo ! C'est une excellente réponse !");
          setTimeout(() => {
            onResult(10);
            loadNewQuestion();
          }, 1300);
        } else {
          setFeedback({ success: false, text: `Oups... La bonne réponse était : ${q.ans}` });
          speak(`Ce n'est pas tout à fait ça. La bonne réponse était ${q.ans}`);
          setTimeout(() => {
            loadNewQuestion();
          }, 2400);
        }
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-xl mx-auto shadow-2xl relative animate-pop">
          {showConfetti && (
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
              <div className="confetti-piece">⭐ 🎉 🌟 🎈 ✨ 🍕</div>
            </div>
          )}

          <div className="flex justify-between items-center mb-6">
            <button
              onClick={onBack}
              className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs transition cursor-pointer"
            >
              ← Retour au menu
            </button>
            <span className="text-xs font-bold bg-indigo-950 text-indigo-400 border border-indigo-800/50 px-3 py-1.5 rounded-xl">
              {grade} • {module.name}
            </span>
            <span className="text-xs font-mono font-bold bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl">
              ⏱️ {timeLeft}s
            </span>
          </div>

          <div className="text-center my-6">
            <div className="text-4xl mb-3">{module.icon}</div>
            <h2 className="text-lg sm:text-xl font-black text-white whitespace-pre-line leading-relaxed bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
              {q.text}
            </h2>
            <button
              onClick={() => speak(q.speakText)}
              className="mt-4 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 px-4 py-2 rounded-xl text-xs font-bold border border-indigo-500/30 transition cursor-pointer inline-flex items-center gap-2"
            >
              🔊 Réécouter l'énoncé vocal
            </button>
          </div>

          {feedback && (
            <div className={`p-4 rounded-2xl mb-6 text-center font-black text-sm animate-pop ${
              feedback.success ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 animate-happy' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
            }`}>
              {feedback.text}
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {q.options.map((opt, idx) => (
              <button
                key={idx}
                disabled={isAnswering}
                onClick={() => handleAnswer(opt)}
                className="bg-slate-800 hover:bg-indigo-600 text-white font-black py-4 px-4 rounded-2xl border border-slate-700 hover:border-indigo-400 transition-all active:scale-95 text-sm sm:text-base shadow-lg cursor-pointer disabled:opacity-50"
              >
                {opt}
              </button>
            ))}
          </div>
        </div>
      );
    }

          speak(`Bienvenue ${userName} sur l'académie des mathématiques Montessori ! Choisis ton module pour commencer.`);

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl animate-pop text-center">
              <div className="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg shadow-indigo-600/30">

              </div>
              <h1 className="text-2xl font-black text-white mb-2">MathsAcademy Montessori</h1>
              <p className="text-xs text-slate-400 mb-6">Des centaines de défis visuels, vocaux et duels chronométrés !</p>

              <form onSubmit={handleLogin} className="space-y-4 text-left">
                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">Ton Prénom</label>
                  <input
                    type="text"
                    required
                    value={userName}
                    onChange={(e) => setUserName(e.target.value)}
                    placeholder="Ex: Lucas, Emma..."
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-white font-bold outline-none focus:border-indigo-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">Ton Niveau Scolaire</label>
                  <select
                    value={selectedGrade}
                    onChange={(e) => setSelectedGrade(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-white font-bold outline-none focus:border-indigo-500 cursor-pointer"
                  >
                    {[...GRADES_ROW_1, ...GRADES_ROW_2].map(g => (
                      <option key={g} value={g}>{g}</option>
                    ))}
                  </select>
                </div>
                <button
                  type="submit"
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-600/30 active:scale-95 cursor-pointer mt-2"
                >
                  COMMENCER L'AVENTURE 🚀
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-between">
          <div>
            <header className="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
              <div className="flex items-center gap-3">
                <span className="text-3xl">🎓</span>
                <div>
                  <h1 className="text-base font-black text-white">MathsAcademy Montessori</h1>
                  <p className="text-xs text-slate-400">Joueur : <span className="font-bold text-white">{userName} ({selectedGrade})</span></p>
                </div>
              </div>
              <div className="bg-slate-900 border border-amber-500/30 px-4 py-2 rounded-2xl flex items-center gap-2 shadow-md">
                <span className="text-amber-400 text-lg">⭐</span>
                <span className="text-sm font-black text-amber-400">{score} XP</span>
              </div>
            </header>

            <main className="mb-8">
              {!activeModule ? (
                <>
                  {/* Grille des niveaux sur deux lignes à l'identique de l'ancien site */}
                  <div className="flex flex-col gap-2 mb-8">
                    <div className="flex flex-wrap gap-2">
                      {GRADES_ROW_1.map(g => (
                        <button
                          key={g}
                          onClick={() => setSelectedGrade(g)}
                          className={`px-4 py-2 rounded-2xl font-extrabold text-xs transition-all cursor-pointer ${
                            selectedGrade === g ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white'
                          }`}
                        >
                          {g}
                        </button>
                      ))}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {GRADES_ROW_2.map(g => (
                        <button
                          key={g}
                          onClick={() => setSelectedGrade(g)}
                          className={`px-4 py-2 rounded-2xl font-extrabold text-xs transition-all cursor-pointer ${
                            selectedGrade === g ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white'
                          }`}
                        >
                          {g}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Grille des modules (3x2 pour la 6ème) */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
                    {CURRICULUM[selectedGrade]?.map(m => (
                      <div
                        key={m.id}
                        onClick={() => setActiveModule(m)}
                        className="bg-slate-900 border border-slate-800 hover:border-indigo-500 hover:bg-indigo-950/20 p-6 rounded-3xl transition-all flex flex-col justify-between h-40 shadow-lg cursor-pointer group"
                      >
                        <div className="flex items-start justify-between">
                          <span className="text-3xl bg-slate-950 p-2.5 rounded-2xl border border-slate-800 group-hover:scale-110 transition-transform">{m.icon}</span>
                          <span className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 bg-slate-800/80 px-2.5 py-1 rounded-xl">
                            {m.domain}
                          </span>
                        </div>
                        <div>
                          <h3 className="font-extrabold text-base text-white group-hover:text-indigo-400 transition-colors">{m.name}</h3>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              ) : (
                <ExerciseRunner
                  userName={userName}
                  grade={selectedGrade}
                  module={activeModule}
                  onBack={() => setActiveModule(null)}
                  onResult={(xp) => setScore(s => s + xp)}
                />
              )}
            </main>
          </div>

          <footer className="py-4 border-t border-slate-900 flex justify-between items-center text-xs text-slate-500">
            <button
              onClick={() => { setIsLoggedIn(false); setActiveModule(null); }}
              className="hover:text-indigo-400 transition cursor-pointer underline font-medium"
            >
              Changer d'élève
            </button>
            <span>MathsAcademy Montessori © 2026</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
