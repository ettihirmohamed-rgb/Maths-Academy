<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mathia - L'Aventure Mathématique du C1 à la Terminale</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .glass { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.12); }
    .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans select-none overflow-x-hidden">
  <div id="root"></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=6').then(reg => reg.update()).catch((err) => console.log('SW:', err));
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ALL_GRADES = [
      'PS', 'MS', 'GS',
      'CP', 'CE1', 'CE2', 'CM1', 'CM2',
      '6ème', '5ème', '4ème', '3ème',
      '2nde', '1ère', 'Terminale'
    ];

    const MATERNELLE_GRADES = ['PS', 'MS', 'GS'];

    const AVATARS = [
      { id: 'fox', name: 'Renard Astro', emoji: '🦊', price: 0 },
      { id: 'cat', name: 'Chat Ninja', emoji: '🐱', price: 50 },
      { id: 'owl', name: 'Chouette Sage', emoji: '🦉', price: 100 },
      { id: 'dragon', name: 'Petit Dragon', emoji: '🐲', price: 200 },
      { id: 'robot', name: 'Super Robot', emoji: '🤖', price: 350 },
      { id: 'unicorn', name: 'Licorne Magique', emoji: '🦄', price: 500 },
    ];

    const ALL_GAMES = [
      { id: 'vocal', name: 'Nourris le Dino (Chiffres & Comptine)', grades: ['PS', 'MS', 'GS'], icon: '🦖', color: 'from-pink-500 to-rose-500' },
      { id: 'spatial_patterns', name: 'Logique, Formes & Rythmes', grades: ['PS', 'MS', 'GS'], icon: '🧩', color: 'from-purple-500 to-indigo-500' },
      { id: 'operations', name: 'Calculs & Opérations', grades: ALL_GRADES, icon: '🧮', color: 'from-emerald-500 to-teal-500' },
      { id: 'fractions_decimals', name: 'Fractions & Décimaux', grades: ['CM1', 'CM2', '6ème', '5ème', '4ème'], icon: '🎯', color: 'from-cyan-500 to-blue-600' },
      { id: 'money_measures', name: 'Monnaie & Mesures', grades: ['CP', 'CE1', 'CE2', 'CM1', 'CM2'], icon: '💶', color: 'from-amber-500 to-yellow-500' },
      { id: 'mental_tables', name: 'Tables de Multiplication', grades: ['CE1', 'CE2', 'CM1', 'CM2', '6ème', '5ème', '4ème', '3ème'], icon: '⚡', color: 'from-indigo-500 to-purple-500' },
      { id: 'algebra_advanced', name: 'Algèbre, Équations & Fonctions', grades: ['5ème', '4ème', '3ème', '2nde', '1ère', 'Terminale'], icon: '⚖️', color: 'from-rose-500 to-red-600' }
    ];

    const TIMER_RULES = {
      'PS': null, 'MS': null, 'GS': null,
      'CP': 15, 'CE1': 15, 'CE2': 12, 'CM1': 12, 'CM2': 10,
      '6ème': 10, '5ème': 8, '4ème': 8, '3ème': 6,
      '2nde': 6, '1ère': 5, 'Terminale': 5
    };

    const COINS_LIST = [
      { value: 0.01, label: '1c', type: 'coin' },
      { value: 0.02, label: '2c', type: 'coin' },
      { value: 0.05, label: '5c', type: 'coin' },
      { value: 0.10, label: '10c', type: 'coin' },
      { value: 0.20, label: '20c', type: 'coin' },
      { value: 0.50, label: '50c', type: 'coin' },
      { value: 1.00, label: '1€', type: 'coin' },
      { value: 2.00, label: '2€', type: 'coin' },
      { value: 5.00, label: '5€', type: 'bill' },
      { value: 10.00, label: '10€', type: 'bill' },
      { value: 20.00, label: '20€', type: 'bill' },
      { value: 50.00, label: '50€', type: 'bill' }
    ];

    const speak = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'fr-FR';
        msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
      }
    };

    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'success') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + index * 0.08);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + index * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + index * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + index * 0.08);
            osc.stop(ctx.currentTime + index * 0.08 + 0.3);
          });
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    };

    const triggerVictoryFX = () => {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 45, angle: 60, spread: 55, origin: { x: 0, y: 0.8 } });
        confetti({ particleCount: 45, angle: 120, spread: 55, origin: { x: 1, y: 0.8 } });
      }
    };

    function App() {
      const [profile, setProfile] = useState(() => JSON.parse(localStorage.getItem('mathia_profile_v6') || 'null'));
      const [coins, setCoins] = useState(() => parseInt(localStorage.getItem('mathia_coins_v6') || '0'));
      const [level, setLevel] = useState(() => parseInt(localStorage.getItem('mathia_level_v6') || '1'));
      const [stats, setStats] = useState(() => JSON.parse(localStorage.getItem('mathia_stats_v6') || '{"played":0, "success":0}'));
      const [combo, setCombo] = useState(1);
      const [unlockedAvatars, setUnlockedAvatars] = useState(() => JSON.parse(localStorage.getItem('mathia_unlocked_avatars_v6') || '["fox"]'));
      const [currentAvatar, setCurrentAvatar] = useState(() => JSON.parse(localStorage.getItem('mathia_current_avatar_v6') || '{"id":"fox","name":"Renard Astro","emoji":"🦊","price":0}'));
      
      const [activeMode, setActiveMode] = useState('menu');
      const [currentGame, setCurrentGame] = useState(null);
      const [praiseMessage, setPraiseMessage] = useState(null);

      useEffect(() => {
        if (profile) localStorage.setItem('mathia_profile_v6', JSON.stringify(profile));
        localStorage.setItem('mathia_coins_v6', coins);
        localStorage.setItem('mathia_level_v6', level);
        localStorage.setItem('mathia_stats_v6', JSON.stringify(stats));
        localStorage.setItem('mathia_unlocked_avatars_v6', JSON.stringify(unlockedAvatars));
        localStorage.setItem('mathia_current_avatar_v6', JSON.stringify(currentAvatar));
      }, [profile, coins, level, stats, unlockedAvatars, currentAvatar]);

      const resetData = () => {
        localStorage.clear();
        setProfile(null);
        setCoins(0);
        setLevel(1);
        setStats({ played: 0, success: 0 });
        setCombo(1);
        setUnlockedAvatars(['fox']);
        setCurrentAvatar(AVATARS[0]);
        setActiveMode('menu');
        setCurrentGame(null);
      };

      const recordResult = (isCorrect, baseCoins = 15) => {
        setStats(prev => ({ played: prev.played + 1, success: isCorrect ? prev.success + 1 : prev.success }));
        
        if (isCorrect) {
          playSound('success');
          triggerVictoryFX();

          const compliments = [
            `Bravo ${profile.name} ! 🌟`,
            `Super ${profile.name} ! 🚀`,
            `Incroyable ${profile.name} ! 🔥`,
            `Génial ${profile.name} ! 🎉`
          ];
          const chosenPraise = compliments[Math.floor(Math.random() * compliments.length)];
          
          setPraiseMessage(chosenPraise);
          setTimeout(() => setPraiseMessage(null), 1800);

          const earnedCoins = baseCoins * combo;
          const newCoins = coins + earnedCoins;
          setCoins(newCoins);
          if (newCoins >= level * 100) setLevel(l => l + 1);

          setCombo(prev => Math.min(prev + 1, 4));
        } else {
          playSound('error');
          setCombo(1);
        }
      };

      const buyAvatar = (avatar) => {
        if (coins >= avatar.price && !unlockedAvatars.includes(avatar.id)) {
          setCoins(coins - avatar.price);
          setUnlockedAvatars([...unlockedAvatars, avatar.id]);
          setCurrentAvatar(avatar);
          playSound('success');
          triggerVictoryFX();
        }
      };

      const selectAvatar = (avatar) => {
        if (unlockedAvatars.includes(avatar.id)) {
          setCurrentAvatar(avatar);
        }
      };

      if (!profile) return <ProfileSelector onSelect={setProfile} />;
      if (activeMode === 'parents') return <ParentsSpace stats={stats} onReset={resetData} onBack={() => setActiveMode('menu')} />;

      const isMaternelle = MATERNELLE_GRADES.includes(profile.grade);

      return (
        <div className="max-w-4xl mx-auto p-4 flex flex-col min-h-screen relative">
          
          {praiseMessage && (
            <div className="fixed top-20 left-1/2 transform -translate-x-1/2 z-50 pop-in pointer-events-none">
              <div className="bg-gradient-to-r from-amber-400 via-pink-500 to-indigo-500 text-white font-black text-2xl px-8 py-4 rounded-3xl shadow-2xl border-4 border-white text-center">
                {praiseMessage}
              </div>
            </div>
          )}

          <header className="glass p-4 rounded-2xl mb-6 flex justify-between items-center shadow-2xl">
            <div className="flex items-center gap-3">
              <span className="text-3xl">{currentAvatar.emoji}</span>
              <div>
                <h2 className="font-black text-lg text-indigo-300">{profile.name}</h2>
                <div className="flex items-center gap-2">
                  <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-bold">Niv. {level}</span>
                  <button onClick={() => setProfile(null)} className="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full font-bold border border-slate-700 hover:bg-slate-700">
                    {profile.grade} ✏️
                  </button>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {combo > 1 && (
                <div className="bg-gradient-to-r from-amber-500 to-rose-500 text-white px-3 py-1 rounded-full font-black text-xs animate-bounce shadow-lg">
                  ⚡ x{combo}
                </div>
              )}
              <div className="flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 px-3 py-1.5 rounded-full">
                <span className="text-lg">🪙</span>
                <span className="font-black text-amber-400">{coins}</span>
              </div>
              <button onClick={() => setActiveMode('parents')} className="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-xs font-bold border border-slate-700">
                🔒 Parents
              </button>
            </div>
          </header>

          <div className={`grid ${isMaternelle ? 'grid-cols-2' : 'grid-cols-3'} gap-3 mb-6`}>
            <button onClick={() => { setActiveMode('menu'); setCurrentGame(null); setCombo(1); }} className={`py-3 rounded-xl font-black text-sm flex items-center justify-center gap-2 transition ${activeMode === 'menu' && !currentGame ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'glass text-slate-400'}`}>
              🎮 Exercices
            </button>
            
            {!isMaternelle && (
              <button onClick={() => { setActiveMode('duel'); setCurrentGame(null); }} className={`py-3 rounded-xl font-black text-sm flex items-center justify-center gap-2 transition ${activeMode === 'duel' ? 'bg-rose-600 text-white shadow-lg shadow-rose-500/30' : 'glass text-slate-400'}`}>
                ⚔️ Mode Duel
              </button>
            )}

            <button onClick={() => setActiveMode('shop')} className={`py-3 rounded-xl font-black text-sm flex items-center justify-center gap-2 transition ${activeMode === 'shop' ? 'bg-amber-600 text-white shadow-lg shadow-amber-500/30' : 'glass text-slate-400'}`}>
              🎁 Boutique
            </button>
          </div>

          <main className="flex-1">
            {activeMode === 'shop' ? (
              <Shop coins={coins} unlockedAvatars={unlockedAvatars} currentAvatar={currentAvatar} onBuy={buyAvatar} onSelect={selectAvatar} />
            ) : activeMode === 'duel' ? (
              <DuelMode profile={profile} onBack={() => setActiveMode('menu')} />
            ) : currentGame ? (
              <GameContainer profile={profile} game={currentGame} onBack={() => setCurrentGame(null)} onResult={recordResult} />
            ) : (
              <GameMenu profile={profile} onSelectGame={setCurrentGame} />
            )}
          </main>
        </div>
      );
    }

    function ProfileSelector({ onSelect }) {
      const [name, setName] = useState('');
      const [grade, setGrade] = useState('CP');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (name.trim()) onSelect({ name, grade });
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="glass p-8 rounded-3xl max-w-md w-full shadow-2xl text-center border-indigo-500/30">
            <div className="text-7xl mb-4 animate-bounce">🦄</div>
            <h1 className="text-4xl font-black mb-2 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent">MATHIA</h1>
            <p className="text-slate-400 mb-6 text-xs uppercase tracking-widest font-semibold">Du Cycle 1 à la Terminale</p>
            
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-left text-xs font-bold text-slate-400 mb-1 ml-1">PRÉNOM DE L'ÉLÈVE</label>
                <input type="text" placeholder="Ex: Thomas, Sarah..." value={name} onChange={(e) => setName(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg font-bold focus:outline-none focus:border-indigo-500 transition" required />
              </div>

              <div>
                <label className="block text-left text-xs font-bold text-slate-400 mb-1 ml-1">NIVEAU SCOLAIRE</label>
                <select value={grade} onChange={(e) => setGrade(e.target.value)} className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-center text-base font-bold focus:outline-none focus:border-indigo-500 transition text-indigo-300">
                  <optgroup label="🐣 Maternelle (Cycle 1)">
                    <option value="PS">Petite Section (PS)</option>
                    <option value="MS">Moyenne Section (MS)</option>
                    <option value="GS">Grande Section (GS)</option>
                  </optgroup>
                  <optgroup label="🌱 Élémentaire (Cycles 2 & 3)">
                    <option value="CP">CP</option>
                    <option value="CE1">CE1</option>
                    <option value="CE2">CE2</option>
                    <option value="CM1">CM1</option>
                    <option value="CM2">CM2</option>
                  </optgroup>
                  <optgroup label="🚀 Collège (Cycles 3 & 4)">
                    <option value="6ème">6ème</option>
                    <option value="5ème">5ème</option>
                    <option value="4ème">4ème</option>
                    <option value="3ème">3ème</option>
                  </optgroup>
                  <optgroup label="🎓 Lycée">
                    <option value="2nde">Seconde (2nde)</option>
                    <option value="1ère">Première (1ère)</option>
                    <option value="Terminale">Terminale</option>
                  </optgroup>
                </select>
              </div>

              <button type="submit" className="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-black py-4 rounded-xl shadow-xl transform active:scale-95 transition mt-2">
                DÉMARRER MON PARCOURS 🚀
              </button>
            </form>
          </div>
        </div>
      );
    }

    function GameMenu({ profile, onSelectGame }) {
      const filteredGames = ALL_GAMES.filter(g => g.grades.includes(profile.grade));

      return (
        <div className="space-y-4">
          <div className="text-center mb-4">
            <span className="text-xs text-indigo-400 font-bold uppercase tracking-wider">Programme Officiel • {profile.grade}</span>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            {filteredGames.map(g => (
              <div key={g.id} onClick={() => onSelectGame(g)} className="glass p-5 rounded-2xl cursor-pointer hover:scale-[1.02] transition shadow-xl border-slate-800 flex items-center gap-4">
                <div className={`w-16 h-16 rounded-2xl bg-gradient-to-br ${g.color} flex items-center justify-center text-3xl shadow-lg shrink-0`}>
                  {g.icon}
                </div>
                <div>
                  <h3 className="font-extrabold text-lg text-white mt-1">{g.name}</h3>
                  <span className="text-xs text-indigo-400 font-bold">Lancer cet exercice ➔</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function GameContainer({ profile, game, onBack, onResult }) {
      if (game.id === 'vocal') return <VocalGame profile={profile} onBack={onBack} onResult={onResult} />;
      if (game.id === 'spatial_patterns') return <SpatialPatternsGame profile={profile} onBack={onBack} onResult={onResult} />;
      if (game.id === 'operations') return <OperationsGame profile={profile} onBack={onBack} onResult={onResult} />;
      if (game.id === 'fractions_decimals') return <FractionsDecimalsGame profile={profile} onBack={onBack} onResult={onResult} />;
      if (game.id === 'money_measures') return <MoneyMeasuresGame profile={profile} onBack={onBack} onResult={onResult} />;
      if (game.id === 'mental_tables') return <MentalTablesGame profile={profile} onBack={onBack} onResult={onResult} />;
      if (game.id === 'algebra_advanced') return <AlgebraAdvancedGame profile={profile} onBack={onBack} onResult={onResult} />;
      return null;
    }

    /* --- MATERNELLE : CHIFFRES & COMPTINE (PS, MS, GS) --- */
    function VocalGame({ profile, onBack, onResult }) {
      const [target, setTarget] = useState(1);
      const [count, setCount] = useState(0);

      const maxNum = profile.grade === 'PS' ? 3 : profile.grade === 'MS' ? 6 : 10;

      const init = () => {
        const t = Math.floor(Math.random() * maxNum) + 1;
        setTarget(t);
        setCount(0);
        speak(`${profile.name}, voici le chiffre ${t}. Donne ${t} pomme${t > 1 ? 's' : ''} au dinosaure !`);
      };

      useEffect(() => { init(); }, [profile.grade]);

      const addApple = () => {
        const newCount = count + 1;
        setCount(newCount);
        if (newCount === target) {
          speak(`Bravo ${profile.name} ! C'est exactement le chiffre ${target} !`);
          onResult(true, 10);
          setTimeout(init, 1600);
        }
      };

      return (
        <div className="glass p-6 rounded-3xl text-center relative max-w-md mx-auto">
          <button onClick={onBack} className="absolute top-4 left-4 bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold">← Retour</button>
          <h2 className="text-xl font-extrabold mb-1 mt-4">🦖 Reconnaissance & Dénombrement</h2>
          <p className="text-xs text-indigo-300 font-bold mb-3">Comptine numérique jusqu'à {maxNum}</p>

          <button onClick={() => speak(`C'est le chiffre ${target}. Donne ${target} pommes !`)} className="bg-indigo-600/30 text-indigo-300 px-3 py-1 rounded-full text-xs font-bold mb-4">
            🔊 Réécouter
          </button>

          <div className="bg-gradient-to-b from-indigo-500/20 to-purple-500/20 border-2 border-indigo-400/40 p-4 rounded-3xl mb-4">
            <div className="text-xs text-slate-400 font-bold uppercase mb-1">Chiffre :</div>
            <div className="text-7xl font-black text-amber-400 drop-shadow-lg">{target}</div>
          </div>

          <div className="text-5xl mb-4 animate-pulse">🦖</div>

          <div className="flex justify-center flex-wrap gap-2 mb-6 min-h-[50px] bg-slate-900/60 p-3 rounded-2xl border border-slate-800">
            {Array.from({ length: count }).map((_, i) => <span key={i} className="text-3xl pop-in">🍎</span>)}
            {count === 0 && <span className="text-xs text-slate-500 self-center">Touche le bouton pour donner une pomme</span>}
          </div>

          <button onClick={addApple} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-lg font-black py-4 rounded-2xl shadow-xl active:scale-95 transition flex items-center justify-center gap-2">
            <span>Donner 1 pomme</span> 🍎
          </button>
        </div>
      );
    }

    /* --- MATERNELLE : FORMES, REPÉRAGE SPATIAL & ALGORITHMES --- */
    function SpatialPatternsGame({ profile, onBack, onResult }) {
      const [q, setQ] = useState({ title: '', question: '', options: [], ans: '' });

      const generateQuestion = () => {
        if (profile.grade === 'PS') {
          // PS : Formes simples + spatialisation de base
          const isSpatial = Math.random() > 0.5;
          if (isSpatial) {
            const positions = [
              { q: "Où est le chat ?", target: "SUR", opt: ["SUR la table", "SOUS la table"], visual: "🐱 🔝 🪑" },
              { q: "Où est le poisson ?", target: "DEDANS", opt: ["DEDANS le bocal", "DEHORS du bocal"], visual: "🐟 🫙" }
            ];
            const item = positions[Math.floor(Math.random() * positions.length)];
            setQ({ title: "Repérage Spatial", question: item.q, options: item.opt, ans: item.target === "SUR" ? "SUR la table" : "DEDANS le bocal", visual: item.visual });
          } else {
            const forms = [
              { name: "Rond", emoji: "🔴" },
              { name: "Carré", emoji: "🟩" }
            ];
            const chosen = forms[Math.floor(Math.random() * forms.length)];
            setQ({ title: "Formes Simples", question: `Trouve le ${chosen.name} !`, options: ["🔴", "🟩"], ans: chosen.emoji, visual: "🔍" });
          }
        } else if (profile.grade === 'MS') {
          // MS : Triangle, Tailles, Comparaison (plus que / moins que)
          const type = Math.floor(Math.random() * 3);
          if (type === 0) {

    /* --- CALCULS PAR NIVEAU --- */
    function OperationsGame({ profile, onBack, onResult }) {
      const maxTime = TIMER_RULES[profile.grade];
      const [q, setQ] = useState({ expr: '', ans: 0, options: [], visual1: 0, visual2: 0 });
      const [timeLeft, setTimeLeft] = useState(maxTime);

      const generateQuestion = () => {
        let expr = '';
        let ans = 0;
        let v1 = 0, v2 = 0;

        if (profile.grade === 'PS') {
          v1 = Math.floor(Math.random() * 2) + 1; v2 = 1;
          ans = v1 + v2; expr = `${v1} + ${v2}`;
        } else if (profile.grade === 'MS') {
          v1 = Math.floor(Math.random() * 3) + 1; v2 = Math.floor(Math.random() * 2) + 1;
          ans = v1 + v2; expr = `${v1} + ${v2}`;
        } else if (profile.grade === 'GS') {
          v1 = Math.floor(Math.random() * 4) + 1; v2 = Math.floor(Math.random() * 3) + 1;
          ans = v1 + v2; expr = `${v1} + ${v2}`;
        } else if (profile.grade === 'CP') {
          const n1 = Math.floor(Math.random() * 15) + 5;
          const n2 = Math.floor(Math.random() * 10) + 1;
          expr = `${n1} + ${n2}`; ans = n1 + n2;
        } else if (profile.grade === 'CE1' || profile.grade === 'CE2') {
          const isPlus = Math.random() > 0.5;
          const n1 = Math.floor(Math.random() * 40) + 10;
          const n2 = Math.floor(Math.random() * 20) + 5;
          expr = isPlus ? `${n1} + ${n2}` : `${n1 + n2} - ${n1}`;
          ans = isPlus ? n1 + n2 : n2;
        } else if (profile.grade === 'CM1' || profile.grade === 'CM2') {
          const op = Math.random() > 0.5 ? '×' : '+';
          const n1 = Math.floor(Math.random() * 25) + 5;
          const n2 = Math.floor(Math.random() * 12) + 2;
          expr = `${n1} ${op} ${n2}`; ans = op === '×' ? n1 * n2 : n1 + n2;
        } else if (['6ème', '5ème'].includes(profile.grade)) {
          const n1 = (Math.floor(Math.random() * 12) + 1) * (Math.random() > 0.5 ? 1 : -1);
          const n2 = (Math.floor(Math.random() * 8) + 1) * (Math.random() > 0.5 ? 1 : -1);
          expr = `(${n1}) × (${n2})`; ans = n1 * n2;
        } else if (['4ème', '3ème'].includes(profile.grade)) {
          const a = Math.floor(Math.random() * 8) + 2;
          expr = `${a}² - 5`; ans = (a * a) - 5;
        } else { // Lycée
          const a = Math.floor(Math.random() * 5) + 2;
          expr = `√(${a * a}) + 10`; ans = a + 10;
        }

        const opts = [ans, ans + 1, ans - 1, ans + 2].filter((v, idx, arr) => arr.indexOf(v) === idx).sort(() => Math.random() - 0.5);
        setQ({ expr, ans, options: opts, visual1: v1, visual2: v2 });
        if (maxTime) setTimeLeft(maxTime);
      };

      useEffect(() => { generateQuestion(); }, [profile.grade]);

      useEffect(() => {
        if (!maxTime) return;
        if (timeLeft <= 0) {
          onResult(false, 0);
          generateQuestion();
          return;
        }
        const timer = setTimeout(() => setTimeLeft(t => t - 1), 1000);
        return () => clearTimeout(timer);
      }, [timeLeft, maxTime]);

      const handleAnswer = (val) => {
        const correct = val === q.ans;
        onResult(correct, correct ? 15 : 0);
        generateQuestion();
      };

      const isMaternelle = MATERNELLE_GRADES.includes(profile.grade);

      return (
        <div className="glass p-6 rounded-3xl text-center relative max-w-md mx-auto">
          <button onClick={onBack} className="absolute top-4 left-4 bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold">← Retour</button>
          
          <div className="mt-4 mb-2 flex justify-between items-center px-2">
            <span className="text-xs font-extrabold text-indigo-400 uppercase">{profile.grade} • Opérations</span>
            {maxTime && <span className={`text-base font-black ${timeLeft <= 2 ? 'text-rose-500 animate-ping' : 'text-amber-400'}`}>⏱️ {timeLeft}s</span>}
          </div>

          {isMaternelle ? (
            <div className="my-6 bg-slate-900/80 p-4 rounded-3xl border border-indigo-500/30">
              <div className="flex items-center justify-center gap-2 mb-3">
                <div className="bg-indigo-950/60 p-2 rounded-2xl border border-indigo-500/30">
                  <div className="text-3xl font-black text-amber-400 mb-1">{q.visual1}</div>
                  <div className="text-xl">{Array.from({ length: q.visual1 }).map((_, i) => '🍎')}</div>
                </div>
                <span className="text-3xl font-black text-pink-400">+</span>
                <div className="bg-indigo-950/60 p-2 rounded-2xl border border-indigo-500/30">
                  <div className="text-3xl font-black text-amber-400 mb-1">{q.visual2}</div>
                  <div className="text-xl">{Array.from({ length: q.visual2 }).map((_, i) => '🍎')}</div>
                </div>
                <span className="text-3xl font-black text-emerald-400">=</span>
                <span className="text-3xl font-black text-white">?</span>
              </div>
            </div>
          ) : (
            <div className="text-5xl font-black my-8 text-white tracking-tight">{q.expr} = ?</div>
          )}

          <div className="grid grid-cols-2 gap-4">
            {q.options.map((opt, i) => (
              <button key={i} onClick={() => handleAnswer(opt)} className="glass hover:bg-indigo-600/50 py-5 rounded-2xl text-3xl font-black border-indigo-500/30 active:scale-95 transition">
                {opt}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function MentalTablesGame({ profile, onBack, onResult }) {
      const maxTime = TIMER_RULES[profile.grade];
      const [step, setStep] = useState(1);
      const [tableLevel, setTableLevel] = useState(2);
      const [q, setQ] = useState({ n1: 2, n2: 1, ans: 2 });
      const [timeLeft, setTimeLeft] = useState(maxTime);
      const [options, setOptions] = useState([]);

      const generateQuestion = (currentStep, table) => {
        const n2 = Math.floor(Math.random() * 9) + 1;
        const ans = table * n2;
        const opts = [ans, ans + table, ans - 1, ans + 2].filter((v, i, a) => v >= 0 && a.indexOf(v) === i).sort(() => Math.random() - 0.5);
        setQ({ n1: table, n2, ans });
        setOptions(opts);
        if (maxTime) setTimeLeft(maxTime);
      };

      useEffect(() => { generateQuestion(1, tableLevel); }, []);

      useEffect(() => {
        if (!maxTime) return;
        if (timeLeft <= 0) {
          onResult(false, 0);
          generateQuestion(step, tableLevel);
          return;
        }
        const timer = setTimeout(() => setTimeLeft(t => t - 1), 1000);
        return () => clearTimeout(timer);
      }, [timeLeft, maxTime]);

      const handleAnswer = (val) => {
        const correct = val === q.ans;
        onResult(correct, correct ? 15 : 0);

        if (step >= 10) {
          alert(`🎉 Bravo ! Tu as validé la table de ${tableLevel} !`);
          const nextTable = tableLevel + 1;
          setTableLevel(nextTable);
          setStep(1);
          generateQuestion(1, nextTable);
        } else {
          setStep(s => s + 1);
          generateQuestion(step + 1, tableLevel);

      return (

            ))}
          </div>

      const [currentTotal, setCurrentTotal] = useState(0);

    function ParentsSpace({ stats, onReset, onBack }) {
      const qrRef = useRef(null);
      const rate = stats.played > 0 ? Math.round((stats.success / stats.played) * 100) : 0;

      useEffect(() => {
        if (qrRef.current) {
          qrRef.current.innerHTML = "";
          new QRCode(qrRef.current, {
            text: window.location.href,
            width: 128,
            height: 128,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      }, []);

      return (
        <div className="glass p-6 rounded-3xl max-w-lg mx-auto">
          <button onClick={onBack} className="bg-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold mb-4">← Retour</button>
          <h2 className="text-2xl font-black mb-4 flex items-center gap-2">🔒 Espace Parents</h2>
          
          <div className="grid grid-cols-2 gap-4 mb-6">
            <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 text-center">
              <span className="text-xs text-slate-400 font-bold uppercase">Questions Réussies</span>
              <div className="text-3xl font-black text-white mt-1">{stats.success}</div>
            </div>
            <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 text-center">
              <span className="text-xs text-slate-400 font-bold uppercase">Taux de Réussite</span>
              <div className="text-3xl font-black text-emerald-400 mt-1">{rate}%</div>
            </div>
          </div>

          <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 text-center mb-6">
            <span className="text-xs text-indigo-300 font-bold uppercase tracking-wider block mb-3">📲 Partager l'Application</span>
            <div className="flex justify-center mb-3">
              <div ref={qrRef} className="p-2 bg-white rounded-xl shadow-lg"></div>
            </div>
            <p className="text-xs text-slate-400">Scannez ce QR Code pour ouvrir l'application sur un autre appareil.</p>
          </div>

          <div className="border-t border-slate-800 pt-4 text-center">
            <button onClick={() => { if(confirm("Attention : supprimer la progression ?")) onReset(); }} className="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-4 py-2 rounded-xl text-xs font-bold transition">
              🗑️ Réinitialiser le profil
            </button>
          </div>
        </div>
      );
    }

    function Shop({ coins, unlockedAvatars, currentAvatar, onBuy, onSelect }) {
      return (
        <div className="glass p-6 rounded-3xl text-center max-w-lg mx-auto">
          <h2 className="text-2xl font-extrabold mb-2">🛍️ Boutique d'Avatars</h2>
          <p className="text-slate-400 text-sm mb-6">Tu as <span className="text-amber-400 font-bold">{coins} 🪙</span></p>

          <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
            {AVATARS.map((avatar) => {
              const isUnlocked = unlockedAvatars.includes(avatar.id);
              const isEquipped = currentAvatar.id === avatar.id;
              const canAfford = coins >= avatar.price;

              return (
                <div key={avatar.id} className={`p-4 rounded-2xl border flex flex-col items-center transition ${isEquipped ? 'bg-indigo-600/30 border-indigo-500 shadow-lg' : isUnlocked ? 'bg-slate-800 border-slate-700' : 'bg-slate-950/50 border-slate-800 opacity-80'}`}>
                  <div className="text-5xl mb-2">{avatar.emoji}</div>
                  <div className="font-bold text-white text-xs mb-3">{avatar.name}</div>

                  {isEquipped ? (
                    <span className="text-xs bg-indigo-500/30 text-indigo-300 font-bold px-3 py-1 rounded-full">Équipé ✓</span>
                  ) : isUnlocked ? (
                    <button onClick={() => onSelect(avatar)} className="w-full text-xs bg-slate-700 hover:bg-slate-600 text-white font-bold py-1.5 rounded-xl transition">Utiliser</button>
                  ) : (
                    <button onClick={() => onBuy(avatar)} disabled={!canAfford} className={`w-full text-xs font-bold py-1.5 rounded-xl flex items-center justify-center gap-1 transition ${canAfford ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-md' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`}>
                      🔒 🪙 {avatar.price}
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
