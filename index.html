<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathsAcademy - PS à Terminale</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel pour compiler le JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse-subtle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .animate-pulse-subtle { animation: pulse-subtle 2s infinite ease-in-out; }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CURRICULUM GLOBAL (13 NIVEAUX - EXHAUSTIF) ---
    const CURRICULUM = {
      PS: [
        { id: 'ps_shapes', name: 'Formes simples (Rond, Carré)', icon: '🔴', type: 'ps_shapes' },
        { id: 'ps_sorting', name: 'Tri d\'objets (Couleurs & Formes)', icon: '🎨', type: 'ps_sorting' },
        { id: 'ps_count3', name: 'Comptine numérique jusqu\'à 3', icon: '🔢', type: 'ps_count3' },
        { id: 'ps_spatial', name: 'Repérage spatial (Sur/Sous)', icon: '📦', type: 'ps_spatial' },
        { id: 'ps_patterns', name: 'Rythmes simples (Suites)', icon: '🧩', type: 'ps_patterns' }
      ],
      MS: [
        { id: 'ms_count6', name: 'Dénombrement jusqu\'à 6', icon: '🖐️', type: 'ms_count6' },
        { id: 'ms_compare', name: 'Comparaison (Plus / Moins)', icon: '⚖️', type: 'ms_compare' },
        { id: 'ms_shapes', name: 'Formes (Triangle, Carré, Rond)', icon: '🔺', type: 'ms_shapes' },
        { id: 'ms_sizes', name: 'Tailles (Grand / Petit)', icon: '📏', type: 'ms_sizes' }
      ],
      GS: [
        { id: 'gs_num', name: 'Chiffres jusqu\'à 10', icon: '🔢', type: 'gs_num' },
        { id: 'gs_decomp', name: 'Décomposition (ex: 5 = 4 + 1)', icon: '🧩', type: 'gs_decomp' },
        { id: 'gs_shapes_solids', name: 'Solides simples (Cube)', icon: '🧊', type: 'gs_shapes_solids' }
      ],
      CP: [
        { id: 'cp_num100', name: 'Nombres jusqu\'à 100', icon: '💯', type: 'cp_num100' },
        { id: 'cp_add_sub', name: 'Additions & Soustractions', icon: '➕', type: 'cp_add_sub' },
        { id: 'cp_mental', name: 'Calcul mental', icon: '🧠', type: 'cp_mental' },
        { id: 'cp_shapes', name: 'Géométrie plane', icon: '🔷', type: 'cp_shapes' }
      ],
      CE1: [
        { id: 'ce1_num1000', name: 'Nombres jusqu\'à 1 000', icon: '🔢', type: 'ce1_num1000' },
        { id: 'ce1_tables', name: 'Tables de multiplication', icon: '✖️', type: 'ce1_tables' },
        { id: 'ce1_symmetry', name: 'Symétrie axiale', icon: '🪞', type: 'ce1_symmetry' }
      ],
      CE2: [
        { id: 'ce2_num10000', name: 'Nombres jusqu\'à 10 000', icon: '🔢', type: 'ce2_num10000' },
        { id: 'ce2_mult_posed', name: 'Multiplication posée', icon: '✖️', type: 'ce2_mult_posed' },
        { id: 'ce2_perimeters', name: 'Périmètres de figures', icon: '📏', type: 'ce2_perimeters' }
      ],
      CM1: [
        { id: 'cm1_millions', name: 'Grands nombres (Millions)', icon: '🌌', type: 'cm1_millions' },
        { id: 'cm1_fractions', name: 'Fractions simples', icon: '🍕', type: 'cm1_fractions' },
        { id: 'cm1_decimals', name: 'Nombres décimaux', icon: '🎯', type: 'cm1_decimals' },
        { id: 'cm1_lines_angles', name: 'Angles & Droites', icon: '📐', type: 'cm1_lines_angles' }
      ],
      CM2: [
        { id: 'cm2_frac_ops', name: 'Opérations sur fractions', icon: '🍰', type: 'cm2_frac_ops' },
        { id: 'cm2_proportionality', name: 'Proportionnalité', icon: '📈', type: 'cm2_proportionality' }
      ],
      '6ème': [
        { id: 'c6_fractions_dec', name: 'Fractions & Décimaux', icon: '🔢', type: 'c6_fractions_dec' },
        { id: 'c6_angles', name: 'Angles & Rapporteur', icon: '📐', type: 'c6_angles' }
      ],
      '5ème': [
        { id: 'c5_relatifs', name: 'Nombres relatifs', icon: '🌡️', type: 'c5_relatifs' },
        { id: 'c5_literal', name: 'Calcul littéral', icon: '🔤', type: 'c5_literal' }
      ],
      '4ème': [
        { id: 'c4_pythagore', name: 'Théorème de Pythagore', icon: '📐', type: 'c4_pythagore' },
        { id: 'c4_equations', name: 'Équations du 1er degré', icon: '⚖️', type: 'c4_equations' }
      ],
      '3ème': [
        { id: 'c3_thales', name: 'Théorème de Thalès', icon: '📐', type: 'c3_thales' },
        { id: 'c3_trigo', name: 'Trigonométrie', icon: '📊', type: 'c3_trigo' }
      ],
      Seconde: [
        { id: 'sec_vectors', name: 'Vecteurs & Coordonnées', icon: '➡️', type: 'sec_vectors' },
        { id: 'sec_functions', name: 'Fonctions & Variations', icon: '📉', type: 'sec_functions' }
      ],
      '1ère': [
        { id: 'p1_derivation', name: 'Dérivation & Tangente', icon: '📈', type: 'p1_derivation' },
        { id: 'p1_quadratic', name: 'Second degré (Discriminant Δ)', icon: '🧮', type: 'p1_quadratic' }
      ],
      Terminale: [
        { id: 'term_limits', name: 'Limites de suites & fonctions', icon: '♾️', type: 'term_limits' },
        { id: 'term_exp_ln', name: 'Exponentielle & Logarithme', icon: '📈', type: 'term_exp_ln' }
      ]
    };

    const IS_MATERNELLE = (grade) => ['PS', 'MS', 'GS'].includes(grade);

    // --- COMPOSANT DE SYNTHÈSE VOCALE ---
    const speakText = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fr-FR';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    };

    // --- RENDERER DE SCHÉMAS GÉOMÉTRIQUES & VISUELS SVG ---
    function DynamicVisual({ type }) {
      if (type === 'angle_right') {
        return (
          <svg className="w-36 h-36 mx-auto my-2" viewBox="0 0 100 100">
            <polyline points="20,10 20,80 90,80" fill="none" stroke="#818cf8" strokeWidth="6" strokeLinecap="round" />
            <rect x="20" y="66" width="14" height="14" fill="none" stroke="#f43f5e" strokeWidth="3" />
          </svg>
        );
      }
      if (type === 'angle_acute') {
        return (
          <svg className="w-36 h-36 mx-auto my-2" viewBox="0 0 100 100">
            <polyline points="30,20 20,80 80,70" fill="none" stroke="#818cf8" strokeWidth="6" strokeLinecap="round" />
            <path d="M 30,78 A 15,15 0 0,0 38,65" fill="none" stroke="#38bdf8" strokeWidth="3" />
          </svg>
        );
      }
      if (type === 'symmetry') {
        return (
          <svg className="w-40 h-32 mx-auto my-2" viewBox="0 0 120 80">
            <line x1="60" y1="5" x2="60" y2="75" stroke="#f43f5e" strokeWidth="3" strokeDasharray="4" />
            <polygon points="20,20 45,40 20,60" fill="#818cf8" opacity="0.8" />
            <polygon points="100,20 75,40 100,60" fill="#38bdf8" opacity="0.8" />
          </svg>
        );
      }
      if (type === 'fraction_34') {
        return (
          <svg className="w-32 h-32 mx-auto my-2" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="#1e293b" stroke="#818cf8" strokeWidth="4" />
            <path d="M 50,50 L 50,10 A 40,40 0 1,1 10,50 Z" fill="#6366f1" />
            <line x1="50" y1="10" x2="50" y2="90" stroke="#0f172a" strokeWidth="3" />
            <line x1="10" y1="50" x2="90" y2="50" stroke="#0f172a" strokeWidth="3" />
          </svg>
        );
      }
      if (type === 'pythagore') {
        return (
          <svg className="w-40 h-32 mx-auto my-2" viewBox="0 0 120 90">
            <polygon points="20,80 100,80 20,20" fill="none" stroke="#38bdf8" strokeWidth="4" />
            <text x="15" y="55" fill="#a5b4fc" fontSize="12" fontWeight="bold">a</text>
            <text x="60" y="88" fill="#a5b4fc" fontSize="12" fontWeight="bold">b</text>
            <text x="65" y="45" fill="#f43f5e" fontSize="12" fontWeight="bold">c</text>
          </svg>
        );
      }
      return null;
    }

    // --- MOTEUR D'EXERCICES AVEC CHRONO & GAMIFICATION ---
    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const [q, setQ] = useState({ text: '', ans: '', options: [], visual: null, audioText: '' });
      const [timer, setTimer] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const isMaternelle = IS_MATERNELLE(grade);

      // Gestion du Chronomètre (Exclus si Maternelle)
      useEffect(() => {
        if (isMaternelle) return;
        setTimer(0);
        const interval = setInterval(() => setTimer(t => t + 1), 1000);
        return () => clearInterval(interval);
      }, [q, isMaternelle]);

      const generateQuestion = () => {
        setFeedback(null);
        let text = '', ans = '', opts = [], visual = null, audioText = '';

        if (module.type === 'ps_shapes') {
          text = "Touche la forme parfaitement RONDE !";
          ans = "🔴 Rond";
          opts = ["🔴 Rond", "🟦 Carré", "⭐ Étoile"];
          audioText = "Touche la forme parfaitement ronde !";
        } else if (module.type === 'ps_patterns') {
          text = "Complète la suite : 🔴 🔵 🔴 🔵 ... ?";
          ans = "🔴";
          opts = ["🔴", "🔵", "🟡"];
          audioText = "Complète la suite de couleurs : rouge, bleu, rouge, bleu... que vient-il après ?";
        } else if (module.type === 'ms_count6') {
          text = "Combien d'éléments vois-tu ? 🍎 🍎 🍎 🍎";
          ans = "4";
          opts = ["4", "3", "5", "6"];
          audioText = "Combien de pommes vois-tu à l'écran ?";
        } else if (module.type === 'ce1_tables') {
          const a = Math.floor(Math.random() * 8) + 2;
          const b = Math.floor(Math.random() * 8) + 2;
          text = `Combien font ${a} × ${b} ?`;
          ans = `${a * b}`;
          opts = [`${a * b}`, `${a * b + 2}`, `${a * b - 3}`, `${a * (b + 1)}`];
        } else if (module.type === 'cm1_fractions') {
          text = "Quelle fraction est représentée par la partie colorée ?";
          ans = "3/4";
          opts = ["3/4", "1/4", "1/2", "2/3"];
          visual = 'fraction_34';
        } else if (module.type === 'c6_angles' || module.type === 'cm1_lines_angles') {
          text = "Quel type d'angle est illustré ci-dessous ?";
          ans = "Angle droit (90°)";
          opts = ["Angle droit (90°)", "Angle aigu", "Angle obtus"];
          visual = 'angle_right';
        } else if (module.type === 'ce1_symmetry') {
          text = "La figure possède-t-elle un axe de symétrie valide ?";
          ans = "Oui";
          opts = ["Oui", "Non"];
          visual = 'symmetry';
        } else if (module.type === 'c4_pythagore') {
          text = "D'après la figure, quelle relation est exacte ?";
          ans = "a² + b² = c²";
          opts = ["a² + b² = c²", "a + b = c", "c² + a² = b²"];
          visual = 'pythagore';
        } else {
          const a = Math.floor(Math.random() * 12) + 2;
          const b = Math.floor(Math.random() * 12) + 2;
          text = `Calculer : ${a} + ${b} = ... ?`;
          ans = `${a + b}`;
          opts = [`${a + b}`, `${a + b + 1}`, `${a + b - 2}`, `${a + b + 3}`];
        }

        opts = Array.from(new Set(opts)).sort(() => Math.random() - 0.5);
        const newQ = { text, ans, options: opts, visual, audioText: audioText || text };
        setQ(newQ);

        if (isMaternelle) {
          speakText(newQ.audioText);
        }
      };

      useEffect(() => { generateQuestion(); }, [module.type]);

      const handleAns = (val) => {
        if (val === q.ans) {
          const bonusXP = isMaternelle ? 20 : Math.max(5, 30 - timer);
          setFeedback({ success: true, msg: `Bravo ${userName} ! Excellent ! (+${bonusXP} XP)` });
          if (isMaternelle) speakText(`Bravo ${userName} !`);
          setTimeout(() => {
            onResult(true, bonusXP);
            generateQuestion();
          }, 1500);
        } else {
          setFeedback({ success: false, msg: `Oups ${userName}, essaie encore !` });
          if (isMaternelle) speakText(`Essaie encore ${userName}`);
        }
      };

      return (
        <div className="bg-slate-900/90 backdrop-blur-xl p-6 sm:p-8 rounded-3xl text-center max-w-lg mx-auto relative border border-slate-800 shadow-2xl animate-pop">
          <div className="flex justify-between items-center mb-6">
            <button onClick={onBack} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-black transition-all border border-slate-700">
              ← RETOUR
            </button>
            <span className="text-xs font-black text-indigo-400 uppercase tracking-widest bg-indigo-950/60 px-3 py-1.5 rounded-xl border border-indigo-800/40">
              {grade} • {module.name}
            </span>
            {!isMaternelle && (
              <span className="text-xs font-mono font-bold bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl border border-amber-500/20">
                ⏱️ {timer}s
              </span>
            )}
          </div>

          {/* Icone Vocale pour Maternelles */}
          {isMaternelle && (
            <button 
              onClick={() => speakText(q.audioText)}
              className="mb-4 bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-full shadow-lg shadow-indigo-600/30 transition-transform active:scale-95"
              title="Répéter la consigne"
            >
              🔊 Écouter la consigne
            </button>
          )}

          {/* Schéma / Dessin SVG */}
          {q.visual && <DynamicVisual type={q.visual} />}

          <div className="text-xl sm:text-2xl font-black my-6 text-white leading-relaxed tracking-tight">
            {q.text}
          </div>

          {/* Feedback interactif */}
          {feedback && (
            <div className={`p-4 rounded-2xl mb-6 font-black text-sm animate-bounce ${feedback.success ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'}`}>
              {feedback.msg}
            </div>
          )}

          {/* Boutons de réponses dynamiques */}
          <div className="grid grid-cols-2 gap-3 sm:gap-4">
            {q.options.map((opt, i) => (
              <button
                key={i}
                onClick={() => handleAns(opt)}
                className="bg-slate-800/80 hover:bg-indigo-600 text-white py-4 px-2 rounded-2xl text-base font-black border border-slate-700/60 hover:border-indigo-400 transition-all active:scale-95 shadow-lg flex items-center justify-center min-h-[64px]"
              >
                {opt}
              </button>
            ))}
          </div>
        </div>
      );
    }

    // --- APPLICATION PRINCIPALE & ONBOARDING ---
    function App() {
      const [userName, setUserName] = useState('');
      const [selectedGrade, setSelectedGrade] = useState('CP');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeModule, setActiveModule] = useState(null);
      const [score, setScore] = useState(0);

      const handleStart = (e) => {
        e.preventDefault();
        if (userName.trim()) {
          setIsLoggedIn(true);
        }
      };

      const handleResult = (isCorrect, points) => {
        if (isCorrect) setScore(prev => prev + points);
      };

      // ÉCRAN 1 : ONBOARDING / PROFIL (Prénom + Niveau)
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div className="bg-slate-900/90 backdrop-blur-xl p-8 rounded-3xl max-w-md w-full border border-slate-800 shadow-2xl text-center animate-pop">
              <div className="w-20 h-20 bg-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-xl shadow-indigo-600/30 mb-6">
                🎓
              </div>
              <h1 className="text-3xl font-black bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent mb-2">
                MathsAcademy
              </h1>
              <p className="text-slate-400 text-xs font-semibold mb-8 uppercase tracking-wider">
                Bienvenue ! Crée ton profil
              </p>

              <form onSubmit={handleStart} className="space-y-6">
                <div className="text-left">
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase tracking-wider mb-2">
                    Ton Prénom
                  </label>
                  <input
                    type="text"
                    required
                    value={userName}
                    onChange={(e) => setUserName(e.target.value)}
                    placeholder="Ex: Lucas, Emma..."
                    className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-2xl px-4 py-3.5 text-white font-bold outline-none transition-all placeholder:text-slate-600"
                  />
                </div>

                <div className="text-left">
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase tracking-wider mb-2">
                    Ton Niveau Scolaire
                  </label>
                  <select
                    value={selectedGrade}
                    onChange={(e) => setSelectedGrade(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-2xl px-4 py-3.5 text-white font-bold outline-none transition-all"
                  >
                    {Object.keys(CURRICULUM).map(grade => (
                      <option key={grade} value={grade}>{grade}</option>
                    ))}
                  </select>
                </div>

                <button
                  type="submit"
                  className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-600/30 transition-all active:scale-95 text-base tracking-wide"
                >
                  C'EST PARTI ! 🚀
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ÉCRAN 2 : TABLEAU DE BORD DU JOUEUR
      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-4 font-sans">
          <header className="max-w-4xl mx-auto flex justify-between items-center py-6 border-b border-slate-800 mb-8">
            <div className="flex items-center gap-3">
              <div className="bg-indigo-600 p-3 rounded-2xl text-2xl shadow-lg shadow-indigo-500/20">🎓</div>
              <div>
                <h1 className="text-lg font-black text-white">MathsAcademy</h1>
                <p className="text-xs text-indigo-400 font-bold">Joueur : {userName} ({selectedGrade})</p>
              </div>
            </div>
            <div className="bg-slate-900 px-4 py-2 rounded-2xl border border-indigo-500/30 flex items-center gap-2 shadow-inner">
              <span className="text-xs text-slate-400 font-extrabold">XP</span>
              <span className="text-lg font-black text-amber-400">{score}</span>
            </div>
          </header>

          <main className="max-w-4xl mx-auto">
            {!activeModule ? (
              <>
                {/* Sélecteur de niveaux */}
                <nav className="flex gap-2 overflow-x-auto pb-4 mb-8 scrollbar-none">
                  {Object.keys(CURRICULUM).map(grade => (
                    <button
                      key={grade}
                      onClick={() => setSelectedGrade(grade)}
                      className={`px-5 py-2.5 rounded-2xl font-black text-xs whitespace-nowrap transition-all ${
                        selectedGrade === grade
                          ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105'
                          : 'bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800'
                      }`}
                    >
                      {grade}
                    </button>
                  ))}
                </nav>

                {/* Grille de modules ludiques */}
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {CURRICULUM[selectedGrade]?.map(module => (
                    <button
                      key={module.id}
                      onClick={() => setActiveModule(module)}
                      className="bg-slate-900/60 p-5 rounded-3xl text-left border border-slate-800/80 hover:border-indigo-500/60 hover:bg-indigo-950/20 transition-all group flex flex-col justify-between h-36 shadow-lg active:scale-98"
                    >
                      <span className="text-3xl p-2.5 bg-slate-950 rounded-2xl w-fit group-hover:scale-110 transition-transform shadow-inner border border-slate-800">
                        {module.icon}
                      </span>
                      <span className="font-extrabold text-sm text-slate-200 group-hover:text-indigo-300 transition-colors">
                        {module.name}
                      </span>
                    </button>
                  ))}
                </div>
              </>
            ) : (
              <ExerciseRunner
                userName={userName}
                grade={selectedGrade}
                module={activeModule}
                onBack={() => setActiveModule(null)}
                onResult={handleResult}
              />
            )}
          </main>
        </div>
      );
    }

    // Initialisation
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
