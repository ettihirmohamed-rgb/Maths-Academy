'3ème':[['c3_arithmetique','Nombres premiers & PGCD','🔢','Nombres'],['c3_equations','Équations & inéquations','⚖️','Algèbre'],['c3_fonctions','Fonctions linéaires & affines','📈','Fonctions'],['c3_thales','Théorème de Thalès','📐','Géométrie'],['c3_trigo','Trigonométrie','△','Géométrie'],['c3_proba','Probabilités à 2 épreuves','🎲','Probabilités']],
Seconde:[['sec_ensembles','Ensembles & intervalles','ℝ','Algèbre'],['sec_fonctions','Fonctions de référence','📉','Fonctions'],['sec_variations','Sens de variation','📈','Fonctions'],['sec_vecteurs','Vecteurs & Chasles','➡️','Géométrie'],['sec_proba','Probabilités conditionnelles','🌳','Probabilités'],['sec_python','Python de base','🐍','Algorithmique']],
'1ère':[['p1_second','Équations du 2nd degré','ax²','Algèbre'],['p1_derivee','Dérivation','📈','Analyse'],['p1_exp','Fonction exponentielle','eˣ','Analyse'],['p1_suites','Suites arith. & géom.','🔢','Suites'],['p1_scalaire','Produit scalaire','⋅','Géométrie'],['p1_proba','Variables aléatoires','🎲','Probabilités']],
Terminale:[['term_limites','Limites','∞','Analyse'],['term_continuite','Continuité & TVI','📈','Analyse'],['term_log','Logarithme népérien','ln','Analyse'],['term_integrales','Intégrales','∫','Analyse'],['term_espace','Géométrie dans l’espace','🧊','Géométrie'],['term_binomiale','Loi binomiale','🎲','Probabilités']]};
const AL={ps_formes:'ps_shapes',ms_comparer:'ms_compare',gs_chaine:'gs_num',cp_add:()=>{let q;do q=G.cp_add_sub();while(!/\+/.test(q.t));return q},cp_soustraction:()=>{let q;do q=G.cp_add_sub();while(!/−/.test(q.t)||/\+/.test(q.t));return q},cm1_decimaux:'c6_decimals',cm2_fractions:'cm2_frac_ops',c6_symetrie:'cm2_symetrie',c5_parallelo:'c5_para',c5_moyenne:'c5_stats',c4_relatifs:'c4_relatifs2',c4_litteral:'c4_dev',c4_transfo:'c4_trans',c3_arithmetique:'c3_premiers',c3_equations:'c3_equ',c3_proba:'c3_proba2',sec_ensembles:'sec_ens',sec_fonctions:'sec_ref',sec_variations:'sec_var',sec_vecteurs:'sec_vect',sec_proba:'sec_pcond',p1_derivee:'p1_deriv',term_limites:'term_lim'};
Object.entries(AL).forEach(([k,v])=>G[k]=typeof v=='string'?()=>G[v]():v);
const DU=['ce1_tables','ce2_tables','ce2_mult','cm1_operations'],BO='bg-slate-800 hover:bg-indigo-600 text-white font-black py-4 px-3 rounded-2xl border border-slate-700 active:scale-95 shadow-lg',BM='bg-gradient-to-b from-indigo-500 to-indigo-700 text-white font-black text-3xl py-6 px-3 rounded-3xl border-4 border-indigo-300/30 shadow-xl active:scale-90 min-h-[80px] flex items-center justify-center',BP='bg-indigo-600 hover:bg-indigo-500 font-black py-2 rounded-xl text-sm';

/* ---------- Interface ---------- */
let S={u:'',g:'PS',mn:'',xp:0,m:null,q:null,t:25,tm:0,done:0,D:null};
const app=$('app'),H=s=>app.innerHTML=s,mat=()=>['PS','MS','GS'].includes(S.g);
const login=()=>H(`<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-slate-900/90 p-8 rounded-3xl max-w-md w-full border-2 border-indigo-500/30 shadow-2xl text-center pop"><div class="text-5xl mb-3">🎓✨</div><h1 class="text-3xl font-black bg-gradient-to-r from-pink-400 to-indigo-400 bg-clip-text text-transparent">MathsAcademy Montessori</h1><p class="text-slate-400 text-sm mt-2 mb-6">Programme officiel • De la maternelle à la Terminale</p><input id="nm" class="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 text-lg mb-4 focus:outline-none focus:border-pink-500" placeholder="Prénom de l’élève"><select id="gr" class="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl px-4 py-3 mb-5">${[['Maternelle',['PS','MS','GS']],['Élémentaire',['CP','CE1','CE2','CM1','CM2']],['Collège',['6ème','5ème','4ème','3ème']],['Lycée',['Seconde','1ère','Terminale']]].map(([l,g])=>`<optgroup label="${l}">${g.map(x=>`<option ${x==S.g?'selected':''}>${x}</option>`).join('')}</optgroup>`).join('')}</select><button onclick="go()" class="w-full bg-gradient-to-r from-pink-500 to-indigo-500 font-black py-4 rounded-2xl text-lg active:scale-95">C’est parti ! 🚀</button></div></div>`);
const go=()=>{const n=$('nm').value.trim();if(!n)return $('nm').focus();S.u=n;S.g=$('gr').value;home();say(`Bonjour ${n} !`)};
const setG=g=>{S.g=g;home()};
const home=()=>{clearInterval(S.tm);S.m=null;S.D=null;H(`<div class="max-w-4xl mx-auto p-4"><header class="flex justify-between items-center py-3 mb-4"><div><h1 class="text-2xl font-black">🎓 MathsAcademy Montessori</h1><p class="text-sm text-indigo-300">Joueur : <b class="text-white">${S.u}</b> (${S.g})</p></div><div class="flex gap-2 items-center"><button class="mt bg-slate-800 px-3 py-2 rounded-xl" onclick="tg()">${mute?'🔇':'🔊'}</button><div class="bg-amber-400/20 text-amber-300 px-4 py-2 rounded-full font-black border border-amber-400/40">⭐ ${S.xp} XP</div></div></header><div class="flex flex-wrap gap-2 mb-6">${Object.keys(CUR).map(g=>`<button onclick="setG('${g}')" class="px-4 py-2 rounded-full text-sm font-bold ${S.g==g?'bg-indigo-600 shadow-lg':'bg-slate-800 text-slate-400 hover:bg-slate-700'}">${g}</button>`).join('')}</div><div class="grid gap-4 grid-cols-1 sm:grid-cols-2 ${mat()?'':'lg:grid-cols-3'}">${CUR[S.g].map(([id,n,ic,dm])=>`<div onclick="play('${id}')" class="cursor-pointer p-5 rounded-2xl border-2 active:scale-95 transition ${mat()?'bg-gradient-to-br from-indigo-600/40 to-pink-600/30 border-pink-400/40 hover:border-pink-300':'bg-slate-900/80 border-slate-700 hover:border-indigo-500'}"><div class="text-3xl mb-3">${ic}</div><div class="font-black leading-snug">${n}</div><div class="text-xs text-indigo-300 mt-2">${dm}</div>${DU.includes(id)?`<button onclick="event.stopPropagation();duel('${id}')" class="mt-3 w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-2 rounded-xl text-sm">⚔️ Duel à 2</button>`:''}</div>`).join('')}</div><button onclick="S.xp=0;login()" class="mt-10 text-sm text-slate-500 hover:text-slate-300 underline">Changer d’élève</button></div>`)};
const play=id=>{S.m=id;S.D=null;S.mn=(CUR[S.g].find(x=>x[0]==id)||[])[1];next()};
const next=()=>{if(!S.m||S.D)return;S.done=0;S.q=G[S.m]();S.t=25;clearInterval(S.tm);draw();say(S.q.t);if(!mat())S.tm=setInterval(()=>{if(--S.t<=0){clearInterval(S.tm);S.done=1;fb(0,`Temps écoulé ! La réponse était ${S.q.a}.`);setTimeout(next,2800)}else{const e=$('tm');if(e)e.textContent='⏱️ '+S.t+'s'}},1000)};
const draw=()=>{const q=S.q;H(`<div class="max-w-lg mx-auto p-4"><div class="bg-slate-900/90 p-5 rounded-3xl text-center border border-slate-800 pop"><div class="flex justify-between items-center gap-2 mb-3"><button onclick="home()" class="bg-slate-800 px-3 py-2 rounded-xl text-xs font-black">← RETOUR</button><span class="text-xs font-black text-indigo-400 bg-indigo-950 px-3 py-1.5 rounded-xl border border-indigo-800/40 truncate max-w-[150px]">${S.g} • ${S.mn}</span><span class="flex gap-2"><button onclick="say(S.q.t)" class="bg-slate-800 px-3 py-2 rounded-xl">🔁${mat()?' Écouter':''}</button><button class="mt bg-slate-800 px-3 py-2 rounded-xl" onclick="tg()">${mute?'🔇':'🔊'}</button>${mat()?'':`<span id="tm" class="text-xs font-mono font-bold bg-slate-800 text-amber-400 px-3 py-2 rounded-xl">⏱️ ${S.t}s</span>`}</span></div><div class="my-3">${q.v}</div><h2 class="text-lg sm:text-xl font-black my-4">${q.t}</h2><div id="fb"></div><div id="op" class="grid grid-cols-2 ${mat()?'gap-4':'gap-3'}">${q.o.map((o,i)=>`<button onclick="ans(${i})" class="${mat()?BM:BO}">${o}</button>`).join('')}</div></div></div>`)};
const fb=(ok,m)=>{$('fb').innerHTML=`<div class="p-3 rounded-xl mb-3 font-black text-sm ${ok?'bg-emerald-500/20 text-emerald-300':'bg-rose-500/20 text-rose-300'}">${m}</div>`;say(m)};
const ans=i=>{if(S.done)return;const b=$('op').children[i];if(S.q.o[i]==S.q.a){S.done=1;clearInterval(S.tm);snd(1);cf();const xp=mat()?15:Math.max(5,S.t);S.xp+=xp;fb(1,`Bravo ${S.u} ! (+${xp} XP)`);setTimeout(next,1400)}else{snd(0);b.disabled=true;b.classList.add('opacity-30');fb(0,`Oups ${S.u}, essaie encore !`)}};

/* ---------- Duel (multiplication) : 2 joueurs face à face, premier à 10 ---------- */
const duel=id=>{const p2=prompt('Prénom du joueur 2 ?','Joueur 2')||'Joueur 2';clearInterval(S.tm);S.m=id;S.D={n:[S.u,p2],s:[0,0],l:[0,0],d:0,w:-1};dn()};
const dn=()=>{const D=S.D;if(!D)return;D.l=[0,0];D.d=0;S.q=G[S.m]();dr();say(S.q.t)};
const rp=()=>{S.D.s=[0,0];S.D.w=-1;dn()};
const dp=p=>{const D=S.D,q=S.q;return `<div class="${p?'rot':''} p-3 flex-1 flex flex-col justify-center text-center"><div class="font-black text-sm text-amber-400">${D.n[p]} : ${D.s[p]}/10</div><div>${q.v}</div><h2 class="font-black my-2">${q.t}</h2><div class="grid grid-cols-2 gap-2">${q.o.map((o,i)=>`<button ${D.l[p]||D.d?'disabled':''} onclick="da(${p},${i})" class="${BO} ${D.l[p]?'opacity-30':''}">${o}</button>`).join('')}</div></div>`};
const dr=()=>{const D=S.D;if(D.w>=0)return H(`<div class="min-h-screen flex items-center justify-center p-4 text-center"><div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 pop"><div class="text-6xl mb-3">🏆</div><h2 class="text-2xl font-black mb-5">${D.n[D.w]} gagne ${D.s[D.w]} à ${D.s[1-D.w]} !</h2><div class="flex gap-3 justify-center"><button onclick="rp()" class="${BP} px-5">Rejouer</button><button onclick="home()" class="bg-slate-800 font-black px-5 rounded-xl text-sm">Menu</button></div></div></div>`);H(`<div class="min-h-screen flex flex-col">${dp(1)}<div class="flex justify-between items-center bg-slate-900 px-3 py-2"><button onclick="home()" class="bg-slate-800 px-3 py-1 rounded-xl text-xs font-black">← MENU</button><b class="text-xs text-amber-400">⚔️ Premier à 10 points</b><span><button class="mt px-2" onclick="tg()">${mute?'🔇':'🔊'}</button><button class="px-2" onclick="say(S.q.t)">🔁</button></span></div>${dp(0)}</div>`)};
const da=(p,i)=>{const D=S.D,q=S.q;if(D.d||D.l[p])return;if(q.o[i]==q.a){D.d=1;D.s[p]++;snd(1);cf();if(D.s[p]>=10){D.w=p;dr();say(`${D.n[p]} gagne la partie !`);return}dr();say(`Point pour ${D.n[p]} !`);setTimeout(dn,1200)}else{D.l[p]=1;snd(0);if(D.l[0]&&D.l[1]){D.d=1;setTimeout(dn,1000)}dr()}};
login();
</script></body></html>
