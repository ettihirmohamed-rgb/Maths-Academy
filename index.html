    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounceHappy {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-happy { animation: bounceHappy 0.45s ease; }
    .confetti-piece {
      position: absolute;
      font-size: 1.6rem;
      pointer-events: none;
      animation: confetti 1.2s ease-out forwards;

    const THEOREMS_EXPLANATIONS = {

        title: "Tables de multiplication",
        why: "La multiplication est une addition réitérée pour calculer plus vite.",
        rule: "a × b = b × a (Propriété commutative)."
      },

      },

        why: "Mesurer le contour ou la surface d'un cercle.",

    const speak = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[^a-zA-ZÀ-ÿ0-9\s]/g, ' ');
        const u = new SpeechSynthesisUtterance(cleanText);
        u.lang = 'fr-FR';
        u.rate = 0.95;
        const voices = window.speechSynthesis.getVoices();
        const naturalVoice = voices.find(v => v.lang.includes('fr') && v.name.includes('Natural'));
        const frenchVoice = naturalVoice || voices.find(v => v.lang.includes('fr'));
        if (frenchVoice) u.voice = frenchVoice;
        window.speechSynthesis.speak(u);
      }
    };

    // Générateur de questions 100% strict et propre par module
    function generateQuestion(moduleType, grade) {
      const r = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      let text = '', ans = '', opts = [];

      if (moduleType === 'mult_tables') {
        let a, b;
        if (['PS', 'MS', 'GS', 'CP'].includes(grade)) { a = r(1, 5); b = r(1, 5); }
        else if (['CE1', 'CE2'].includes(grade)) { a = r(2, 10); b = r(2, 10); }
        else if (['CM1', 'CM2', '6ème'].includes(grade)) { a = r(3, 12); b = r(4, 12); }
        else { a = r(-12, 12); b = r(2, 12); }
        ans = a * b;
        text = `Combien font ${a} multiplié par ${b} ?`;
      } 
      else if (moduleType === 'c6_fractions') {
        const num = r(1, 7), den = r(num + 1, 12);
        const templates = [
          { q: `Quelle fraction correspond à ${num} parts coloriées sur un total de ${den} parts ?`, a: `${num}/${den}` },
          { q: `Écris la fraction représentant ${num} divisé par ${den}.`, a: `${num}/${den}` },
          { q: `Si un gâteau est coupé en ${den} parts égales et que l'on en prend ${num}, quelle fraction reste-t-il ?`, a: `${den - num}/${den}` }
        ];
        const chosen = templates[r(0, templates.length - 1)];
        text = chosen.q; ans = chosen.a;
        opts = [ans, `${den}/${num}`, `${num+1}/${den}`, `${num}/${den+1}`];
      }
      else if (moduleType === 'c6_priorites') {
        const a = r(2, 9), b = r(2, 5), c = r(2, 10);
        const cases = [
          { q: `Calculer en respectant les priorités : ${a} + ${b} × ${c} = ?`, a: `${a + b * c}` },
          { q: `Calculer : (${a} + ${b}) × ${c} = ?`, a: `${(a + b) * c}` },
          { q: `Calculer : ${a * c} - ${b} × ${c} = ?`, a: `${(a * c) - (b * c)}` }
        ];
        const chosen = cases[r(0, cases.length - 1)];
        text = chosen.q; ans = chosen.a;
      }
      else if (moduleType === 'c6_perimetre') {
        const d = r(2, 20) * 2;
        text = `Quel est le rayon d'un disque si son diamètre total est de ${d} cm ?`;
        ans = `${d / 2} cm`;
        opts = [`${d / 2} cm`, `${d} cm`, `${d * 2} cm`, `${d / 4} cm`];
      }
      else if (moduleType === 'c6_volume') {
        const L = r(2, 6), l = r(2, 5), h = r(2, 5);
        text = `Quel est le volume d'un pavé droit de longueur ${L} cm, de largeur ${l} cm et de hauteur ${h} cm ?`;
        ans = `${L * l * h}`;
        opts = [ans, `${L + l + h}`, `${(L * l + l * h + L * h) * 2}`, `${L * l * h + 4}`];
      }
      else if (moduleType === 'c6_symetrie') {
        const questionsSym = [
          { q: "Que conserve une symétrie axiale par rapport aux figures ?", a: "Les longueurs, les aires et les angles" },
          { q: "Dans une symétrie axiale, le symétrique d'un segment de 5 cm mesure...", a: "5 cm" },
          { q: "L'axe de symétrie d'un segment est sa droite...", a: "Médiatrice" }
        ];
        const chosen = questionsSym[r(0, questionsSym.length - 1)];
        text = chosen.q; ans = chosen.a;
        opts = [ans, "La moitié", "Le double", "Cela dépend de l'angle"];
      }
      else if (moduleType === 'c6_donnees') {
        const val1 = r(10, 50), val2 = r(15, 60);
        text = `Dans un tableau, si le mois de janvier compte ${val1} inscrits et février en compte ${val2}, quel est le total sur les deux mois ?`;
        ans = `${val1 + val2}`;
      }
      else {
        const a = r(5, 50), b = r(2, 20);
        ans = a + b;
        text = `Combien font ${a} + ${b} ?`;
      }

      if (opts.length === 0) {
        const numAns = parseInt(ans) || 15;
        opts = [ans, `${numAns + r(1, 5)}`, `${numAns - r(1, 4)}`, `${numAns + 10}`];
      }

      opts = Array.from(new Set(opts.map(String))).slice(0, 4);
      while (opts.length < 4) opts.push(String(r(10, 99)));
      opts = opts.sort(() => Math.random() - 0.5);

      return { text, ans: String(ans), options: opts, speakText: text };
    }

    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const [isDuel, setIsDuel] = useState(false);
      const [q, setQ] = useState({ text: '', ans: '', options: [], speakText: '' });
      const [feedback, setFeedback] = useState(null);
      const [isAnswering, setIsAnswering] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [timeLeft, setTimeLeft] = useState(30);
      const [showTheoremModal, setShowTheoremModal] = useState(false);

      const [duelScores, setDuelScores] = useState({ p1: 0, p2: 0 });
      const [activePlayerTurn, setActivePlayerTurn] = useState(1);
      const [duelWinner, setDuelWinner] = useState(null);

      const timerRef = useRef(null);

      const loadNewQuestion = useCallback(() => {
        setFeedback(null);
        setIsAnswering(false);
        const newQ = generateQuestion(module.type, grade);
        setQ(newQ);
        setTimeLeft(30);
        if (!isDuel) speak(newQ.speakText);
      }, [module.type, grade, isDuel]);

      useEffect(() => { loadNewQuestion(); }, [loadNewQuestion, isDuel]);

      useEffect(() => {
        if (feedback || showTheoremModal || duelWinner) return;
        timerRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              if (isDuel) handleDuelAnswer(null);
              else handleAnswer('');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timerRef.current);
      }, [q, feedback, showTheoremModal, duelWinner, isDuel]);

      const handleAnswer = (choice) => {
        if (isAnswering) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);
        const isCorrect = String(choice).trim() === String(q.ans).trim();

        if (isCorrect) {
          setShowConfetti(true);
          setTimeout(() => setShowConfetti(false), 1200);
          setFeedback({ success: true, text: "Bravo ! C'est exact 🎉 (+10 XP)" });
          speak("Bravo ! C'est exact !");
          setTimeout(() => { onResult(10); loadNewQuestion(); }, 1300);
        } else {
          setFeedback({ success: false, text: `Oups... La bonne réponse était : ${q.ans}` });
          speak(`La bonne réponse était ${q.ans}`);
          setTimeout(() => loadNewQuestion(), 2400);
        }
      };

      const handleDuelAnswer = (choice) => {
        if (isAnswering) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);
        const isCorrect = String(choice).trim() === String(q.ans).trim();

        if (isCorrect) {
          setDuelScores(prev => {
            const updated = { ...prev, [`p${activePlayerTurn}`]: prev[`p${activePlayerTurn}`] + 1 };
            if (updated[`p${activePlayerTurn}`] >= 5) setDuelWinner(activePlayerTurn);
            return updated;
          });
          setFeedback({ success: true, text: `Joueur ${activePlayerTurn} marque un point ! 🎉` });
        } else {
          setFeedback({ success: false, text: `Raté ! C'était ${q.ans}` });
        }

        setTimeout(() => {
          if (!duelWinner) {
            setActivePlayerTurn(prev => (prev === 1 ? 2 : 1));
            loadNewQuestion();
          }
        }, 1800);
      };

      const theoremData = THEOREMS_EXPLANATIONS[module.type] || {
        title: `Le cours : ${module.name}`,
        why: "Comprendre les principes fondamentaux de ce module.",
        rule: "Applique rigoureusement les définitions de ton cours."
      };

      return (
        <div className="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-xl mx-auto shadow-2xl relative animate-pop">
          {showConfetti && <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20"><div className="confetti-piece">⭐ 🎉 🌟 🎈 ✨</div></div>}

          {showTheoremModal && (
            <div className="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-3xl z-30 p-6 flex flex-col justify-between animate-pop">
              <div>
                <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                  <h3 className="text-base font-black text-amber-400 flex items-center gap-2"><span>💡</span> {theoremData.title}</h3>
                  <button onClick={() => setShowTheoremModal(false)} className="text-slate-400 hover:text-white font-bold text-sm px-3 py-1 bg-slate-800 rounded-xl cursor-pointer">✕ Fermer</button>
                </div>
                <div className="space-y-4 text-sm">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <h4 className="font-extrabold text-indigo-400 mb-1 text-xs uppercase">Pourquoi apprend-on cela ?</h4>
                    <p className="text-slate-300">{theoremData.why}</p>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <h4 className="font-extrabold text-emerald-400 mb-1 text-xs uppercase">Règle clé</h4>
                    <p className="text-slate-300">{theoremData.rule}</p>
                  </div>
                </div>
              </div>
              <button onClick={() => speak(theoremData.why + ". " + theoremData.rule)} className="w-full bg-indigo-600/30 text-indigo-300 py-3 rounded-2xl text-xs font-bold border border-indigo-500/30 cursor-pointer flex items-center justify-center gap-2">🔊 Écouter l'explication</button>
            </div>
          )}

          <div className="flex justify-between items-center mb-6">
            <button onClick={onBack} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs cursor-pointer">← Retour</button>
            {module.type === 'mult_tables' && (
              <button onClick={() => { setIsDuel(!isDuel); setDuelScores({ p1: 0, p2: 0 }); setDuelWinner(null); setActivePlayerTurn(1); }} className={`px-4 py-2 rounded-xl text-xs font-black cursor-pointer ${isDuel ? 'bg-rose-600 text-white animate-pulse' : 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/40'}`}>⚔️ {isDuel ? 'Mode Solo' : 'Mode Duel'}</button>
            )}
            <button onClick={() => { setShowTheoremModal(true); speak(theoremData.why); }} className="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-2 rounded-xl text-xs font-black cursor-pointer">💡 Pourquoi & Théorème</button>
            {!isDuel && <span className="text-xs font-mono font-bold bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl">⏱️ {timeLeft}s</span>}
          </div>

          {isDuel && (
            <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl mb-6 flex justify-around items-center">
              <div className={`text-center p-2 rounded-xl ${activePlayerTurn === 1 ? 'bg-indigo-600/20 border border-indigo-500' : ''}`}><p className="text-xs font-bold text-indigo-400">Joueur 1</p><p className="text-2xl font-black text-white">{duelScores.p1} / 5</p></div>
              <div className="text-xl font-black text-slate-600">VS</div>
              <div className={`text-center p-2 rounded-xl ${activePlayerTurn === 2 ? 'bg-rose-600/20 border border-rose-500' : ''}`}><p className="text-xs font-bold text-rose-400">Joueur 2</p><p className="text-2xl font-black text-white">{duelScores.p2} / 5</p></div>
            </div>
          )}

          {duelWinner ? (
            <div className="text-center py-10 space-y-4 animate-pop">
              <div className="text-5xl">🏆</div>
              <h2 className="text-2xl font-black text-amber-400">Victoire du Joueur {duelWinner} !</h2>
              <button onClick={() => { setDuelScores({ p1: 0, p2: 0 }); setDuelWinner(null); setActivePlayerTurn(1); loadNewQuestion(); }} className="bg-indigo-600 text-white font-black px-6 py-3 rounded-2xl text-sm cursor-pointer">Rejouer un Duel ⚔️</button>
            </div>
          ) : (
            <>
              <div className="text-center my-6">
                <div className="text-4xl mb-3">{isDuel ? (activePlayerTurn === 1 ? '🔵' : '🔴') : module.icon}</div>
                <h2 className="text-lg sm:text-xl font-black text-white bg-slate-950/60 p-4 rounded-2xl border border-slate-800">{q.text}</h2>
              </div>
              {feedback && <div className={`p-4 rounded-2xl mb-6 text-center font-black text-sm animate-pop ${feedback.success ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'}`}>{feedback.text}</div>}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {q.options.map((opt, idx) => (
                  <button key={idx} disabled={isAnswering} onClick={() => isDuel ? handleDuelAnswer(opt) : handleAnswer(opt)} className="bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-400 font-black py-4 px-4 rounded-2xl text-white transition cursor-pointer disabled:opacity-50">{opt}</button>
                ))}
              </div>
            </>
          )}
        </div>
      );
    }

    function App() {
      const [userName, setUserName] = useState('');
      const [selectedGrade, setSelectedGrade] = useState('6ème');
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeModule, setActiveModule] = useState(null);
      const [score, setScore] = useState(0);

      const handleLogin = (e) => {
        e.preventDefault();
        if (userName.trim()) {
          setIsLoggedIn(true);
          speak(`Bienvenue ${userName} !`);
        }
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl animate-pop text-center">
              <div className="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 shadow-lg shadow-indigo-600/30">🎓</div>
              <h1 className="text-2xl font-black text-white mb-2">MathsAcademy</h1>
              <form onSubmit={handleLogin} className="space-y-4 text-left">
                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">Prénom</label>
                  <input type="text" required value={userName} onChange={(e) => setUserName(e.target.value)} placeholder="Ton prénom..." className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-white font-bold outline-none focus:border-indigo-500" />
                </div>
                <div>
                  <label className="block text-xs font-extrabold text-indigo-400 uppercase mb-2">Niveau</label>
                  <select value={selectedGrade} onChange={(e) => setSelectedGrade(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-white font-bold outline-none focus:border-indigo-500 cursor-pointer">
                    {[...GRADES_ROW_1, ...GRADES_ROW_2].map(g => <option key={g} value={g}>{g}</option>)}
                  </select>
                </div>
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer">COMMENCER</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-between">
          <div>
            <header className="flex justify-between items-center py-4 border-b border-slate-800 mb-6">
              <div className="flex items-center gap-3">
                <span className="text-3xl">🎓</span>
                <div><h1 className="text-base font-black text-white">MathsAcademy</h1><p className="text-xs text-slate-400">Joueur : <span className="font-bold text-white">{userName} ({selectedGrade})</span></p></div>
              </div>
              <div className="bg-slate-900 border border-amber-500/30 px-4 py-2 rounded-2xl flex items-center gap-2"><span className="text-amber-400 text-lg">⭐</span><span className="text-sm font-black text-amber-400">{score} XP</span></div>
            </header>

            <main className="mb-8">
              {!activeModule ? (
                <>
                  <div className="flex flex-col gap-2 mb-8">
                    <div className="flex flex-wrap gap-2">
                      {GRADES_ROW_1.map(g => (
                        <button key={g} onClick={() => setSelectedGrade(g)} className={`px-4 py-2 rounded-2xl font-extrabold text-xs transition cursor-pointer ${selectedGrade === g ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white'}`}>{g}</button>
                      ))}
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {GRADES_ROW_2.map(g => (
                        <button key={g} onClick={() => setSelectedGrade(g)} className={`px-4 py-2 rounded-2xl font-extrabold text-xs transition cursor-pointer ${selectedGrade === g ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 scale-105' : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-white'}`}>{g}</button>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
                    {CURRICULUM[selectedGrade]?.map(m => (
                      <div key={m.id} onClick={() => setActiveModule(m)} className="bg-slate-900 border border-slate-800 hover:border-indigo-500 hover:bg-indigo-950/20 p-6 rounded-3xl transition flex flex-col justify-between h-40 shadow-lg cursor-pointer group">
                        <div className="flex items-start justify-between">
                          <span className="text-3xl bg-slate-950 p-2.5 rounded-2xl border border-slate-800 group-hover:scale-110 transition">{m.icon}</span>
                          <span className="text-[10px] font-extrabold uppercase text-slate-400 bg-slate-800 px-2.5 py-1 rounded-xl">{m.domain}</span>
                        </div>
                        <div><h3 className="font-extrabold text-base text-white group-hover:text-indigo-400 transition">{m.name}</h3></div>
                      </div>
                    ))}
                  </div>
                </>
              ) : (
                <ExerciseRunner userName={userName} grade={selectedGrade} module={activeModule} onBack={() => setActiveModule(null)} onResult={(xp) => setScore(s => s + xp)} />
              )}
            </main>
          </div>

          <footer className="py-4 border-t border-slate-900 flex justify-between items-center text-xs text-slate-500">
            <button onClick={() => { setIsLoggedIn(false); setActiveModule(null); }} className="hover:text-indigo-400 cursor-pointer underline">Changer d'élève</button>
            <span>MathsAcademy © 2026</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
