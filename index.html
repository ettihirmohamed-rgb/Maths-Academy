    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes bounceHappy {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-90px) rotate(360deg); opacity: 0; }
    }
    .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-happy { animation: bounceHappy 0.45s ease; }
    .confetti-piece {
      position: absolute;
      font-size: 1.6rem;
      pointer-events: none;
      animation: confetti 1.1s ease-out forwards;
    }

    const speak = (text) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        u.rate = 0.88;
        u.pitch = 1.05;
        window.speechSynthesis.speak(u);
      }
    };

    // ======================================================
    // GÉNÉRATEUR DE QUESTIONS
    // ======================================================
    function generateQuestion(type) {
      let text = '', ans = '', opts = [], speakText = '';

      // ——— MATERNELLE ———
      if (type === 'ps_formes') {
        text = "Où est le rond ?";
        speakText = "Où est le rond ? Appuie sur le rond.";
        ans = "🔴"; opts = ["🔴", "🟦", "🔺", "⭐"];

        const n = Math.floor(Math.random() * 3) + 1;
        text = `Combien d'étoiles ?\n${'⭐'.repeat(n)}`;
        speakText = `Combien d'étoiles vois-tu ?`;
        ans = `${n}`; opts = ["1", "2", "3"];
      } else if (type === 'ps_tailles') {
        text = "Qui est le plus grand ?";
        speakText = "Qui est le plus grand ?";
        ans = "🐘"; opts = ["🐘", "🐭", "🐱", "🐶"];
      } else if (type === 'ps_espace') {
        text = "Où est le soleil ?";
        speakText = "Où est le soleil ? En haut ou en bas ?";
        ans = "☁️ En haut"; opts = ["☁️ En haut", "⬇️ En bas"];
      } else if (type === 'ms_count6') {
        const n = Math.floor(Math.random() * 4) + 3;
        text = `Combien de pommes ?\n${'🍎'.repeat(n)}`;
        speakText = "Compte les pommes. Combien y en a-t-il ?";
        ans = `${n}`; opts = [`${n}`, `${n+1}`, `${n-1}`, "4"].filter(x => +x > 0);

        const n = Math.floor(Math.random() * 5) + 1;
        text = `Quel chiffre pour\n${'🔵'.repeat(n)} ?`;
        speakText = "Quel chiffre correspond à ces ronds bleus ?";
        ans = `${n}`; opts = [`${n}`, `${n+1}`, `${Math.max(1,n-1)}`, `${n+2}`];
      } else if (type === 'ms_formes') {
        text = "Quelle forme a 3 côtés ?";
        speakText = "Quelle forme a trois côtés ?";
        ans = "🔺"; opts = ["🔺", "🟦", "🔴", "▭"];
      } else if (type === 'ms_rythme') {
        text = "Quel est le suivant ?\n🔴 🔵 🔴 🔵 ...";
        speakText = "Regarde le rythme : rouge, bleu, rouge, bleu... Quel est le suivant ?";
        ans = "🔴"; opts = ["🔴", "🔵", "🟢", "🟡"];
      } else if (type === 'ms_comparer') {
        text = "Quelle collection a le plus ?\n⭐⭐⭐   ou   🍎🍎";
        speakText = "Quelle collection a le plus d'objets ?";
        ans = "⭐⭐⭐"; opts = ["⭐⭐⭐", "🍎🍎"];
      } else if (type === 'gs_chaine') {
        const n = Math.floor(Math.random() * 8) + 2;
        text = `Quel nombre vient après ${n} ?`;
        speakText = `Quel nombre vient juste après ${n} ?`;
        ans = `${n+1}`; opts = [`${n+1}`, `${n+2}`, `${n-1}`, `${n}`];
      } else if (type === 'gs_decomp') {
        const n = Math.floor(Math.random() * 4) + 4;
        const p = Math.floor(Math.random() * (n-1)) + 1;
        text = `${n} c'est ${p} et encore ... ?`;
        speakText = `${n} c'est ${p} et encore combien ?`;
        ans = `${n-p}`; opts = [`${n-p}`, `${n-p+1}`, `${n}`, "1"];
      } else if (type === 'gs_formes') {
        text = "Quelle forme a 4 côtés égaux\net 4 angles droits ?";
        speakText = "Quelle forme a quatre côtés égaux et quatre angles droits ?";
        ans = "🟦 Carré"; opts = ["🟦 Carré", "▭ Rectangle", "🔺 Triangle", "🔴 Cercle"];
      } else if (type === 'gs_espace') {
        text = "Ma main droite pointe vers...";
        speakText = "Ma main droite pointe vers quelle direction ?";
        ans = "👉 L'est"; opts = ["👉 L'est", "👈 L'ouest", "⬆️ Le nord", "⬇️ Le sud"];
      } else if (type === 'gs_masse') {
        text = "Qui est le plus lourd ?";
        speakText = "Qui est le plus lourd ?";
        ans = "🚗"; opts = ["🚗", "🎈", "🪶", "📱"];
      }

      // ——— CP ———
      else if (type === 'cp_num100') {
        const n = Math.floor(Math.random()*70)+20;
        text = `Quel nombre vient juste avant ${n+1} ?`;
        ans = `${n}`; opts = [`${n}`, `${n+1}`, `${n-1}`, `${n+10}`];
      } else if (type === 'cp_add') {
        const a = Math.floor(Math.random()*9)+1, b = Math.floor(Math.random()*9)+1;
        text = `${a} + ${b} = ?`; ans = `${a+b}`; opts = [`${a+b}`, `${a+b+1}`, `${a+b-1}`, `${a*b}`];
      } else if (type === 'cp_soustraction') {
        const a = Math.floor(Math.random()*10)+10, b = Math.floor(Math.random()*8)+1;
        text = `${a} − ${b} = ?`; ans = `${a-b}`; opts = [`${a-b}`, `${a-b+1}`, `${a+b}`, `${a-b-1}`];
      } else if (type === 'cp_regle') {
        text = "Pour tracer un trait parfaitement droit, on utilise :";
        ans = "Une règle"; opts = ["Une règle", "Un compas", "Une équerre", "Un crayon seul"];
      } else if (type === 'cp_monnaie') {
        text = "1 euro et 50 centimes = ?";
        ans = "1,50 €"; opts = ["1,50 €", "1,05 €", "15 €", "0,50 €"];
      } else if (type === 'cp_heure') {
        text = "3 heures et demie = ?";
        ans = "3 h 30"; opts = ["3 h 30", "3 h 00", "2 h 30", "4 h 00"];
      }

      // ——— CE1 ———
      else if (type === 'ce1_num1000') {
        const n = Math.floor(Math.random()*400)+500;

        ans = `${n+1}`; opts = [`${n+1}`, `${n+10}`, `${n-1}`, `${n+100}`];

      } else if (type === 'ce1_soustraction') {

      // ——— CE2 ———
      else if (type === 'ce2_num10000') {
        const n = Math.floor(Math.random()*5000)+3000;

        ans = `${Math.floor(n/1000)}`; opts = [`${Math.floor(n/1000)}`, `${Math.floor(n/100)}`, `${n%1000}`, "1"];

        const a = Math.floor(Math.random()*30)+12, b = Math.floor(Math.random()*6)+2;
        text = `${a} × ${b} = ?`; ans = `${a*b}`; opts = [`${a*b}`, `${a*b+5}`, `${a*b-3}`, `${a+b}`];
      } else if (type === 'ce2_division') {
        const d = Math.floor(Math.random()*5)+3, q = Math.floor(Math.random()*8)+4;
        text = `${d*q} ÷ ${d} = ?`; ans = `${q}`; opts = [`${q}`, `${q+1}`, `${q-1}`, `${d}`];
      } else if (type === 'ce2_tables') {
        const a = Math.floor(Math.random()*8)+2, b = Math.floor(Math.random()*8)+2;
        text = `${a} × ${b} = ?`; ans = `${a*b}`; opts = [`${a*b}`, `${a*b+3}`, `${a*b-2}`, `${a+b}`];
      } else if (type === 'ce2_figures') {
        text = "Un triangle rectangle possède :";
        ans = "Un angle droit"; opts = ["Un angle droit", "Trois angles droits", "Aucun angle droit", "Deux angles droits"];
      } else if (type === 'ce2_conversions') {
        text = "3 km = ? mètres";
        ans = "3000 m"; opts = ["3000 m", "300 m", "30 m", "30000 m"];
      }

      // ——— Seconde ———
      else if (type === 'sec_ensembles') {

        ans = "for i in range(5):"; opts = ["for i in range(5):", "repeat 5", "while 5", "loop 5"];

      // ——— 1ère ———
      else if (type === 'p1_second') {

      } else if (type === 'p1_derivee') {

        ans = "2x"; opts = ["2x", "x", "2", "x²"];
      } else if (type === 'p1_exp') {

        ans = "eˣ"; opts = ["eˣ", "x·eˣ", "1/eˣ", "e"];

      }

      // ——— Terminale ———
      else if (type === 'term_limites') {
        text = "lim (x→+∞) 1/x = ?";
        ans = "0"; opts = ["0", "+∞", "1", "−∞"];
      } else if (type === 'term_continuite') {
        text = "Le théorème des valeurs intermédiaires s'applique aux fonctions :";
        ans = "Continues sur un intervalle fermé";
        opts = ["Continues sur un intervalle fermé", "Uniquement dérivables", "Discontinues", "Périodiques"];
      } else if (type === 'term_log') {
        text = "La dérivée de ln(x) est :";
        ans = "1/x"; opts = ["1/x", "ln(x)", "x", "eˣ"];
      } else if (type === 'term_integrales') {
        text = "L'intégrale de 0 à 1 de 2x dx vaut :";
        ans = "1"; opts = ["1", "2", "0", "0,5"];
      } else if (type === 'term_espace') {
        text = "Dans l'espace, deux plans sont orthogonaux si leurs vecteurs normaux sont :";
        ans = "Orthogonaux"; opts = ["Orthogonaux", "Colinéaires", "De même norme", "Opposés"];
      } else if (type === 'term_binomiale') {
        text = "La loi binomiale modélise :";
        ans = "Le nombre de succès dans n épreuves indépendantes";
        opts = ["Le nombre de succès dans n épreuves indépendantes", "Une variable continue", "Uniquement des piles ou faces", "Des événements impossibles"];
      }

      // Fallback
      else {
        const a = Math.floor(Math.random()*8)+2, b = Math.floor(Math.random()*8)+2;
        text = `${a} × ${b} = ?`; ans = `${a*b}`; opts = [`${a*b}`, `${a*b+2}`, `${a*b-1}`, `${a+b}`];
      }

      opts = Array.from(new Set(opts.map(String))).slice(0, 4);
      while (opts.length < 4) opts.push(String(opts.length + 1));
      opts = opts.sort(() => Math.random() - 0.5);

      return { text, ans: String(ans), options: opts, speakText: speakText || text };
    }

    // ======================================================
    // COMPOSANT EXERCICE
    // ======================================================
    function ExerciseRunner({ userName, grade, module, onBack, onResult }) {
      const [q, setQ] = useState({ text: '', ans: '', options: [], speakText: '' });
      const [feedback, setFeedback] = useState(null);
      const [isAnswering, setIsAnswering] = useState(false);
      const [showConfetti, setShowConfetti] = useState(false);
      const [timeLeft, setTimeLeft] = useState(25);
      const isMat = IS_MATERNELLE(grade);
      const timerRef = useRef(null);

      const loadNewQuestion = useCallback(() => {
        setFeedback(null);
        setIsAnswering(false);
        setShowConfetti(false);
        const newQ = generateQuestion(module.type);
        setQ(newQ);
        if (isMat) {
          setTimeout(() => speak(newQ.speakText), 350);
        }
      }, [module.type, isMat]);

      useEffect(() => { loadNewQuestion(); }, [loadNewQuestion]);

      // Timer uniquement pour les non-maternelles
      useEffect(() => {
        if (isMat || feedback) return;
        setTimeLeft(25);
        timerRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              handleAnswer('');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timerRef.current);
      }, [q.text]);

      const handleAnswer = (val) => {
        if (isAnswering || feedback) return;
        setIsAnswering(true);
        clearInterval(timerRef.current);

        if (String(val) === q.ans) {
          const xp = isMat ? 15 : Math.max(5, timeLeft);
          setFeedback({ success: true, msg: `Bravo ${userName} ! (+${xp} XP)` });
          setShowConfetti(true);
          if (isMat) speak(`Bravo ${userName} ! C'est très bien !`);
          setTimeout(() => {
            onResult(xp);
            loadNewQuestion();
          }, 1600);
        } else {
          setFeedback({ success: false, msg: isMat ? `Essaie encore ${userName}` : `Ce n'est pas la bonne réponse.` });
          if (isMat) speak(`Ce n'est pas tout à fait ça. Essaie encore ${userName}.`);
          setTimeout(() => {
            setFeedback(null);
            setIsAnswering(false);
            if (!isMat) setTimeLeft(25);
          }, 1800);
        }
      };

      // ========== INTERFACE MATERNELLE ==========
      if (isMat) {
        return (
          <div className="bg-gradient-to-b from-indigo-950 to-slate-950 p-5 sm:p-8 rounded-3xl text-center max-w-lg mx-auto border-4 border-indigo-500/30 shadow-2xl animate-pop relative overflow-hidden">
            {showConfetti && (
              <>
                <span className="confetti-piece" style={{left:'15%', animationDelay:'0s'}}>🎉</span>
                <span className="confetti-piece" style={{left:'35%', animationDelay:'0.1s'}}>⭐</span>
                <span className="confetti-piece" style={{left:'55%', animationDelay:'0.2s'}}>🌟</span>
                <span className="confetti-piece" style={{left:'75%', animationDelay:'0.15s'}}>✨</span>
              </>
            )}

            <div className="flex justify-between items-center mb-5">
              <button onClick={onBack} className="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-2xl text-sm font-bold">
                ← Retour
              </button>
              <div className="text-pink-300 font-bold text-sm bg-pink-500/20 px-3 py-1 rounded-full">
                {module.icon} {module.name}
              </div>
            </div>

            <button
              onClick={() => speak(q.speakText)}
              className="mb-5 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white px-6 py-3 rounded-full font-bold text-base shadow-lg flex items-center gap-2 mx-auto active:scale-95 transition-all"
            >
              🔊 Écouter la consigne
            </button>

            <div className="bg-white/5 rounded-3xl p-6 mb-5 border border-white/10">
              <h2 className="text-2xl sm:text-3xl font-black text-white leading-snug whitespace-pre-line">
                {q.text}
              </h2>
            </div>

            {feedback && (
              <div className={`p-4 rounded-2xl mb-5 font-black text-lg animate-happy ${
                feedback.success
                  ? 'bg-emerald-500/30 text-emerald-200 border-2 border-emerald-400'
                  : 'bg-amber-500/30 text-amber-200 border-2 border-amber-400'
              }`}>
                {feedback.msg}
              </div>
            )}

            <div className="grid grid-cols-2 gap-4">
              {q.options.map((opt, i) => (
                <button
                  key={`${opt}-${i}`}
                  onClick={() => handleAnswer(opt)}
                  disabled={isAnswering || !!feedback}
                  className="bg-gradient-to-b from-indigo-500 to-indigo-700 hover:from-indigo-400 hover:to-indigo-600 disabled:opacity-50 text-white font-black text-2xl py-6 px-3 rounded-3xl border-4 border-indigo-300/30 shadow-xl active:scale-90 transition-all min-h-[80px] flex items-center justify-center"
                >
                  {opt}
                </button>
              ))}
            </div>

            <p className="mt-5 text-xs text-indigo-300/70">
              Touche la bonne réponse • Tu peux réécouter autant de fois que tu veux
            </p>
          </div>
        );
      }

      // ========== INTERFACE CLASSIQUE (CP → Terminale) ==========
      return (
        <div className="bg-slate-900/90 p-6 sm:p-8 rounded-3xl text-center max-w-lg mx-auto border border-slate-800 shadow-2xl animate-pop">
          <div className="flex justify-between items-center mb-4 gap-2 flex-wrap">
            <button onClick={onBack} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-black">
              ← RETOUR
            </button>
            <span className="text-xs font-black text-indigo-400 bg-indigo-950 px-3 py-1.5 rounded-xl border border-indigo-800/40 truncate max-w-[160px]">
              {grade} • {module.name}
            </span>
            <span className="text-xs font-mono font-bold bg-slate-800 text-amber-400 px-3 py-1.5 rounded-xl border border-amber-500/20">
              ⏱️ {timeLeft}s
            </span>
          </div>

          {module.domain && (
            <div className="text-xs text-slate-400 mb-3">Domaine : <span className="text-indigo-300">{module.domain}</span></div>
          )}

          <h2 className="text-xl sm:text-2xl font-black my-5 text-white leading-relaxed">{q.text}</h2>

          {feedback && (
            <div className={`p-3 rounded-xl mb-4 font-black text-sm ${
              feedback.success
                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
            }`}>
              {feedback.msg}
            </div>
          )}

          <div className="grid grid-cols-2 gap-3 mt-4">
            {q.options.map((opt, i) => (
              <button
                key={`${opt}-${i}`}
                onClick={() => handleAnswer(opt)}
                disabled={isAnswering || !!feedback}
                className="bg-slate-800 hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-black py-4 px-3 rounded-2xl border border-slate-700 hover:border-indigo-400 transition-all active:scale-95 text-base shadow-lg"
              >
                {opt}
              </button>
            ))}
          </div>
        </div>
      );
    }

                  </select>
                </div>

                <button type="submit" className="w-full bg-gradient-to-r from-pink-500 to-indigo-500 hover:from-pink-400 hover:to-indigo-400 text-white font-black py-4 rounded-2xl text-lg shadow-lg active:scale-95 transition-all">
                  C'est parti ! 🚀
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ——— ÉCRAN EXERCICE ———
      if (activeModule) {
        return (
          <div className="min-h-screen p-4 pt-6 bg-gradient-to-b from-indigo-950 to-slate-950">
            <div className="max-w-lg mx-auto mb-4 flex justify-between items-center">
              <div className="text-pink-300 font-bold">👋 {userName}</div>
              <div className="bg-amber-400/20 text-amber-300 px-4 py-1.5 rounded-full text-sm font-black border border-amber-400/40">
                ⭐ {score} XP
              </div>
            </div>
            <ExerciseRunner
              userName={userName}
              grade={selectedGrade}
              module={activeModule}
              onBack={() => setActiveModule(null)}
              onResult={(xp) => setScore(s => s + xp)}
            />
          </div>
        );
      }

      // ——— ÉCRAN SÉLECTION DES MODULES ———
      const modules = CURRICULUM[selectedGrade] || [];
      const isMat = IS_MATERNELLE(selectedGrade);

      return (
        <div className="min-h-screen p-4 pt-6 bg-gradient-to-b from-indigo-950 to-slate-950">
          <div className="max-w-4xl mx-auto">

            {/* Header */}
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
              <div>
                <h1 className="text-2xl font-black text-white flex items-center gap-2">
                  <span className="text-3xl">🎓</span>
                  MathsAcademy Montessori
                </h1>
                <p className="text-indigo-300 text-sm mt-1">
                  Joueur : <span className="text-white font-bold">{userName}</span> ({selectedGrade})
                </p>
              </div>
              <div className="bg-amber-400/20 text-amber-300 px-4 py-2 rounded-full font-black border border-amber-400/40">
                ⭐ {score} XP
              </div>
            </div>

            {/* Sélecteur de classes (pills) */}
            <div className="flex flex-wrap gap-2 mb-8 overflow-x-auto pb-2">
              {GRADES.map(g => (
                <button
                  key={g}
                  onClick={() => setSelectedGrade(g)}
                  className={`px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap transition-all ${
                    selectedGrade === g
                      ? 'bg-indigo-600 text-white shadow-lg'
                      : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white'
                  }`}
                >
                  {g}
                </button>
              ))}
            </div>

            {/* Grille des modules */}
            <div className={`grid gap-4 ${isMat ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3'}`}>
              {modules.map((mod) => (
                <button
                  key={mod.id}
                  onClick={() => setActiveModule(mod)}
                  className={`p-5 rounded-2xl text-left transition-all active:scale-95 border-2 ${
                    isMat
                      ? 'bg-gradient-to-br from-indigo-600/40 to-pink-600/30 border-pink-400/40 hover:border-pink-300'
                      : 'bg-slate-900/80 border-slate-700 hover:border-indigo-500 hover:bg-slate-800'
                  }`}
                >
                  <div className="text-3xl mb-3">{mod.icon}</div>
                  <div className="font-black text-white text-base leading-snug">{mod.name}</div>
                  {mod.domain && (
                    <div className="text-xs text-indigo-300 mt-2">{mod.domain}</div>
                  )}
                </button>
              ))}
            </div>

            {modules.length === 0 && (
              <p className="text-center text-slate-500 mt-10">Aucun module pour cette classe.</p>
            )}

            <button
              onClick={() => { setIsLoggedIn(false); setActiveModule(null); setScore(0); }}
              className="mt-10 text-sm text-slate-500 hover:text-slate-300 underline"
            >
              Changer d'élève
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
